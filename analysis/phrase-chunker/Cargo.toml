[package]
name = "turbo-phrase-chunker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "turbo_phrase_chunker"

[dependencies]
turbo-analysis = { path = "../core" }
turbo-analysis-layers = { path = "../layers" }
# The model archive and the classifier.
turbo-maxent = { path = "../maxent" }
# The beam search, the chunker's context generator and sequence validator.
turbo-sequence = { path = "../sequence" }
# The shared Java tag-pattern matcher for regex-style tag conditions.
turbo-jvm = { path = "../jvm" }
# Shared Unicode case folding for case-insensitive word literals.
turbo-unicode = { path = "../unicode" }

[dev-dependencies]
turbo-goldens = { path = "../goldens" }
# Writes a small model whose outcome holds half of a surrogate pair.
turbo-train = { path = "../train" }
