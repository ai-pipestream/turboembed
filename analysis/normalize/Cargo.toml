[package]
name = "turbo-normalize"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "turbo_normalize"

[dependencies]
turbo-analysis = { path = "../core" }
turbo-analysis-layers = { path = "../layers" }
turbo-encoding = { path = "../encoding" }
turbo-hunspell = { path = "../hunspell" }
turbo-morfologik = { path = "../morfologik" }
turbo-ngram = { path = "../ngram" }
turbo-normalize-layers = { path = "../normalize-layers" }
turbo-unicode = { path = "../unicode" }
# Frequency lexicons by zoo id (#935), without the HTTP transport: the
# caller hands the zoo its own.
turbo-zoo = { path = "../zoo", default-features = false }

[dev-dependencies]
turbo-goldens = { path = "../goldens" }
turbo-tokenize = { path = "../tokenize" }
# The real-lexicon tests fetch over HTTPS.
turbo-zoo = { path = "../zoo" }
