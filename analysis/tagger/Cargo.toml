[package]
name = "turbo-tagger"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "turbo_tagger"

[dependencies]
turbo = { path = "../../core" }
turbo-analysis = { path = "../core" }
turbo-analysis-layers = { path = "../layers" }
# The relation layer the relation classifier head writes (relation.rs).
turbo-relation = { path = "../relation" }
# The bundle encoder and its range write.
turbo-analysis-embed = { path = "../embed" }
# The lexicons that stand over the lemmatizer head (dictionaries.rs).
turbo-morfologik = { path = "../morfologik" }
turbo-wordnet = { path = "../wordnet" }
turbo-unicode = { path = "../unicode" }
turbo-zoo = { path = "../zoo", default-features = false }

[dev-dependencies]
serde_json = "1"
