[package]
name = "turbo-pii"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "turbo_pii"

[dependencies]
turbo-analysis = { path = "../core" }
turbo-analysis-layers = { path = "../layers" }
# Character.isLetterOrDigit(int) and Character.isWhitespace(int), which
# OpenNLP's boundary and label checks ask.
turbo-unicode = { path = "../unicode" }

[dev-dependencies]
# The goldens of the packs, made by OpenNLP on a JVM.
turbo-goldens = { path = "../goldens" }
