[package]
name = "turbo-formats"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "turbo_formats"

[dependencies]
# Span, the byte offsets every sample keeps into its source text.
turbo-analysis = { path = "../core" }
# Tokens, Words, Entities and the word-anchored layers for CoNLL-U and brat conversion.
turbo-analysis-layers = { path = "../layers" }
# Stopword flags for token tabular/JSON-LD document exports.
turbo-stopword-layers = { path = "../stopword-layers" }
# Unicode White_Space, which splits the lines of the whitespace
# separated formats.
turbo-unicode = { path = "../unicode" }
# The detokenizer the conversion streams rebuild text with.
turbo-tokenize = { path = "../tokenize" }
# The SAX-style XML reader the MASC stand-off files are parsed with.
turbo-maxent = { path = "../maxent" }

[dev-dependencies]
turbo-goldens = { path = "../goldens" }
turbo-normalize = { path = "../normalize" }
turbo-structure = { path = "../structure" }
