[package]
name = "turbo-formats"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "turbo_formats"

[dependencies]
# Span, the byte offsets every sample keeps into its source text.
turbo-analysis = { path = "../core" }
# OpenNLP's two whitespace definitions, which split the lines of the
# whitespace separated formats.
turbo-unicode = { path = "../unicode" }
# String.compareTo, which orders name types, and UTF-16 code units.
turbo-jvm = { path = "../jvm" }
# The detokenizer the conversion streams rebuild text with.
turbo-tokenize = { path = "../tokenize" }

[dev-dependencies]
turbo-goldens = { path = "../goldens" }
