[package]
name = "turbo-namefind"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "turbo_namefind"

[dependencies]
turbo-calibration = { path = "../calibration" }
turbo-sequence = { path = "../sequence" }
turbo-analysis = { path = "../core" }
turbo-analysis-layers = { path = "../layers" }
# Token patterns of RegexNameFinder.
turbo-matcher = { path = "../matcher" }
# The Java Character.toLowerCase mapping, for case-insensitive dictionaries.
turbo-unicode = { path = "../unicode" }
# The CRF model package the CRF annotators read (turbo-sequence's model
# file type; dropped when the CRF package reader moves off it).
turbo-maxent = { path = "../maxent" }

[dev-dependencies]
turbo-train = { path = "../train" }
