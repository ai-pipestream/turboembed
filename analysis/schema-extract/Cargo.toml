[package]
name = "turbo-schema-extract"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "turbo_schema_extract"

[dependencies]
# The native DeBERTa-v3 encoder, SentencePiece and safetensors reader, and
# the GLiNER2 span heads the relation scorer already runs.
turbo = { path = "../../core" }
serde_json = "1"
turbo-analysis = { path = "../core" }
turbo-analysis-layers = { path = "../layers" }
turbo-relation = { path = "../relation" }

[dev-dependencies]
# Packages the GLiNER2 encoder for the parity tests, as `turbo-bundle
# deberta-convert` does, and fetches the real checkpoint by digest.
turbo-bundle = { path = "../../bundle" }
turbo-zoo = { path = "../zoo" }
