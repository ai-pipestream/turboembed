[package]
name = "turbo-analysis-embed"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "turbo_analysis_embed"

[dependencies]
turbo-analysis = { path = "../core" }
turbo-analysis-layers = { path = "../layers" }
# The embedding model's own tokenizer, and later its vectors: the one
# analysis crate that depends on the core.
turbo = { path = "../../core" }

[dev-dependencies]
# The tests build the levels with the chunker crate's builder.
turbo-chunker = { path = "../chunker" }
# The lexicon sentiment baseline (#320), which tests/heads.rs compares
# against label centroids and classifier heads (#321).
turbo-doccat = { path = "../doccat" }
# The JVM's WordPiece goldens, which the pieces are compared with.
turbo-goldens = { path = "../goldens" }
# Tokenization for the lexicon sentiment baseline comparison.
turbo-tokenize = { path = "../tokenize" }
# Unicode's nonspacing marks, which the JVM's spans run over and ours
# do not (tests/goldens.rs).
turbo-unicode = { path = "../unicode" }
# The tests write a byte-level BPE bundle from a typed manifest.
serde_json = "1"
# The upstream tokenizer, which the WordPiece pieces and spans are
# compared with.
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
