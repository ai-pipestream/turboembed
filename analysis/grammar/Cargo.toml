[package]
name = "turbo-grammar"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "turbo_grammar"

[dependencies]
turbo-analysis = { path = "../core" }
turbo-analysis-layers = { path = "../layers" }
# Letter and currency classes for the lexer and the rules.
turbo-unicode = { path = "../unicode" }

[dev-dependencies]
# Reading the Recognizers-Text specification files in the conformance test.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
