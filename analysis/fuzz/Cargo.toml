[package]
name = "turbo-fuzz"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "turbo_fuzz"

[dependencies]
turbo-analysis = { path = "../core" }
turbo-analysis-layers = { path = "../layers" }
turbo-goldens = { path = "../goldens" }
turbo-unicode = { path = "../unicode" }
turbo-maxent = { path = "../maxent" }
turbo-sentdetect = { path = "../sentdetect" }
turbo-tokenize = { path = "../tokenize" }
turbo-postag = { path = "../postag" }
turbo-lemmatizer = { path = "../lemmatizer" }
turbo-phrase-chunker = { path = "../phrase-chunker" }
turbo-langdetect = { path = "../langdetect" }
turbo-normalize = { path = "../normalize" }
turbo-numeric = { path = "../numeric" }
# The WordPiece encoder, which brings the core crate with it: the one
# heavy dependency, kept so the subword goldens take part.
turbo-analysis-embed = { path = "../embed" }
