[package]
name = "turbo-postag"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "turbo_postag"

[dependencies]
# The CPU backend's packed matrix product, which the BiLSTM tagger runs on.
turbo = { path = "../../core" }
turbo-analysis = { path = "../core" }
turbo-analysis-layers = { path = "../layers" }
turbo-jvm = { path = "../jvm" }
# The model archive and the classifier.
turbo-maxent = { path = "../maxent" }
# The beam search, the part-of-speech context generators, the tag
# dictionary and the tag format conversion.
turbo-sequence = { path = "../sequence" }
turbo-unicode = { path = "../unicode" }

[dev-dependencies]
turbo-goldens = { path = "../goldens" }
# Writes a small model whose outcome holds half of a surrogate pair.
turbo-train = { path = "../train" }
