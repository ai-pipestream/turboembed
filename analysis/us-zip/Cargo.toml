[package]
name = "turbo-us-zip"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "turbo_us_zip"

[dependencies]
# GeoPoint, GeoBoundingBox and the gazetteer record a ZCTA becomes.
turbo-geo = { path = "../geo" }

[dev-dependencies]
# The input digests the table builder writes into each table's header.
turbo-sha256 = { path = "../sha256" }
