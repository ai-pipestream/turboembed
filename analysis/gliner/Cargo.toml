[package]
name = "turbo-gliner"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
turbo = { path = "../../core" }
turbo-analysis = { path = "../core" }
turbo-analysis-layers = { path = "../layers" }
# The encoder through the backend table, on any device (src/device.rs).
turbo-analysis-embed = { path = "../embed" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
turbo-bundle = { path = "../../bundle" }
turbo-zoo = { path = "../zoo" }
