[package]
name = "turbo-bpe-trainer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "turbo_bpe_trainer"

[[bin]]
name = "turbo-bpe-trainer"
path = "src/main.rs"

[dependencies]
# GPT-2's pattern and byte alphabet, so a byte-level model is trained on
# the words the core's encoder merges.
turbo = { path = "../../core" }
# OpenNLP's WhitespaceTokenizer, which cuts an OpenNLP corpus into words.
turbo-tokenize = { path = "../tokenize" }
# Java's string order, which orders an OpenNLP model's first symbols.
turbo-jvm = { path = "../jvm" }
# Unicode scripts, which a SentencePiece piece may not mix.
turbo-unicode = { path = "../unicode" }
# Strings escaped as JSON in tokenizer.json.
serde_json = "1"

[dev-dependencies]
# Upstream's trainer, which the byte-level models are compared with.
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
# The JVM's merges and tokens, which the OpenNLP models are compared with.
turbo-goldens = { path = "../goldens" }
