[package]
name = "turbo-zoo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "turbo_zoo"

[[bin]]
name = "turbo-zoo"
path = "src/main.rs"
required-features = ["http"]

[features]
default = ["http"]
# The HTTP transport. Without it the zoo still reads its index, checks
# licences and acceptances, and verifies files a caller's own transport
# fetched.
http = ["dep:ureq"]

[dependencies]
# The index and the acceptance file are strict JSON, as the bundle
# manifest is (docs/zoo.md).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SHA-256 as the bundle tool checks it, SHA-512 as OpenNLP's
# DownloadUtil checks it.
sha2 = "0.11"
ureq = { version = "3", optional = true }
