[package]
name = "turbo-example-docling"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "End to end: a document in docling's JSON form to chunks with levels, vectors and entities, offsets back to the docling items, in process and against turbo-kserve (docs/integration.md)."

[lib]
name = "turbo_example_docling"

[dependencies]
turbo-analysis = { path = "../../analysis/core" }
turbo-analysis-layers = { path = "../../analysis/layers" }
turbo-structure = { path = "../../analysis/structure" }
turbo-normalize = { path = "../../analysis/normalize" }
turbo-sentdetect = { path = "../../analysis/sentdetect" }
turbo-tokenize = { path = "../../analysis/tokenize" }
turbo-namefind = { path = "../../analysis/namefind" }
turbo-maxent = { path = "../../analysis/maxent" }
turbo-chunker = { path = "../../analysis/chunker" }
turbo-analysis-embed = { path = "../../analysis/embed" }
# Reads docling's JSON and writes the report; already in the workspace.
serde_json = "1"
# The server client: turbo-kserve's generated stubs and codec registry, and
# the gRPC runtime it is built on; all already in the workspace.
turbo-kserve = { path = "../../server" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "channel"] }

[dev-dependencies]
# The CPU's runtime index, for the in-process server the test starts.
turbo = { path = "../../core" }
