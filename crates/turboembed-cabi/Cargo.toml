[package]
name = "turboembed-cabi"
description = "Installable shared library exporting the frozen turboembed.h C ABI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "turboembed"
crate-type = ["cdylib"]

[features]
# NVIDIA ORT CUDA provider (the M4 packaged configuration). Off by default so
# the ordinary workspace build does not require the ORT download or CUDA
# toolchain; the release script builds with this feature.
ort-cuda = ["turboembed/ort-cuda"]

[dependencies]
turboembed = { workspace = true }
