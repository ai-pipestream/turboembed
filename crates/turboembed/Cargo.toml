[package]
name = "turboembed"
description = "Safe zero-copy Rust wrapper over the TurboEmbed C ABI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
# Additive Linux SDK; set TURBOEMBED_PREPARED_SDK to its installed prefix.
prepared = []
# Real in-process ov::genai::TextEmbeddingPipeline on Intel CPU or GPU.
# Explicit device string; GPU / NPU request never silently compiles CPU.
# NPU create fails loud when the plugin is missing (Machine B has none).
# No OVMS, no mock-as-done. See docs/intel-genai-embed.md.
genai = []
# Real ONNX Runtime on NVIDIA. CUDA / AUTO: CUDA EP + IoBinding
# (error_on_failure; never a silent CPU fallback). Explicit CPU:
# CPU EP, same ONNX + mean+L2. Catalog aliases error without this
# feature. CUDA 13 user-space libs: .libs/nvidia/lib. See docs/turboembed.md.
ort-cuda = ["dep:ort", "dep:tokenizers", "dep:inferstream-backend-ort", "dep:serde", "dep:toml"]
# Live Metal MiniLM via libTurboEmbed.dylib (macOS only).
# cargo test -p turboembed --features mlx-live -- --include-ignored --nocapture
mlx-live = []
# Raspberry Pi AI HAT+ (Hailo-8/8L; Hailo-10H later): native HailoRT provider
# behind the C ABI. Pi-only: the build fails without hailo/hailort.h
# (apt install hailo-all or hailo-h10-all). See docs/hailo-embed.md.
hailo = []

[dependencies]
thiserror = { workspace = true }
inferstream-backend-ort = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
ort = { version = "2.0.0-rc.13", optional = true, features = ["cuda", "tensorrt"] }
tokenizers = { workspace = true, optional = true }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokenizers = { workspace = true }

[build-dependencies]
cc = "1"
