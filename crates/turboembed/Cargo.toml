[package]
name = "turboembed"
description = "Safe zero-copy Rust wrapper over the TurboEmbed C ABI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
# Real in-process ov::genai::TextEmbeddingPipeline on Intel CPU or GPU.
# Explicit device string; GPU request never silently compiles CPU.
# No OVMS, no mock-as-done. See docs/intel-genai-embed.md.
genai = []

[dependencies]
thiserror = { workspace = true }

[build-dependencies]
cc = "1"

[dev-dependencies]
serde_json = { workspace = true }
