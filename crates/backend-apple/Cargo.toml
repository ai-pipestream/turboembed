[package]
name = "inferstream-backend-apple"
description = "Apple MLX backend — in-process native MLX (Swift FFI), macOS hosts only"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
# Live tests against a real Metal device + fetched MLX weights (macOS only).
# Run: cargo test -p inferstream-backend-apple --features mlx-live -- --ignored
mlx-live = []

[dependencies]
inferstream-protocol = { workspace = true }
inferstream-backend = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tokio-stream = { workspace = true }
tracing = { workspace = true }
