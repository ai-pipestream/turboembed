[package]
name = "inferstream-backend-openvino"
description = "OpenVINO GenAI TextEmbeddingPipeline backend — Intel CPU/GPU/NPU"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
# Real in-process link: cxx → OpenVINO GenAI C++ TextEmbeddingPipeline.
# Needs OpenVINO + OpenVINO GenAI + openvino-tokenizers on the host
# (see docs/intel-genai-embed.md). Default CI stays on the stub.
genai = ["dep:cxx"]

[dependencies]
inferstream-protocol = { workspace = true }
inferstream-backend = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
cxx = { version = "1.0", optional = true }

[build-dependencies]
cxx-build = "1.0"

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true }
