[package]
name = "inferstream-arch-intel"
description = "inferstream-intel: Intel arch binary — OpenVINO primary (CPU/GPU/NPU), llama.cpp-SYCL (oneAPI/Level Zero) secondary"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "inferstream-intel"
path = "src/main.rs"

[features]
# Stub crates compile everywhere; the routing surface is on by default. Real
# engine links (SYCL llama.cpp build, OpenVINO runtime) are host requirements
# documented in the backend crates.
default = ["llamacpp", "openvino", "ort"]
llamacpp = ["dep:inferstream-backend-llamacpp"]
# Real llama.cpp link (CPU). Builds llama.cpp from source via cmake.
llamacpp-runtime = ["llamacpp", "inferstream-backend-llamacpp/runtime"]
# llama.cpp with GGML_SYCL — GGUF generation with full Level Zero offload.
# Needs Intel oneAPI (icx/icpx) at build time, GGML_SYCL=ON, and
# scripts/setup-llamacpp-sycl.sh so ggml-sycl sources are on the cmake path.
llamacpp-sycl = ["llamacpp-runtime", "inferstream-backend-llamacpp/sycl"]
openvino = ["dep:inferstream-backend-turboembed"]
# In-process OpenVINO GenAI via TurboEmbed C ABI. Needs OpenVINO +
# OpenVINO GenAI + openvino-tokenizers on the host. Default Intel embed path.
openvino-genai = ["openvino", "inferstream-backend-turboembed/genai"]
ort = ["dep:inferstream-backend-turboembed"]
# Real ONNX Runtime via TurboEmbed (CPU EP). Catalog Intel embeds stay GenAI.
ort-runtime = ["ort", "inferstream-backend-turboembed/ort-cuda"]
# Catalog MiniLM-L6 cross-encoder via include/turborerank.h (OpenVINO
# when the toolkit is present; CPU otherwise). Missing IR/weights fail loud.
turborerank = ["dep:inferstream-backend-turborerank"]

[dependencies]
inferstream-server = { workspace = true }
inferstream-backend = { workspace = true }
inferstream-backend-mock = { workspace = true }
inferstream-backend-llamacpp = { workspace = true, optional = true }
inferstream-backend-turboembed = { workspace = true, optional = true }
inferstream-backend-turborerank = { workspace = true, optional = true }
tokio = { workspace = true }

[dev-dependencies]
inferstream-protocol = { workspace = true }
tonic = { workspace = true }
