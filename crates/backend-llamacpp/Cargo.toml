[package]
name = "inferstream-backend-llamacpp"
description = "llama.cpp (GGUF) backend for inferstream — token streaming and GGUF tokenization"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
# Real llama.cpp link via the maintained `llama-cpp-2` crate (utilityai).
# Builds llama.cpp from source with cmake at compile time, so a C/C++
# toolchain is required (plus nvcc for `cuda`). Without this feature the
# crate stays pure Rust and reports Unavailable at request time.
runtime = [
    "dep:llama-cpp-2",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:futures",
    "dep:tracing",
]
# CUDA build of llama.cpp (GGML_CUDA). Needs the CUDA toolkit (nvcc) at build
# time and the NVIDIA driver at runtime. On hosts where the default gcc is
# newer than nvcc supports, point cmake at a compatible host compiler, e.g.:
#   CUDAHOSTCXX=/usr/bin/g++-13 cargo build --features cuda
cuda = ["runtime", "llama-cpp-2/cuda"]
# Metal build (macOS).
metal = ["runtime", "llama-cpp-2/metal"]

[dependencies]
inferstream-protocol = { workspace = true }
inferstream-backend = { workspace = true }
async-trait = { workspace = true }

llama-cpp-2 = { version = "0.1.156", optional = true, features = ["sampler"] }
tokio = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
futures = { workspace = true }
