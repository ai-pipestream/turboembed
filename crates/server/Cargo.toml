[package]
name = "inferstream-server"
description = "inferstream: multi-backend KServe OIP V2 gRPC streaming inference façade"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "inferstream"
path = "src/main.rs"

[dependencies]
# Engine backends live in the arch binaries (crates/arch-*); this shared
# crate only knows the mock backend and the BackendFactory seam.
inferstream-protocol = { workspace = true }
inferstream-backend = { workspace = true }
inferstream-backend-mock = { workspace = true }

tonic = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
