[package]
name = "inferstream-arch-nvidia"
description = "inferstream-nvidia: NVIDIA arch binary — ONNX Runtime CUDA/TRT-EP embeddings primary, llama.cpp-CUDA secondary, TRT-LLM Executor deferred"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "inferstream-nvidia"
path = "src/main.rs"

[features]
# The stub crates compile everywhere, so the routing surface is enabled by
# default; only the actual engine links need GPU-host toolchains and are
# opt-in.
default = ["trtllm", "llamacpp", "ort"]
trtllm = ["dep:inferstream-backend-trtllm"]
# Real Executor link — requires CUDA toolchain + TRT-LLM libs; not in CI.
# Optional later feature: ORT (below) is the current primary embedding path.
trtllm-sys = ["trtllm", "inferstream-backend-trtllm/trtllm-sys"]
llamacpp = ["dep:inferstream-backend-llamacpp"]
# Real llama.cpp link (CPU). Builds llama.cpp from source via cmake — needs a
# C/C++ toolchain; no GPU stack required.
llamacpp-runtime = ["llamacpp", "inferstream-backend-llamacpp/runtime"]
# llama.cpp with GGML_CUDA — GGUF generation with full GPU offload. Needs the
# CUDA toolkit (nvcc) at build time; if the host's default gcc is newer than
# nvcc supports, set CUDAHOSTCXX (e.g. /usr/bin/g++-13).
llamacpp-cuda = ["llamacpp-runtime", "inferstream-backend-llamacpp/cuda"]
# Convenience: everything real on a krick-class NVIDIA host.
full-cuda = ["ort-cuda", "llamacpp-cuda"]
ort = ["dep:inferstream-backend-turboembed"]
# Real ONNX Runtime via TurboEmbed C ABI (CPU EP when device=cpu).
# `ort`'s download-binaries fetches a matching ONNX Runtime at build time.
ort-runtime = ["ort", "inferstream-backend-turboembed/ort-cuda"]
# CUDA EP — the primary embedding path on krick-class hosts. Needs the
# NVIDIA driver + CUDA 13 + cuDNN 9 at runtime (no TensorRT required).
# Catalog `backend = "ort"` is a thin gRPC façade over this ABI.
ort-cuda = ["ort-runtime"]
# TensorRT EP — not a TurboEmbed provider yet; fail loud at create.
ort-tensorrt = ["ort-cuda"]

[dependencies]
inferstream-server = { workspace = true }
inferstream-backend = { workspace = true }
inferstream-backend-mock = { workspace = true }
inferstream-backend-trtllm = { workspace = true, optional = true }
inferstream-backend-llamacpp = { workspace = true, optional = true }
inferstream-backend-turboembed = { workspace = true, optional = true }
tokio = { workspace = true }
