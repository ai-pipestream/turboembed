# cbindgen configuration for include/turbo/turbo.h.
# Run scripts/gen-header.sh; CI fails if the committed header drifts.

language = "C"
include_guard = "TURBO_H"
include_version = false
autogen_warning = "/* Generated by cbindgen from crates/turbo-abi and crates/turbo-capi. Do not edit; run scripts/gen-header.sh. */"
header = """/* SPDX-License-Identifier: Apache-2.0
 *
 * Turbo C ABI, version 2. One header for every provider and every binding.
 *
 * Conventions:
 *   - Every descriptor starts with uint32_t struct_size = sizeof(descriptor).
 *     The library reads only fields below that size. Appended fields have a
 *     zero value meaning "old behavior". Sizes larger than the library knows
 *     are rejected with TURBO_E_INVALID_STRUCT_SIZE.
 *   - Enumerations are uint32_t constants. Unknown values are rejected with
 *     TURBO_E_INVALID_ENUM, never mapped to a default.
 *   - Strings are UTF-8 pointer+length views (turbo_text), valid for the
 *     duration of the call. Invalid UTF-8 is TURBO_E_INVALID_UTF8.
 *   - Errors go to the caller-owned turbo_error (may be NULL). There is no
 *     thread-local or shared error state.
 *   - Handles are opaque and reference counted. A child handle retains its
 *     parent; releasing a parent never invalidates a child. Release functions
 *     accept NULL.
 *   - Runtime, context, model, tokenizer: any thread. Session, generation,
 *     result: single owner; a concurrent call returns TURBO_E_BUSY.
 *   - Every per-call option maps to a TURBO_CAP_* bit. A provider honors the
 *     option exactly or the call fails with TURBO_E_UNSUPPORTED_OPTION and
 *     turbo_error.field names the option. Nothing is silently ignored.
 *   - AUTO device selection never picks a CPU. CPU runs only when selected.
 */"""
trailer = ""
tab_width = 4
line_length = 100
documentation = true
documentation_style = "doxy"
cpp_compat = true
sys_includes = ["stddef.h", "stdint.h", "stdbool.h"]
includes = ["turbo_types.h"]
no_includes = false
usize_is_size_t = true

[defines]

[export]
include = []
exclude = []
prefix = ""
item_types = ["functions"]
renaming_overrides_prefixing = true

[export.rename]

[fn]
rename_args = "None"
args = "vertical"
sort_by = "None"

[struct]
rename_fields = "None"
derive_eq = false

[enum]
rename_variants = "None"

[const]
allow_static_const = true
allow_constexpr = false
sort_by = "None"

[parse]
parse_deps = false
clean = false

[parse.expand]
crates = []
