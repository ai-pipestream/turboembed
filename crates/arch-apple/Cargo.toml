[package]
name = "inferstream-arch-apple"
description = "inferstream-apple: Apple arch binary — MLX on native macOS hosts (plus llama.cpp-Metal for GGUF)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "inferstream-apple"
path = "src/main.rs"

[dependencies]
# The MLX backend crate is pure Rust until mlx-rs lands, so this binary
# compiles (as a stub) on Linux too — CI type-checks the wiring, but the
# functional server only exists on a native macOS host.
inferstream-server = { workspace = true }
inferstream-backend = { workspace = true }
inferstream-backend-mock = { workspace = true }
inferstream-backend-apple = { workspace = true }
inferstream-backend-llamacpp = { workspace = true }
tokio = { workspace = true }
