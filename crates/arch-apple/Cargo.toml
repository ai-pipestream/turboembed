[package]
name = "inferstream-arch-apple"
description = "inferstream-apple: Apple arch binary — MLX on native macOS hosts (plus llama.cpp-Metal for GGUF)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "inferstream-apple"
path = "src/main.rs"

[dependencies]
# Compiles as a stub on Linux (CI type-checks the wiring). Functional
# server is macOS-only: in-process Swift MLX via inferstream-backend-apple.
inferstream-server = { workspace = true }
inferstream-backend = { workspace = true }
inferstream-backend-mock = { workspace = true }
inferstream-backend-apple = { workspace = true }
inferstream-backend-llamacpp = { workspace = true }
tokio = { workspace = true }
