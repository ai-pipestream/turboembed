[package]
name = "inferstream-backend-trtllm"
description = "TensorRT-LLM in-process Executor backend for inferstream (NVIDIA peak path)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = []
# Links the TensorRT-LLM Executor C++ runtime (libtensorrt_llm, nvinfer,
# CUDA). Requires a CUDA toolchain + TRT-LLM installation on the build host;
# never enabled in Linux CI. Without it this crate is a pure-Rust skeleton:
# config, tensor contract, and error surface compile everywhere.
trtllm-sys = []

[dependencies]
inferstream-protocol = { workspace = true }
inferstream-backend = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
