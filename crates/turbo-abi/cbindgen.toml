# Types and constants: include/turbo/turbo_types.h. Run scripts/gen-header.sh.
language = "C"
include_guard = "TURBO_TYPES_H"
include_version = false
autogen_warning = "/* Generated by cbindgen from crates/turbo-abi. Do not edit; run scripts/gen-header.sh. */"
header = "/* SPDX-License-Identifier: Apache-2.0 */"
tab_width = 4
line_length = 100
documentation = true
documentation_style = "doxy"
cpp_compat = true
sys_includes = ["stddef.h", "stdint.h", "stdbool.h"]
no_includes = false
usize_is_size_t = true
after_includes = """
/* Opaque, reference-counted handles. Only ever used behind pointers. */
typedef struct turbo_runtime turbo_runtime;
typedef struct turbo_context turbo_context;
typedef struct turbo_buffer turbo_buffer;
typedef struct turbo_model turbo_model;
typedef struct turbo_session turbo_session;
typedef struct turbo_result turbo_result;
typedef struct turbo_generation turbo_generation;
typedef struct turbo_tokenizer turbo_tokenizer;
typedef struct turbo_chunk_plan turbo_chunk_plan;
"""

[export]
# Every public type must be listed: cbindgen emits only referenced or listed items.
include = [
    "turbo_text",
    "turbo_kv",
    "turbo_error",
    "turbo_log_fn",
    "turbo_runtime_desc",
    "turbo_device_selector",
    "turbo_device_info",
    "turbo_capability",
    "turbo_context_desc",
    "turbo_buffer_desc",
    "turbo_native_handle",
    "turbo_model_desc",
    "turbo_model_info",
    "turbo_tensor_info",
    "turbo_session_desc",
    "turbo_embed_options",
    "turbo_rerank_options",
    "turbo_classify_options",
    "turbo_run_options",
    "turbo_token_batch",
    "turbo_session_stats",
    "turbo_result_info",
    "turbo_span",
    "turbo_message",
    "turbo_logit_bias",
    "turbo_generate_desc",
    "turbo_generation_chunk",
    "turbo_stream_fn",
    "turbo_encode_options",
    "turbo_tokenizer_info",
    "turbo_chunk_desc",
    "turbo_chunk",
]
exclude = ["turbo_provider_buffer", "turbo_provider_output", "turbo_provider_result", "turbo_provider_vtbl", "turbo_provider_get_fn", "TURBO_PROVIDER_ABI_VERSION"]
item_types = ["constants", "globals", "enums", "structs", "unions", "typedefs", "opaque"]
renaming_overrides_prefixing = true

[fn]
args = "vertical"

[struct]
rename_fields = "None"

[const]
allow_static_const = true
allow_constexpr = false
sort_by = "None"

[parse]
parse_deps = false
