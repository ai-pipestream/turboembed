# Provider plugin ABI: include/turbo/turbo_provider.h. Run scripts/gen-header.sh.
language = "C"
include_guard = "TURBO_PROVIDER_H"
include_version = false
autogen_warning = "/* Generated by cbindgen from crates/turbo-abi/src/provider.rs. Do not edit; run scripts/gen-header.sh. */"
header = """/* SPDX-License-Identifier: Apache-2.0
 *
 * Turbo provider plugin ABI. A provider library exports
 *
 *     const turbo_provider_vtbl *turbo_provider_get(uint32_t core_abi_version);
 *
 * returning a pointer to a static vtable, or NULL if it cannot serve that
 * ABI version. See the field documentation for ownership rules. Provider
 * functions must never unwind or throw across this boundary.
 */"""
tab_width = 4
line_length = 100
documentation = true
documentation_style = "doxy"
cpp_compat = true
sys_includes = ["stddef.h", "stdint.h", "stdbool.h"]
includes = ["turbo_types.h"]
no_includes = false
usize_is_size_t = true

[export]
include = ["turbo_provider_buffer", "turbo_provider_output", "turbo_provider_result", "turbo_provider_vtbl", "turbo_provider_get_fn", "TURBO_PROVIDER_ABI_VERSION"]
exclude = [
    "turbo_text",
    "turbo_kv",
    "turbo_error",
    "turbo_log_fn",
    "turbo_runtime_desc",
    "turbo_device_selector",
    "turbo_device_info",
    "turbo_capability",
    "turbo_context_desc",
    "turbo_buffer_desc",
    "turbo_native_handle",
    "turbo_model_desc",
    "turbo_model_info",
    "turbo_tensor_info",
    "turbo_session_desc",
    "turbo_embed_options",
    "turbo_rerank_options",
    "turbo_classify_options",
    "turbo_run_options",
    "turbo_token_batch",
    "turbo_session_stats",
    "turbo_result_info",
    "turbo_span",
    "turbo_message",
    "turbo_logit_bias",
    "turbo_generate_desc",
    "turbo_generation_chunk",
    "turbo_stream_fn",
    "turbo_encode_options",
    "turbo_tokenizer_info",
    "turbo_chunk_desc",
    "turbo_chunk",
    "TURBO_ABI_VERSION",
]
item_types = ["constants", "structs", "typedefs"]
renaming_overrides_prefixing = true

[fn]
args = "vertical"

[struct]
rename_fields = "None"

[const]
allow_static_const = true
allow_constexpr = false

[parse]
parse_deps = false
