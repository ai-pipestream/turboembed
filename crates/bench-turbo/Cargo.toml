[package]
name = "bench-turbo"
description = "Measured TurboEmbed + TurboRerank latency / H2D / alloc benches"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "bench-turbo"
path = "src/bin/bench-turbo.rs"

[[bin]]
name = "bench-turboembed"
path = "src/bin/bench-turboembed.rs"
required-features = ["embed"]

[[bin]]
name = "bench-turborerank"
path = "src/bin/bench-turborerank.rs"
required-features = ["rerank"]

[[bin]]
name = "bench-nvidia-overhead"
path = "src/bin/bench-nvidia-overhead.rs"
required-features = ["embed"]

[features]
embed = ["dep:turboembed", "dep:ort", "dep:tokenizers", "dep:toml"]
rerank = ["dep:turborerank"]

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
turboembed = { workspace = true, optional = true, features = ["ort-cuda"] }
turborerank = { workspace = true, optional = true }
# Direct-ORT reference for the matched NVIDIA overhead pilot. Same ort /
# tokenizers pins as the turboembed ort-cuda feature.
ort = { version = "2.0.0-rc.13", optional = true, features = ["cuda"] }
tokenizers = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
