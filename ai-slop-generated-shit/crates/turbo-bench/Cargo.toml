[package]
name = "turbo-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Benchmark harness and receipt writer for Turbo providers"
publish = false

[[bin]]
name = "turbo-bench"
path = "src/main.rs"

[dependencies]
turbo = { workspace = true }
turbo-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
