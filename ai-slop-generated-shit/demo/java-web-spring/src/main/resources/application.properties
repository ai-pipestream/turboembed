# What to serve. A model is either one entry of the turbo.models list or one of
# the two single-model shorthands; both forms are additive and may be combined.
#
#   --turbo.bundle=/opt/bundles/minilm-onnx
#     [--turbo.provider-lib=<provider .so>] [--turbo.provider=<id> --turbo.ordinal=<n>]
#     [--turbo.sessions=2] [--turbo.max-batch=0] [--turbo.name=<served name>]
#     [--turbo.tokenizer-bundle=<bundle with a tokenizer.json>]
#   --turbo.generate-bundle=/opt/bundles/qwen05-gguf
#     [--turbo.generate-provider-lib=<provider .so>] [--turbo.generate-provider=ggml --turbo.generate-ordinal=0]
#     [--turbo.generations=2] [--turbo.generate-name=<served name>]
#   --turbo.models[0].name=reranker --turbo.models[0].bundle=/opt/bundles/rerank-onnx
#     [--turbo.models[0].provider-lib=...] [--turbo.models[0].provider=cuda --turbo.models[0].ordinal=0]
#     [--turbo.models[0].sessions=2] [--turbo.models[0].max-batch=0] [--turbo.models[0].tokenizer-bundle=...]
#
# An omitted provider means AUTO, which never selects a CPU. A name left out is
# the last segment of the bundle's model_id, which GET /api/v1/models lists.
server.port=8080

# The API is snake_case on both surfaces: the Open Inference Protocol is, and
# so are the libturbo field names the options mirror.
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null
spring.jackson.mapper.accept-case-insensitive-enums=true

# Open Inference Protocol server identity (GET /v2).
turbo.oip.server-name=turbo
turbo.oip.server-version=2.0.0-alpha.0

# OpenAPI: /v3/api-docs and /swagger-ui.html.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.writer-with-order-by-keys=true
