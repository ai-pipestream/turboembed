<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turbo web demo</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<main>
  <header>
    <h1>Turbo</h1>
    <p id="device" class="muted">loading device…</p>
  </header>
  <section class="input">
    <label for="texts">One sentence per line</label>
    <textarea id="texts" rows="6">a brown dog runs through the grass
a dog is running on the lawn
the stock market closed higher</textarea>
    <div class="row">
      <button id="embed" type="button">Embed</button>
      <span id="status" class="muted" aria-live="polite"></span>
    </div>
  </section>
  <section id="result" hidden>
    <h2>Cosine similarity</h2>
    <table id="matrix"></table>
    <details>
      <summary>Vectors</summary>
      <pre id="vectors"></pre>
    </details>
  </section>
  <section id="error" class="error" hidden role="alert"></section>
  <section class="input" id="summarize-section">
    <h2>Summarize</h2>
    <p id="generator" class="muted">checking for a generative model…</p>
    <label for="document">Text to summarize</label>
    <textarea id="document" rows="8">The town library on Maple Street reopened on Saturday after two years of repairs. The old reading room now has tall windows, a corner for children with low shelves and cushions, and a small cafe run by volunteers from the garden club. About four hundred people came on the first day. The mayor cut a ribbon, the school choir sang two songs, and the head librarian read a picture book to the youngest visitors while their parents queued for new library cards. The building will stay open until eight on weekdays, which the council agreed to after a petition signed by six hundred residents.</textarea>
    <div class="row">
      <button id="summarize" type="button">Summarize</button>
      <span id="gen-status" class="muted" aria-live="polite"></span>
    </div>
    <pre id="summary" class="summary" hidden></pre>
    <section id="gen-error" class="error" hidden role="alert"></section>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
