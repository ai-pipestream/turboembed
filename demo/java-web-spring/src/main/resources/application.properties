# The bundle to serve (required): an embedding bundle directory.
#   --turbo.bundle=/opt/bundles/minilm-onnx
# Optional: turbo.provider-lib=<provider .so>, turbo.provider=<id> with turbo.ordinal=<n>
# (explicit device; omitted means AUTO, which never picks a CPU),
# turbo.sessions (default 2), turbo.max-batch (default 0: the model's own limit).
server.port=8080
spring.jackson.default-property-inclusion=non_null
