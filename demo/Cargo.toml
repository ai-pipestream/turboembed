[package]
name = "turbo-kserve-demo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "turbo_kserve_demo"
path = "src/lib.rs"

[[bin]]
name = "turbo-kserve-demo"
path = "src/main.rs"

[dependencies]
# The page and the Connect protocol, over HTTP/1.1.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# Message bytes, passed through to the server without decoding.
bytes = "1"
# Reads request bodies and streams replies; already under axum and tonic.
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
# A gRPC client of turbo-kserve only: the demo does not link the library.
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "channel"] }

[dev-dependencies]
# The tests start the real server in-process and build its messages.
turbo-kserve = { path = "../server" }
prost = "0.14"
# Finds the CPU's runtime index for the server the tests start.
turbo = { path = "../core" }
# The model catalog the InstallModel test serves.
turbo-zoo = { path = "../analysis/zoo", default-features = false }
# Checks the method table against the protos.
protox = "0.9"
