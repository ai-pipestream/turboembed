[package]
name = "turbo-kserve-demo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "turbo_kserve_demo"
path = "src/lib.rs"

[[bin]]
name = "turbo-kserve-demo"
path = "src/main.rs"

[dependencies]
# The page's JSON calls, over HTTP/1.1.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
# A gRPC client of turbo-kserve only: the demo does not link the library.
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "channel"] }
tonic-prost = "0.14"

[build-dependencies]
# Compiles the server's vendored .proto without protoc.
protox = "0.9"
tonic-prost-build = { version = "0.14", default-features = false, features = ["transport"] }

[dev-dependencies]
# The tests start the real server in-process.
turbo-kserve = { path = "../server" }
# Finds the CPU's runtime index for the server the tests start.
turbo = { path = "../core" }
