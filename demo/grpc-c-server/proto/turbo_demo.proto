// SPDX-License-Identifier: Apache-2.0
//
// A small embedding service over Turbo. The server owns one model and one
// session pool; a request is embedded on the device the server was started
// on. Errors from libturbo surface as gRPC status codes with the status name
// and message in the details, never as empty vectors.
syntax = "proto3";

package turbo.demo.v1;

option java_package = "ai.pipestream.turbo.demo.grpc";
option java_multiple_files = true;

service Embedder {
  // What the server is running on.
  rpc Info(InfoRequest) returns (InfoResponse);
  // Embed up to the session's batch of texts; one vector per text, in order.
  rpc Embed(EmbedRequest) returns (EmbedResponse);
}

message InfoRequest {}

message InfoResponse {
  string device_name = 1;
  string provider_id = 2;
  uint32 ordinal = 3;
  string runtime_version = 4;
  string model_id = 5;
  uint32 dim = 6;
  uint32 max_seq = 7;
  uint32 max_batch = 8;
  bool fully_accelerated = 9;
}

message EmbedRequest {
  repeated string texts = 1;
  // 0 = the bundle's limit; anything else must be within it or the call fails.
  uint32 max_tokens = 2;
}

message Embedding {
  repeated float values = 1;
}

message EmbedResponse {
  repeated Embedding embeddings = 1;
  uint32 dim = 2;
}
