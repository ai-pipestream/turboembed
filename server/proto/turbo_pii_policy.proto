// Typed PII redaction policy (issue #1882 part A).
//
// A RedactionPolicy says, per PII kind, whether the kind is detected and
// how its mentions are rewritten. It carries no server file path and no
// key bytes: keys and dictionaries are named by registered, versioned
// references the server resolves. Every enum's UNSPECIFIED value is
// refused. The policy's identity is its id, its revision and a SHA-256
// PolicyDigest over the canonical encoding described in
// docs/grpc-analysis.md ("Redaction policy"), never over protobuf bytes.
//
// SPDX-License-Identifier: Apache-2.0

syntax = "proto3";
package turbo.result.v1;

import "turbo_typed_annotations.proto";

message RedactionPolicy
{
  // The caller's name for the policy. Required.
  string id = 1;
  // The caller's version of the policy; part of its digest.
  uint64 revision = 2;
  // The policy's own custom kind names: PiiKindRef.custom anywhere in the
  // policy indexes this table. Names are unique and non-empty.
  repeated string custom_kinds = 3;
  // At most one rule per kind; a kind with no rule takes the default
  // strategy.
  repeated PiiKindRule kind_rules = 4;
  // What a kind with no rule, or a rule none of whose strategies apply,
  // is rewritten with. Unset: mask every character with '*'. It is a mask
  // or a keyed token, never a per-document pseudonym (EMAIL-1 collides
  // across a corpus) or an unkeyed SHA-256.
  PiiDefaultStrategy default_strategy = 5;
  // Terms and patterns that are never PII, for every kind.
  PiiAllowList allow = 6;
  // Terms that are always PII of a custom kind.
  repeated PiiDenyList deny = 7;
  // Shape patterns that find a custom kind.
  repeated PiiCustomIdentifier custom_identifiers = 8;
  // False (the default): a rule naming a kind id or a strategy this
  // server does not know is refused. True: such a rule is kept as a
  // whole-value '*' mask and flagged in the policy's conversion report.
  // A policy never passes a mention through unrewritten.
  bool redact_and_flag_unknown = 9;
}

// Whether a rule's kind is detected at all. UNSPECIFIED is refused.
enum PiiRuleState
{
  PII_RULE_STATE_UNSPECIFIED = 0;
  PII_RULE_STATE_ENABLED = 1;
  PII_RULE_STATE_DISABLED = 2;
}

// What the policy does with one kind.
message PiiKindRule
{
  // The caller's id for the rule, unique in the policy; every edit and
  // decision the rule causes names it. Required.
  string rule_id = 1;
  // The kind the rule applies to: a built-in PiiKindId, or an index into
  // RedactionPolicy.custom_kinds. Required; one rule per kind.
  PiiKindRef kind = 2;
  // Whether the kind is detected at all. UNSPECIFIED is refused.
  PiiRuleState state = 3;
  // Tried in order: the first entry whose conditions all hold rewrites the
  // mention. None holds: the policy's default strategy.
  repeated PiiStrategyEntry strategies = 4;
  // Terms and patterns that are never PII of this kind.
  PiiAllowList allow = 5;
  // Unset: the detector's label settings for the kind.
  PiiLabelOverride labels = 6;
  // The most a value release (#1909) gives out for the kind's mentions,
  // whatever the calling service is granted (#1943). Unset: no limit
  // beyond the grant. Set with no form: no form is released for the kind,
  // and its mentions are withheld with NOT_ALLOWED_BY_POLICY.
  PiiReleaseCeiling release_ceiling = 7;
}

// The value forms a release may give out for one kind: a capability set,
// never a ranking, intersected with the request, the server's output
// policy and the calling service's grant. Being a message, unset and
// empty differ.
message PiiReleaseCeiling
{
  // PII_VALUE_FORM_TOKEN, PII_VALUE_FORM_CIPHERTEXT or
  // PII_VALUE_FORM_CLEAR, each at most once; empty releases no form.
  // UNSPECIFIED, WITHHELD and unknown numbers are refused.
  repeated PiiValueForm forms = 1;
}

// Whether a kind needs a context label. UNSPECIFIED is refused.
enum PiiLabelRequirement
{
  PII_LABEL_REQUIREMENT_UNSPECIFIED = 0;
  // The context window is not inspected.
  PII_LABEL_REQUIREMENT_NONE = 1;
  // A candidate is kept only with a label fact.
  PII_LABEL_REQUIREMENT_REQUIRED = 2;
  // Unlabelled candidates are kept; a label is recorded as a fact.
  PII_LABEL_REQUIREMENT_BOOSTS = 3;
}

// A kind's context label settings.
message PiiLabelOverride
{
  // Whether the kind needs a context label. UNSPECIFIED is refused.
  PiiLabelRequirement requirement = 1;
  // Words either side of the mention searched for a label; 0 keeps the
  // detector's window.
  uint32 window_words = 2;
  // Label phrases added to the kind's defaults, in order.
  repeated string extra_labels = 3;
}

// One strategy of a rule and when it applies.
message PiiStrategyEntry
{
  // Every condition must hold; none means always.
  repeated PiiStrategyCondition when = 1;
  // The rewrite the entry applies when every condition holds. Required; an
  // unknown arm is refused unless the policy opts into redact-and-flag.
  PiiRewriteStrategy strategy = 2;
}

// A test over a mention's recorded evidence facts (#1903), never over its
// confidence tier.
message PiiStrategyCondition
{
  oneof test
  {
    // A checksum fact passed.
    PiiChecksumPassedCondition checksum_passed = 1;
    // A label fact is recorded.
    PiiLabelPresentCondition label_present = 2;
    // The detector that found the mention.
    PiiDetectorCondition detector = 3;
    // A score at least a threshold.
    PiiScoreCondition score_at_least = 4;
  }
}

// A checksum fact that passed, with one of `algorithms`; none listed means
// any algorithm. UNSPECIFIED is refused.
message PiiChecksumPassedCondition
{
  // Checksum algorithms (PiiChecksumAlgorithm values) any one of which
  // must have passed; empty means any algorithm.
  repeated PiiChecksumAlgorithm algorithms = 1;
}

// A label fact is recorded for the mention.
message PiiLabelPresentCondition {}

// The mention's detector has this id and, when `version` is not empty,
// this version.
message PiiDetectorCondition
{
  // The detector id (PiiDetectorRef.id). Required.
  string id = 1;
  // The detector version (PiiDetectorRef.version); empty matches any.
  string version = 2;
}

// The mention carries a score of `kind` at least `min`; with `calibrated`,
// only a calibrated score counts. UNSPECIFIED is refused.
message PiiScoreCondition
{
  // The score kind compared (PiiScore.kind). UNSPECIFIED is refused.
  PiiScoreKind kind = 1;
  // The least score that holds, in the kind's own scale: [0, 1] for
  // probability and heuristic, unbounded for logit. Finite.
  float min = 2;
  // Only a score whose PiiScore.calibrated is true counts.
  bool calibrated = 3;
}

// How a mention is rewritten: one typed message per strategy. Each arm
// maps to exactly one PiiStrategy value, the one a PiiEditAnnotation it
// writes records (named on each arm).
message PiiRewriteStrategy
{
  oneof strategy
  {
    // PII_STRATEGY_MASK
    PiiMaskStrategy mask = 1;
    // PII_STRATEGY_FORMAT
    PiiFormatStrategy format = 2;
    // PII_STRATEGY_MAP
    PiiMapStrategy map = 3;
    // PII_STRATEGY_TRUNCATE
    PiiTruncateStrategy truncate = 4;
    // PII_STRATEGY_TRUNCATE (a truncation keeping the end)
    PiiLastNStrategy last_n = 5;
    // PII_STRATEGY_ABBREVIATE
    PiiAbbreviateStrategy abbreviate = 6;
    // PII_STRATEGY_HMAC
    PiiKeyedTokenStrategy keyed_token = 7;
    // PII_STRATEGY_SHA256
    PiiSha256Strategy sha256 = 8;
    // PII_STRATEGY_STATIC
    PiiStaticStrategy static_text = 9;
    // PII_STRATEGY_PSEUDONYM
    PiiPseudonymStrategy pseudonym = 10;
    // PII_STRATEGY_ZIP_SAFE_HARBOR
    PiiZipSafeHarborStrategy zip_safe_harbor = 11;
  }
}

// What a policy falls back to: a mask or a keyed token only.
message PiiDefaultStrategy
{
  oneof strategy
  {
    // Mask every character.
    PiiMaskStrategy mask = 1;
    // A keyed HMAC-SHA-256 token under a registered key.
    PiiKeyedTokenStrategy keyed_token = 2;
  }
}

// Every character becomes `mask_char`, keeping the text's length.
message PiiMaskStrategy
{
  // One ASCII character; empty means '*'.
  string mask_char = 1;
  // Leave what is not a letter or digit readable.
  bool keep_format = 2;
}

// The mention becomes a label from a template: %t the upper-case kind
// name, %k the lower-case kind name, %v the mention's number in the
// document, %% a percent sign.
message PiiFormatStrategy
{
  // The template, UTF-8; %t, %k, %v and %% as above. Non-empty.
  string template = 1;
}

// Which side of a mention a truncation keeps. UNSPECIFIED is refused.
enum PiiKeepSide
{
  PII_KEEP_SIDE_UNSPECIFIED = 0;
  PII_KEEP_SIDE_START = 1;
  PII_KEEP_SIDE_END = 2;
}

// Keep `count` characters on `side` and mask the rest; a mention of at
// most `count` characters is masked whole.
message PiiTruncateStrategy
{
  // The side kept. UNSPECIFIED is refused.
  PiiKeepSide side = 1;
  // Characters kept (Unicode scalar values; letters and digits only with
  // `keep_format`). 0 masks the whole mention.
  uint32 count = 2;
  // One character; empty means '*'.
  string mask_char = 3;
  // Count letters and digits only and leave separators readable.
  bool keep_format = 4;
}

// Keep the last `count` characters (a truncation keeping the end).
message PiiLastNStrategy
{
  // Characters kept at the end (Unicode scalar values; letters and digits
  // only with `keep_format`). 0 masks the whole mention.
  uint32 count = 1;
  // One character; empty means '*'.
  string mask_char = 2;
  // Count letters and digits only and leave separators readable.
  bool keep_format = 3;
}

// Initials: each word's first letter joined by `separator` and followed by
// `trailing` (both empty: "JFK"; both ".": "J.F.K.").
message PiiAbbreviateStrategy
{
  // Written between initials, UTF-8; may be empty.
  string separator = 1;
  // Written after the last initial, UTF-8; may be empty.
  string trailing = 2;
  // A hyphenated word gives one initial per part, joined by '-'.
  bool preserve_hyphens = 3;
  // Keep each initial's case; false writes initials upper-case.
  bool preserve_case = 4;
}

// HIPAA Safe Harbor for a United States ZIP code (45 CFR
// 164.514(b)(2)(i)(B)): keep the first three digits, written as 000 when
// that three-digit area is restricted (20,000 people or fewer), and mask
// every other digit; the ZIP+4 hyphen stays ("62704-1234" becomes
// "627**-****"). A mention that is not five ASCII digits, optionally
// followed by '-' and four more, is masked whole, and so is a cluster of
// overlapping mentions.
message PiiZipSafeHarborStrategy
{
  // One character; empty means '*'.
  string mask_char = 1;
  // The restricted three-digit areas, each exactly three ASCII digits, at
  // most 1000. Empty means the 17 prefixes HHS published from the 2000
  // Census in its de-identification guidance.
  repeated string restricted_prefixes = 2;
}

// A registered, versioned key: never key material.
message PiiPolicyKeyRef
{
  // The registered key's id (`--pii-token-key ID:VERSION:PATH`): ASCII,
  // at most 128 bytes, never key material. Required.
  string id = 1;
  // The registered key's version, read unsigned. Required (not 0).
  uint32 version = 2;
}

// HMAC-SHA-256 of the normalized value under a registered key, as
// `length` hexadecimal digits (0 means 16; 4 to 64). Equal values under
// one key give equal tokens across documents.
message PiiKeyedTokenStrategy
{
  // The registered key. Required; an unregistered reference is refused.
  PiiPolicyKeyRef key = 1;
  // Hexadecimal digits written, 4 to 64; 0 means 16.
  uint32 length = 2;
}

// Unkeyed SHA-256 of the normalized value. Anyone can recompute it, so a
// low-entropy value (a phone number, an SSN) is reversible by guessing:
// prefer PiiKeyedTokenStrategy. Never a default.
message PiiSha256Strategy
{
  // Hexadecimal digits written, 4 to 64; 0 means 64.
  uint32 length = 1;
  // Write the upper-case kind name and '-' first.
  bool kind_prefix = 2;
  // Written before everything else.
  string prefix = 3;
}

// A fixed replacement text.
message PiiStaticStrategy
{
  // The text written for every mention, UTF-8. Non-empty.
  string replacement = 1;
}

// Per-document numbered labels such as [EMAIL-1]. The numbers restart in
// every document, so the same label names different values across a
// corpus. Never a default.
message PiiPseudonymStrategy
{
  // Written before the upper-case kind name, '-' and number, UTF-8, such
  // as '['; may be empty.
  string prefix = 1;
  // Written after the number, UTF-8, such as ']'; may be empty.
  string suffix = 2;
}

// Which form of a mention a map looks up. UNSPECIFIED is refused.
enum PiiMapTarget
{
  PII_MAP_TARGET_UNSPECIFIED = 0;
  // The normalized value, then the surface text.
  PII_MAP_TARGET_NORMALIZED_OR_SURFACE = 1;
  PII_MAP_TARGET_NORMALIZED = 2;
  PII_MAP_TARGET_SURFACE = 3;
}

// A lookup table from value to replacement.
message PiiMapStrategy
{
  oneof table
  {
    // The table inline.
    PiiMapEntries entries = 1;
    // A `headword-definition-tsv` dictionary of the vocabulary store: a
    // key, a tab and its replacement a line (#1882 part C).
    PiiDictionaryRef dictionary = 2;
  }
  // Look keys up case-sensitively; false folds both sides to lower case.
  bool case_sensitive = 3;
  // Which form of the mention is looked up. UNSPECIFIED is refused.
  PiiMapTarget target = 4;
  // What an unmapped value gets; unset means the policy's default
  // strategy. A map is never the fallback of a map.
  PiiRewriteStrategy fallback = 5;
}

// Inline map entries. Keys and replacements are non-empty.
message PiiMapEntries
{
  // Value to replacement, both UTF-8 and trimmed of surrounding
  // whitespace before use.
  map<string, string> entries = 1;
}

// A dictionary registered with the vocabulary store, pinned by content:
// its artifact id and the lowercase hex SHA-256 of its stored bytes.
message PiiDictionaryRef
{
  // The vocabulary store artifact id (DictionaryArtifactDescriptor.artifact_id).
  // Required; at most 128 bytes, never a path.
  string artifact_id = 1;
  // 64 lowercase hexadecimal digits: the SHA-256 of the stored bytes
  // (DictionaryArtifactDescriptor.sha256). A stored artifact with another
  // digest does not resolve.
  string sha256 = 2;
}

// Terms, inline or from a registered dictionary.
message PiiTermSource
{
  oneof source
  {
    // The terms inline.
    PiiTerms terms = 1;
    // A `plain-word-list` dictionary of the vocabulary store: one term a
    // line (#1882 part C).
    PiiDictionaryRef dictionary = 2;
  }
}

message PiiTerms
{
  // Each term, UTF-8; non-empty.
  repeated string terms = 1;
}

// Which pattern syntax an allow pattern uses. UNSPECIFIED is refused.
enum PiiPatternSyntax
{
  PII_PATTERN_SYNTAX_UNSPECIFIED = 0;
  // d digit, a letter, w letter or digit, ? any character, * any run,
  // \x the literal x.
  PII_PATTERN_SYNTAX_SHAPE = 1;
  // ? any character, * any run, \x the literal x.
  PII_PATTERN_SYNTAX_GLOB = 2;
}

message PiiAllowPattern
{
  // The pattern syntax. UNSPECIFIED is refused.
  PiiPatternSyntax syntax = 1;
  // The pattern in `syntax`, UTF-8. Non-empty.
  string pattern = 2;
  // Match case-sensitively; false folds both sides to lower case.
  bool case_sensitive = 3;
}

// Values that are never PII: exact terms (case-insensitive unless
// `case_sensitive`) and patterns.
message PiiAllowList
{
  // Term sources; each term is matched against the whole mention.
  repeated PiiTermSource terms = 1;
  // Match the terms case-sensitively.
  bool case_sensitive = 2;
  // Patterns matched against the whole mention.
  repeated PiiAllowPattern patterns = 3;
}

// Terms that are always PII of a custom kind.
message PiiDenyList
{
  // The caller's id for the list, unique in the policy. Required.
  string rule_id = 1;
  // A custom kind of RedactionPolicy.custom_kinds; a built-in kind is
  // refused.
  PiiKindRef kind = 2;
  // The terms found. Required.
  PiiTermSource terms = 3;
  // Match the terms case-sensitively.
  bool case_sensitive = 4;
  // Edits a match may differ by, 0 to 2.
  uint32 max_edits = 5;
  // Match only capitalized occurrences.
  bool capitalized_only = 6;
}

// A shape pattern that finds a custom kind.
message PiiCustomIdentifier
{
  // The caller's id for the identifier, unique in the policy. Required.
  string rule_id = 1;
  // A custom kind of RedactionPolicy.custom_kinds; a built-in kind is
  // refused.
  PiiKindRef kind = 2;
  // Shape syntax (PII_PATTERN_SYNTAX_SHAPE).
  string shape = 3;
  // Match the shape's letters case-sensitively.
  bool case_sensitive = 4;
}

// The redaction policy one AnalyzePipelineRequest runs turbo-pii:redact
// with: a policy given inline, or the name of one the server loaded at
// start. An unknown name is refused.
message PiiRedactionSelection
{
  oneof policy
  {
    // A policy given in the request; resolved and digested per request.
    RedactionPolicy inline = 1;
    // The id of a policy the server loaded with `--pii-policy`.
    string name = 2;
  }
  // Report what the policy would do and write no redacted view: kept
  // candidates of turbo:pii-candidates carry PiiPlannedRewrite, and no
  // turbo:pii-edits layer is written.
  bool dry_run = 3;
}
