syntax = "proto3";

// The acknowledged audit of PII value release (issue #1909,
// docs/grpc-analysis.md, PII value release). Before turbo-kserve puts a
// token or a clear value into any answer, it records one access event
// with this service and waits for the acknowledgement. A call that fails,
// times out or acknowledges another event fails the release: the answer
// is an error and carries no value. The sink (turbo_sink.proto) drops
// items when its queue is full, so it never carries these events.
package turbo.audit.v1;

service TurboAuditService {
  // Records one access event. The service keeps it before it answers, and
  // answers the event's id. The event id is the same for a retried
  // release, so a service that already holds the id answers it again without
  // a second record.
  rpc RecordPiiAccess(RecordPiiAccessRequest) returns (RecordPiiAccessResponse) {}
}

message RecordPiiAccessRequest {
  // The event to record. Required.
  PiiAccessEvent event = 1;
}

message RecordPiiAccessResponse {
  // The id of the event now recorded: PiiAccessEvent.event_id.
  string event_id = 1;
}

// What a release grants a calling service: one bit per form a value can
// leave in. An event lists only the forms it released.
enum PiiAccessForm {
  PII_ACCESS_FORM_UNSPECIFIED = 0;
  // A keyed token (HMAC-SHA-256) standing for the value.
  PII_ACCESS_FORM_TOKEN = 1;
  // The value encrypted under a registered encryption key (#1885).
  PII_ACCESS_FORM_CIPHERTEXT = 2;
  // The normalized value in clear.
  PII_ACCESS_FORM_CLEAR = 3;
}

// One mention whose value the answer carries. It names the mention by its
// place in the answer, never by its text.
message PiiAccessMention {
  // TypedLayer.instance of the turbo:pii layer.
  string layer_instance = 1;
  // The mention's index in that layer's annotations.
  uint32 index = 2;
  // The kind: a built-in id (PiiKindId), or 0 with `custom_kind` naming a
  // caller-defined kind.
  uint32 builtin_kind = 3;
  // The custom kind's name, as the pii layer's custom kind table names
  // it; empty for a built-in kind.
  string custom_kind = 4;
  // The form the value left in. Never UNSPECIFIED.
  PiiAccessForm form = 5;
  // The redaction policy that covers this mention, copied from the
  // turbo:pii-edits edit in the same graph whose members include it
  // (#1882 part C). All three are empty, and 0, when no edit of a named
  // redaction policy covers the mention; they are never filled in from
  // anywhere else.
  // The policy rule id that chose the edit's strategy, as the policy names
  // it; empty for the policy's default strategy.
  string rule_id = 6;
  // The redaction policy's revision, as its author numbers it
  // (RedactionPolicy.revision).
  uint64 policy_revision = 7;
  // The redaction policy's canonical SHA-256 digest, 32 bytes
  // (PiiEditAnnotation.policy_digest); empty when no edit covers the
  // mention.
  bytes redaction_policy_digest = 8;
}

// The forms the calling service was granted, effective for this release,
// for one kind it released.
message PiiAccessKindGrant {
  // A built-in kind id (PiiKindId), or 0 with `custom_kind` set.
  uint32 builtin_kind = 1;
  // The custom kind's name; empty for a built-in kind.
  string custom_kind = 2;
  // The forms in effect for the kind, ascending; never UNSPECIFIED.
  repeated PiiAccessForm forms = 3;
}

// One access to PII values. It carries no value, token or text.
message PiiAccessEvent {
  // 64 lowercase hexadecimal digits: SHA-256 over what a retry keeps,
  // the service fingerprint, the operation key, input_digest, the
  // mention set (each mention's redaction policy fields included, with an
  // explicit marker when absent), the forms in effect and policy_digest. The attempt is
  // not part of it, so every attempt at one release has the same id; two
  // services never share one.
  string event_id = 1;
  // The request's operation key, and the attempt id of the receipt of
  // the answer that carried the release (#1908).
  string operation_key = 2;
  // ProcessingReceipt.attempt_id of the answer that carried the release.
  string attempt_id = 3;
  // The calling service: the SHA-256 of its verified client
  // certificate's DER bytes, 32 bytes.
  bytes service_fingerprint = 4;
  // The forms in effect, per kind released: requested, allowed by the
  // policy, within the kind's release ceiling and granted.
  repeated PiiAccessKindGrant effective = 5;
  // Every mention whose value the answer carries, in (layer, index)
  // order; none is listed twice.
  repeated PiiAccessMention mentions = 6;
  // The server output ceiling and the calling service's grant that
  // allowed the release: `policy_id` names the ceiling's rules
  // ("turbo-kserve.pii-output-allow.v1"), and `policy_digest` is the
  // SHA-256 (32 bytes) of that ceiling and the grant together, and of
  // the digest of the redaction policy the request named for its per-kind
  // release ceilings (InspectDocumentGraphRequest.pii_policy, #1943) when
  // it named one. The redaction policy that rewrote the text is named per
  // mention (PiiAccessMention.rule_id, policy_revision,
  // redaction_policy_digest).
  string policy_id = 7;
  // SHA-256 of the ceiling, the grant and any named policy's digest, 32
  // bytes.
  bytes policy_digest = 8;
  // When the release was decided: nanoseconds since the Unix epoch.
  uint64 time_unix_nanos = 9;
  // The request's document id.
  string doc_id = 10;
  // The SHA-256 of the source text the mentions index into
  // (InputIdentity.source_text_digest of the answer).
  bytes input_digest = 11;
}
