syntax = "proto3";

// The model catalog over gRPC (docs/grpc-catalog.md): the turbo-zoo
// index the server was started with, the artifacts its cache holds, the
// licence acceptances it records, and installs that stream their
// progress. Every artifact is checked by size, SHA-256 and SHA-512, and a
// file served compressed by its download size and SHA-256 as well, before
// the cache holds it (docs/zoo.md).
//
// Static models distilled from the encoders the server serves
// (docs/grpc-training.md): each is sealed into the training directory,
// every file listed in its manifest by size and SHA-256, and served under
// its name as soon as it is sealed.
package turbo.training.v1;

service TurboCatalogService {
  // Every artifact the index lists. Refused artifacts are never listed.
  rpc ListModelCatalog(ListModelCatalogRequest) returns (ListModelCatalogResponse);
  // The artifacts whose files are all in the cache at the sizes the index
  // records.
  rpc ListInstalledModels(ListInstalledModelsRequest) returns (ListInstalledModelsResponse);
  // Admin. Records that a user accepted a licence's terms.
  rpc RecordLicenceAcceptance(RecordLicenceAcceptanceRequest) returns (RecordLicenceAcceptanceResponse);
  // Admin. Fetches and verifies an artifact into the cache, one install at
  // a time, after the licence and free disk checks.
  rpc InstallModel(InstallModelRequest) returns (stream InstallModelUpdate);
  // One artifact the index lists, as ListModelCatalog gives it.
  rpc DescribeModel(DescribeModelRequest) returns (DescribeModelResponse);
  // The artifact and file the index pins at a SHA-256.
  rpc ResolveModel(ResolveModelRequest) returns (ResolveModelResponse);
  // An installed file's bytes, for a user who accepted every term the
  // artifact needs: its catalog file first, then the bytes.
  rpc ReadModelFile(ReadModelFileRequest) returns (stream ModelFileChunk);
  // Admin. Withdraws a user's acceptance of a licence's terms. Files
  // already installed stay, but none is served to that user again until
  // the terms are accepted again.
  rpc RevokeLicenceAcceptance(RevokeLicenceAcceptanceRequest) returns (RevokeLicenceAcceptanceResponse);
  // The terms a user accepted, in the order accepted, and whether the
  // server serves the admin calls.
  rpc ListLicenceAcceptances(ListLicenceAcceptancesRequest) returns (ListLicenceAcceptancesResponse);
  // The model sources a user registered (docs/zoo.md, "Holders"), in the
  // order an install for that user tries them, before the catalog's own.
  // No secret is ever returned.
  rpc ListModelSources(ListModelSourcesRequest) returns (ListModelSourcesResponse);
  // Admin. Registers a source for a user, or replaces theirs of the same
  // name where it was. In zoo mode without the admin flag only gdrive://
  // sources are taken.
  rpc RegisterModelSource(RegisterModelSourceRequest) returns (RegisterModelSourceResponse);
  // Admin. Removes a user's source by name.
  rpc RemoveModelSource(RemoveModelSourceRequest) returns (RemoveModelSourceResponse);
  // Admin. Starts a user's Google sign-in for a gdrive:// source: the
  // consent page to send the user to, and the state it comes back with.
  rpc StartDriveSignIn(StartDriveSignInRequest) returns (StartDriveSignInResponse);
  // Admin. Finishes that sign-in with the code and state the consent page
  // redirected back with, and registers the source with the grant.
  rpc FinishDriveSignIn(FinishDriveSignInRequest) returns (FinishDriveSignInResponse);
}

// How a registered source signs in.
enum SourceSignIn {
  SOURCE_SIGN_IN_UNSPECIFIED = 0;
  // From the server's environment, or not at all.
  SOURCE_SIGN_IN_ENVIRONMENT = 1;
  // A Google grant from FinishDriveSignIn.
  SOURCE_SIGN_IN_GOOGLE = 2;
  // An API key, for a Drive folder shared by link.
  SOURCE_SIGN_IN_API_KEY = 3;
  // The source's own S3 access key pair.
  SOURCE_SIGN_IN_S3_KEYS = 4;
}

// One registered source, without its secrets.
message ModelSource {
  string name = 1;
  // file:///dir, s3://bucket/prefix or gdrive://<folder-id>[/name/...].
  string address = 2;
  SourceSignIn sign_in = 3;
}

message ListModelSourcesRequest {
  // Empty lists nothing.
  string user = 1;
}

message ListModelSourcesResponse {
  string user = 1;
  repeated ModelSource sources = 2;
  // Whether the server serves the calls that change them.
  bool admin = 3;
  // Whether the server was configured for Google sign-in.
  bool drive_sign_in = 4;
}

message RegisterModelSourceRequest {
  string user = 1;
  // 1 to 64 characters, no comma or control character.
  string name = 2;
  string address = 3;
  // For a gdrive:// source shared by link; empty signs in from the
  // server's environment.
  string api_key = 4;
  // For an s3:// source that signs in with its own keys; unset signs in
  // from the server's environment.
  S3Keys s3_keys = 5;
}

// An S3 access key pair an s3:// source signs its requests with, in place
// of the server's AWS_* environment. Never returned by any call.
message S3Keys {
  string access_key_id = 1;
  string secret_access_key = 2;
  // For temporary keys; empty for none.
  string session_token = 3;
  // The bucket's AWS region; empty is us-east-1.
  string region = 4;
  // An S3-compatible store, http://host:port or https://host; empty is
  // AWS.
  string endpoint = 5;
}

message RegisterModelSourceResponse {
  string user = 1;
  ModelSource source = 2;
}

message RemoveModelSourceRequest {
  string user = 1;
  string name = 2;
}

message RemoveModelSourceResponse {
  string user = 1;
  // Whether there was a source of that name to remove.
  bool was_registered = 2;
}

message StartDriveSignInRequest {
  string user = 1;
  // The source to register once signed in, as RegisterModelSourceRequest
  // names it; the address is a gdrive:// one.
  string name = 2;
  string address = 3;
}

message StartDriveSignInResponse {
  // Google's consent page, which redirects to the address the server was
  // configured with.
  string authorize_url = 1;
  // What the redirect brings back; FinishDriveSignIn takes it.
  string state = 2;
  // Seconds the sign-in may take before it is forgotten.
  uint32 expires_in = 3;
}

message FinishDriveSignInRequest {
  string user = 1;
  string state = 2;
  string code = 3;
}

message FinishDriveSignInResponse {
  string user = 1;
  ModelSource source = 2;
}

// A licence and the address of the text a user accepts for it.
message LicenceTerms {
  // The SPDX identifier, or a LicenseRef- one.
  string licence = 1;
  string text = 2;
}

message TrainingSource {
  string name = 1;
  string licence = 2;
  string licence_terms = 3;
}

message CatalogFile {
  // The file's path inside the artifact's directory.
  string path = 1;
  string url = 2;
  // The file as the cache holds it, unpacked.
  uint64 size = 3;
  string sha256 = 4;
  string sha512 = 5;
  // "gzip" or "zstd" for a file served compressed, else empty, with the
  // compressed bytes' own size and SHA-256.
  string compression = 6;
  uint64 download_bytes = 7;
  string download_sha256 = 8;
}

message CatalogEntry {
  string id = 1;
  // As docs/zoo.md names them: KIND_LEXICON, FORMAT_TEXT, CLASS_PERMISSIVE.
  string kind = 2;
  // Empty when the artifact names none.
  string component = 3;
  string language = 4;
  string format = 5;
  string version = 6;
  string licence = 7;
  string licence_terms = 8;
  string licence_class = 9;
  string attribution = 10;
  repeated TrainingSource trained_on = 11;
  repeated CatalogFile files = 12;
  // The files' unpacked sizes summed.
  uint64 total_bytes = 13;
  // Every term a user accepts before the artifact is installed.
  repeated LicenceTerms terms = 14;
  // Of those, the ones the request's user has not accepted. Empty when
  // the request names no user.
  repeated LicenceTerms missing_terms = 15;
  bool installed = 16;
}

message ListModelCatalogRequest {
  string user = 1;
  // Filters, each ignored when empty: KIND_LEXICON, a language tag.
  string kind = 2;
  string language = 3;
}

message ListModelCatalogResponse {
  repeated CatalogEntry entries = 1;
}

message InstalledModel {
  string id = 1;
  string version = 2;
  // The artifact's directory in the server's cache, and each file's path
  // there in the index's order.
  string dir = 3;
  repeated string files = 4;
  uint64 total_bytes = 5;
}

message ListInstalledModelsRequest {}

message ListInstalledModelsResponse {
  repeated InstalledModel models = 1;
}

message RecordLicenceAcceptanceRequest {
  string user = 1;
  // The SPDX identifier as ListModelCatalog gives it.
  string licence = 2;
  // The terms address, only for a licence without a text of its own
  // (LicenseRef-RestrictedPublic): the entry's LicenceTerms.text.
  string terms = 3;
  // The artifact whose page showed the terms, recorded for audit. When
  // set, it is an artifact the index lists that needs these terms.
  string artifact_id = 4;
  // The SHA-256, as 64 lowercase hex digits, of the LicenceTerms.text the
  // page displayed. When set, it must be the digest of the text the
  // server serves for these terms, so the acceptance names that text.
  string text_sha256 = 5;
}

message RecordLicenceAcceptanceResponse {
  string user = 1;
  LicenceTerms accepted = 2;
  // Seconds since the Unix epoch. Accepting again keeps the first time.
  uint64 accepted_at = 3;
}

message RevokeLicenceAcceptanceRequest {
  string user = 1;
  // As RecordLicenceAcceptanceRequest names them.
  string licence = 2;
  string terms = 3;
}

message RevokeLicenceAcceptanceResponse {
  string user = 1;
  LicenceTerms revoked = 2;
  // Whether there was an acceptance to withdraw.
  bool was_accepted = 3;
}

// One acceptance as the zoo's acceptances.json records it (docs/zoo.md).
message LicenceAcceptance {
  LicenceTerms terms = 1;
  // Seconds since the Unix epoch.
  uint64 accepted_at = 2;
  // The artifact whose page showed the terms, when one was recorded.
  string artifact_id = 3;
  // The SHA-256 of the text as the page displayed it, when recorded.
  string text_sha256 = 4;
}

message ListLicenceAcceptancesRequest {
  // Empty lists nothing.
  string user = 1;
}

message ListLicenceAcceptancesResponse {
  string user = 1;
  repeated LicenceAcceptance accepted = 2;
  // Whether the server serves RecordLicenceAcceptance,
  // RevokeLicenceAcceptance and InstallModel (its admin flag, or zoo mode).
  bool admin = 3;
}

message InstallModelRequest {
  string user = 1;
  string artifact_id = 2;
}

enum InstallStage {
  INSTALL_STAGE_UNSPECIFIED = 0;
  // The licence and disk checks passed and the install holds the slot;
  // bytes is what the files still to fetch take on disk.
  INSTALL_STAGE_ADMITTED = 1;
  // A file is requested; bytes is its size on the wire.
  INSTALL_STAGE_DOWNLOADING = 2;
  // A file's bytes arrived, not yet checked; bytes is what arrived.
  INSTALL_STAGE_DOWNLOADED = 3;
  // Every file is in the cache and verified; bytes is their total.
  INSTALL_STAGE_VERIFIED = 4;
}

message InstallProgress {
  InstallStage stage = 1;
  // The file's place in the artifact's list, from 0, for DOWNLOADING and
  // DOWNLOADED.
  uint32 file_index = 2;
  uint32 file_count = 3;
  string path = 4;
  uint64 bytes = 5;
}

// Progress, then one installed last.
message InstallModelUpdate {
  oneof update {
    InstallProgress progress = 1;
    InstalledModel installed = 2;
  }
}

message DescribeModelRequest {
  // With a user, the entry's missing_terms are the ones that user has not
  // accepted.
  string user = 1;
  string artifact_id = 2;
}

message DescribeModelResponse {
  CatalogEntry entry = 1;
}

message ResolveModelRequest {
  // The unpacked file's SHA-256, 64 lowercase hexadecimal digits.
  string sha256 = 1;
  // When set, only that artifact's files are searched.
  string artifact_id = 2;
  string user = 3;
}

message ResolveModelResponse {
  CatalogEntry entry = 1;
  // The file's path inside the artifact's directory.
  string path = 2;
}

message ReadModelFileRequest {
  string user = 1;
  string artifact_id = 2;
  // The file's path inside the artifact's directory.
  string path = 3;
  // When set, the SHA-256 the caller's own index pins: a file the server's
  // index pins at another is refused.
  string sha256 = 4;
}

message ModelFileChunk {
  oneof frame {
    // The first frame: the file as the index records it.
    CatalogFile file = 1;
    // Every later frame: the next bytes, at most 64 KiB.
    bytes data = 2;
  }
}

service TurboTrainingService {
  // The served, loaded encoders a static model can be distilled from.
  rpc ListTeachers(ListTeachersRequest) returns (ListTeachersResponse);
  // Admin. Distils a static model from a teacher, with learned terms
  // added to its vocabulary, seals it into the training directory and
  // serves it under its name, one training at a time. Progress, then one
  // trained last.
  rpc TrainStaticModel(TrainStaticModelRequest) returns (stream TrainStaticModelUpdate);
  // The static models in the training directory, each file checked
  // against the size and SHA-256 its manifest records.
  rpc ListStaticModels(ListStaticModelsRequest) returns (ListStaticModelsResponse);
  // Admin. Stops serving a static model and removes its directory.
  rpc DeleteStaticModel(DeleteStaticModelRequest) returns (DeleteStaticModelResponse);
  // Admin. Trains a classical component from samples the client streams
  // in their native format, one training at a time (with
  // TrainStaticModel). Progress, the model file in chunks, then one
  // trained. Nothing is kept on the server.
  rpc TrainComponent(stream TrainComponentRequest) returns (stream TrainComponentUpdate);
  // Admin. One training the client streams its input to, one at a time
  // (with TrainStaticModel and TrainComponent). A corpus job learns a
  // vocabulary from the documents, distils a static model with its
  // terms, and indexes the documents with that model, as one
  // transaction: all three are kept, or none is. A component job trains
  // a neural component from samples and streams its model file back.
  // Progress for each stage, then the job's own last message.
  rpc StreamingTraining(stream StreamingTrainingRequest) returns (stream StreamingTrainingUpdate);
}

message Teacher {
  // The served name a TrainStaticModelRequest names.
  string name = 1;
  string model_id = 2;
  string revision = 3;
  // The SHA-256 of the teacher bundle's manifest.json.
  string manifest_sha256 = 4;
  // The encoder's width, the most pca_dims can be, and its vocabulary.
  uint32 hidden = 5;
  uint32 vocab_size = 6;
}

message ListTeachersRequest {}

message ListTeachersResponse {
  repeated Teacher teachers = 1;
}

enum StaticDtype {
  // F32.
  STATIC_DTYPE_UNSPECIFIED = 0;
  STATIC_DTYPE_F32 = 1;
  STATIC_DTYPE_F16 = 2;
}

message TrainStaticModelRequest {
  // The new model's served name and directory: ASCII letters, digits,
  // '.', '_' and '-', not starting with '.', at most 128 bytes. No
  // served model or static model may have it.
  string name = 1;
  // The served name of the teacher, one ListTeachers lists.
  string teacher = 2;
  // The static vectors' width: at most the teacher's hidden; 0 is 256,
  // or the teacher's hidden when that is less.
  uint32 pca_dims = 3;
  // Model2Vec's SIF coefficient, in (0, 1); 0 is 1e-4.
  double sif_coefficient = 4;
  StaticDtype dtype = 5;
  // The tokens a text is cut to; 0 is 512.
  uint32 max_length = 6;
  // A learned vocabulary in the vocabulary store
  // (docs/grpc-vocabulary.md) whose single terms, in its order, are
  // added to the vocabulary; empty for none.
  string vocabulary_artifact_id = 7;
  // More terms, added after the vocabulary's.
  repeated string terms = 8;
  // The model's revision; empty is "1".
  string revision = 9;
  // Sessions the served model pools; 0 is 1.
  uint32 sessions = 10;
}

enum TrainStage {
  TRAIN_STAGE_UNSPECIFIED = 0;
  // The request passed its checks and holds the training slot.
  TRAIN_STAGE_ADMITTED = 1;
  // The entries kept: completed_items of the teacher's total_items, and
  // the learned terms added and refused.
  TRAIN_STAGE_KEPT = 2;
  // Rows through the teacher so far, of total_items.
  TRAIN_STAGE_EMBEDDING = 3;
  // The rows reduced to pca_dims, keeping explained_variance.
  TRAIN_STAGE_REDUCED = 4;
  // The quality texts measured with the teacher and the static model.
  TRAIN_STAGE_MEASURED = 5;
  // The bundle is sealed and verified in the training directory.
  TRAIN_STAGE_SEALED = 6;
  // The bundle is served under its name.
  TRAIN_STAGE_LOADED = 7;
}

message TrainStaticModelProgress {
  TrainStage stage = 1;
  uint64 completed_items = 2;
  uint64 total_items = 3;
  uint64 added_terms = 4;
  uint64 refused_terms = 5;
  double explained_variance = 6;
  StaticModelQuality quality = 7;
}

// The bundle a static model was distilled from, as its manifest names it.
message TeacherProvenance {
  string model_id = 1;
  string revision = 2;
  string manifest_sha256 = 3;
}

// Each quality text's nearest other text shares its group in this share
// of the texts, with the teacher and with the static model, and the rank
// correlation of the two models' similarities (docs/static.md).
message StaticModelQuality {
  double base_top1 = 1;
  double static_top1 = 2;
  double similarity_spearman = 3;
}

// A file of a bundle as its manifest lists it.
message ArtifactFile {
  string path = 1;
  uint64 size = 2;
  // Lowercase hex.
  string sha256 = 3;
}

message StaticModelDescriptor {
  // Its directory's name in the training directory, and its served name.
  string name = 1;
  string model_id = 2;
  string revision = 3;
  // The SHA-256 of its manifest.json.
  string manifest_sha256 = 4;
  uint32 dims = 5;
  // Rows of the table: the teacher's vocabulary and the learned terms.
  uint32 vocab_size = 6;
  uint32 learned_terms = 7;
  // "F32" or "F16".
  string dtype = 8;
  TeacherProvenance teacher = 9;
  StaticModelQuality quality = 10;
  // Every file but manifest.json.
  repeated ArtifactFile files = 11;
  // Whether every file has the size and SHA-256 the manifest records;
  // when not, problem says which does not.
  bool verified = 12;
  string problem = 13;
  // Whether the server serves this directory under the name.
  bool served = 14;
}

message RefusedTerm {
  string term = 1;
  // EMPTY, UNKNOWN, PRESENT, WORDS, LONG or DUPLICATE (docs/static.md).
  string reason = 2;
}

message TrainedStaticModel {
  StaticModelDescriptor model = 1;
  // The learned terms that became entries, in id order from the
  // teacher's vocab_size, and the ones left out.
  repeated string added_terms = 2;
  repeated RefusedTerm refused_terms = 3;
  // The vocabulary the terms came from, and the SHA-256 of its bytes.
  string vocabulary_artifact_id = 4;
  string vocabulary_sha256 = 5;
}

message TrainStaticModelUpdate {
  oneof update {
    TrainStaticModelProgress progress = 1;
    TrainedStaticModel trained = 2;
  }
}

message ListStaticModelsRequest {}

message ListStaticModelsResponse {
  // In name order.
  repeated StaticModelDescriptor models = 1;
}

message DeleteStaticModelRequest {
  string name = 1;
}

message DeleteStaticModelResponse {
  // Whether the model was served, and is no longer.
  bool unloaded = 1;
}

// The classical components TrainComponent trains, and the sample format
// each reads (docs/grpc-training.md, Component training).
enum ComponentKind {
  COMPONENT_KIND_UNSPECIFIED = 0;
  // One sentence a line, a blank line between documents.
  COMPONENT_KIND_SENTENCE_DETECTOR = 1;
  // One sentence a line, tokens split by whitespace or <SPLIT>.
  COMPONENT_KIND_TOKENIZER = 2;
  // One sentence a line of word_TAG tokens.
  COMPONENT_KIND_POS_TAGGER = 3;
  // word, tag and lemma, tab separated, a line a token, a blank line
  // between sentences.
  COMPONENT_KIND_LEMMATIZER = 4;
  // word, tag and chunk tag, space separated, a line a token, a blank
  // line between sentences.
  COMPONENT_KIND_CHUNKER = 5;
  // One sentence a line with <START:type> ... <END> around names.
  COMPONENT_KIND_NAME_FINDER = 6;
  // A category then the document's tokens, separated by whitespace, a
  // line each.
  COMPONENT_KIND_DOCUMENT_CATEGORIZER = 7;
  // A language code, a tab, then the text, a line each.
  COMPONENT_KIND_LANGUAGE_DETECTOR = 8;
}

// The first message of a TrainComponent call.
message TrainComponentStart {
  ComponentKind component = 1;
  // The language the model records (ISO 639). Required except for the
  // language detector, which learns its languages from the samples.
  string language = 2;
  // Training parameters as a parameters file names them (Iterations,
  // Cutoff, Algorithm, ...), each value a string. Unset keys take the
  // trainer's defaults: MAXENT, 100 iterations, cutoff 5.
  map<string, string> parameters = 3;
  // The name finder: the type given to names the samples leave untyped.
  // Empty: "default".
  string name_type = 4;
}

message TrainComponentRequest {
  oneof part {
    // First, and only first.
    TrainComponentStart start = 1;
    // The samples as UTF-8, in any number of chunks cut anywhere. The end
    // of the client's stream starts the training.
    bytes samples = 2;
  }
}

enum ComponentStage {
  COMPONENT_STAGE_UNSPECIFIED = 0;
  // The start passed its checks and holds the training slot.
  COMPONENT_STAGE_ADMITTED = 1;
  // Every sample is read: samples of them.
  COMPONENT_STAGE_READ = 2;
  // An iteration finished: iteration, with correct of events classified
  // and the measure the trainer reports.
  COMPONENT_STAGE_ITERATION = 3;
  // The model file is packaged; its chunks follow.
  COMPONENT_STAGE_PACKAGED = 4;
}

message TrainComponentProgress {
  ComponentStage stage = 1;
  uint64 samples = 2;
  uint32 iteration = 3;
  uint64 correct = 4;
  uint64 events = 5;
  // "Training Accuracy" or "Log Likelihood".
  string measure = 6;
  double value = 7;
}

message TrainedComponent {
  ComponentKind component = 1;
  uint64 samples = 2;
  // The model file sent in the chunks before this message: its size and
  // lowercase hex SHA-256.
  uint64 size = 3;
  string sha256 = 4;
}

message TrainComponentUpdate {
  oneof update {
    TrainComponentProgress progress = 1;
    // The next bytes of the model file.
    bytes model = 2;
    TrainedComponent trained = 3;
  }
}

message StreamingTrainingRequest {
  oneof part {
    // First, and only first.
    StreamingTrainingStart start = 1;
    // A corpus job's next document. The end of the client's stream
    // starts the vocabulary.
    CorpusDocument document = 2;
    // A component job's samples as UTF-8, in any number of chunks cut
    // anywhere. The end of the client's stream starts the training.
    bytes samples = 3;
  }
}

message StreamingTrainingStart {
  oneof job {
    CorpusTraining corpus = 1;
    NeuralComponentTraining component = 2;
  }
}

message CorpusDocument {
  // The document's id in the index: not empty, at most 1024 bytes, and
  // no other document of the stream may have it.
  string doc_id = 1;
  // The document's text, counted for the vocabulary and indexed.
  string text = 2;
}

// A corpus job: its three parts are named here and made in this order.
message CorpusTraining {
  // The vocabulary learned from the documents and kept in the vocabulary
  // store (docs/grpc-vocabulary.md).
  CorpusVocabulary vocabulary = 1;
  // The static model distilled with the vocabulary's single terms, as
  // TrainStaticModel takes it. vocabulary_artifact_id must be empty: the
  // vocabulary is the one this job learns. terms are added after it.
  TrainStaticModelRequest model = 2;
  // The search index the documents are put in, embedded by the model.
  CorpusIndex index = 3;
}

// How the vocabulary is learned: LearnVocabularyHeader's settings
// (turbo_vocabulary.proto), field for field.
message CorpusVocabulary {
  // A term or n-gram seen fewer times than this is left out (0 is 1).
  uint32 min_term_frequency = 1;
  // The most single terms, and separately the most n-grams, kept (0
  // keeps all).
  uint32 max_terms = 2;
  bool lowercase = 3;
  // Drops the language's bundled stopwords from the terms, and n-grams
  // that start or end with one.
  bool filter_stopwords = 4;
  bool include_ngrams = 5;
  // n-gram sizes, both at least 2 and at most the store's max_ngram_size.
  uint32 min_ngram_size = 6;
  uint32 max_ngram_size = 7;
  // An n-gram's pointwise mutual information, in bits, must reach this.
  double min_pmi = 8;
  // A stored dictionary whose headwords are kept whatever their counts.
  string dictionary_artifact_id = 9;
  string language = 10;
}

// How the index is stored.
enum CorpusIndexStorage {
  // Exact f32 rows.
  CORPUS_INDEX_STORAGE_FLAT_F32 = 0;
  // TurboQuant codes; the model's width must be a multiple of 8.
  CORPUS_INDEX_STORAGE_TURBO_QUANT = 1;
}

// The index a corpus job makes. Its space is the new model's: the
// model's id, revision and manifest SHA-256, its width, unit vectors,
// compared by cosine.
message CorpusIndex {
  // The index's name: not empty, and no index or alias may have it.
  string index_name = 1;
  CorpusIndexStorage storage = 2;
  // TurboQuant's bit width, 2, 3 or 4; 0 is 4.
  uint32 quant_bits = 3;
  bool quant_calibrate = 4;
  // The collection whose term statistics the documents are added to;
  // empty is the index's own name.
  string collection_name = 5;
  // The token budget of a chunk; 0 is the index's default.
  uint32 chunk_budget_tokens = 6;
}

// The neural components a component job trains.
enum NeuralComponentKind {
  NEURAL_COMPONENT_KIND_UNSPECIFIED = 0;
  // The feed-forward transition dependency parser
  // (docs/feedforward-dependency-parser.md). Samples: CoNLL-U sentences,
  // a blank line between them.
  NEURAL_COMPONENT_KIND_DEPENDENCY_PARSER = 1;
}

// The part-of-speech column a CoNLL-U sample's tags are read from.
enum ConlluTagset {
  // UPOS, column 4.
  CONLLU_TAGSET_UPOS = 0;
  // XPOS, column 5.
  CONLLU_TAGSET_XPOS = 1;
}

// The slots a parser state is read through.
enum DependencyFeatureLayout {
  // 18 word, 18 tag and 12 label slots.
  DEPENDENCY_FEATURE_LAYOUT_CHEN_MANNING_18 = 0;
  // 14 word, 14 tag and 8 label slots.
  DEPENDENCY_FEATURE_LAYOUT_COMPACT_14 = 1;
}

enum DependencyActivation {
  DEPENDENCY_ACTIVATION_CUBE = 0;
  DEPENDENCY_ACTIVATION_RELU = 1;
}

// A component job. A field left 0 or unset takes the trainer's default.
message NeuralComponentTraining {
  NeuralComponentKind component = 1;
  ConlluTagset tagset = 2;
  // The embedding width, at most 4096; 0 is 50.
  uint32 embedding_size = 3;
  // The hidden layer's width, at most 65536; 0 is 200.
  uint32 hidden_size = 4;
  // Passes over the examples, at most 10000; 0 is 10.
  uint32 epochs = 5;
  // Examples in a minibatch; 0 is 256.
  uint32 batch_size = 6;
  // AdaGrad's learning rate, over 0; 0 is 0.02.
  double learning_rate = 7;
  // The L2 penalty on the dense matrices, at least 0; unset is 1e-8.
  optional double l2 = 8;
  // Hidden dropout, in [0, 1); unset is 0.5.
  optional double dropout = 9;
  // A word seen fewer times than this is unknown; unset is 2.
  optional uint32 word_cutoff = 10;
  // The seed of the initial weights and the shuffles; unset is 17.
  optional int64 seed = 11;
  DependencyFeatureLayout layout = 12;
  DependencyActivation activation = 13;
}

enum StreamingStage {
  STREAMING_STAGE_UNSPECIFIED = 0;
  // The start passed its checks and holds the training slot.
  STREAMING_STAGE_ADMITTED = 1;
  // Corpus: completed_items documents are read and counted. Repeated;
  // the last one has total_items, every document of the stream.
  STREAMING_STAGE_ANALYZING = 2;
  // Corpus: the vocabulary is in the store with completed_items single
  // terms.
  STREAMING_STAGE_LEARNING_VOCABULARY = 3;
  // Corpus: a step of the distillation, as TrainStaticModel streams it,
  // in distillation. Repeated; the model is served after its LOADED.
  STREAMING_STAGE_DISTILLING_MODEL = 4;
  // Corpus: completed_items of total_items documents are staged for the
  // index. Repeated.
  STREAMING_STAGE_INDEXING = 5;
  // Corpus: the index is published and the transaction is kept.
  STREAMING_STAGE_COMPLETED = 6;
  // Component: every sample is read, completed_items of them.
  STREAMING_STAGE_READ = 7;
  // Component: epoch completed_items of total_items finished, with the
  // mean cross-entropy of its examples in loss.
  STREAMING_STAGE_EPOCH = 8;
  // Component: the model file is packaged; its chunks follow.
  STREAMING_STAGE_PACKAGED = 9;
}

message StreamingTrainingProgress {
  StreamingStage stage = 1;
  uint64 completed_items = 2;
  uint64 total_items = 3;
  TrainStaticModelProgress distillation = 4;
  double loss = 5;
}

// What a corpus job kept.
message CorpusTrained {
  // The vocabulary's id in the store and the SHA-256 of its bytes.
  string vocabulary_artifact_id = 1;
  string vocabulary_sha256 = 2;
  // Whether this job stored it: false when the store already held these
  // bytes, which a failed job would not have removed.
  bool vocabulary_created = 3;
  uint64 vocabulary_terms = 4;
  uint64 vocabulary_ngrams = 5;
  // The static model, as TrainStaticModel ends with it.
  TrainedStaticModel model = 6;
  string index_name = 7;
  uint64 indexed_documents = 8;
  uint64 indexed_chunks = 9;
}

message TrainedNeuralComponent {
  NeuralComponentKind component = 1;
  // The sentences trained on.
  uint64 samples = 2;
  // The model file sent in the chunks before this message: its size and
  // lowercase hex SHA-256.
  uint64 size = 3;
  string sha256 = 4;
}

message StreamingTrainingUpdate {
  oneof update {
    StreamingTrainingProgress progress = 1;
    // Component: the next bytes of the model file.
    bytes model = 2;
    // Corpus: last.
    CorpusTrained corpus = 3;
    // Component: last.
    TrainedNeuralComponent component = 4;
  }
}
