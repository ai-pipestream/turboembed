// Stable built-in PII kind ids. Identity only, append-only, never
// renumbered: the same numbers as the Rust kind registry, the C
// TURBO_PII_KIND_* constants, Java TurboPiiKind and the binary codec.
// UNSPECIFIED is never a kind and is refused.
enum PiiKindId
{
  PII_KIND_ID_UNSPECIFIED = 0;
  PII_KIND_ID_JWT = 1;
  PII_KIND_ID_AWS_ACCESS_KEY = 2;
  PII_KIND_ID_GITHUB_TOKEN = 3;
  PII_KIND_ID_URL_CREDENTIAL = 4;
  PII_KIND_ID_EMAIL = 5;
  PII_KIND_ID_IBAN = 6;
  PII_KIND_ID_IMEI = 7;
  PII_KIND_ID_CARD = 8;
  PII_KIND_ID_BTC_ADDRESS = 9;
  PII_KIND_ID_ETH_ADDRESS = 10;
  PII_KIND_ID_MAC = 11;
  PII_KIND_ID_IPV6 = 12;
  PII_KIND_ID_IPV4 = 13;
  PII_KIND_ID_US_SSN = 14;
  PII_KIND_ID_US_ITIN = 15;
  PII_KIND_ID_UK_NHS = 16;
  PII_KIND_ID_DE_STEUER_ID = 17;
  PII_KIND_ID_ES_DNI = 18;
  PII_KIND_ID_ES_NIE = 19;
  PII_KIND_ID_ES_CIF = 20;
  PII_KIND_ID_DE_PERSONALAUSWEIS = 21;
  PII_KIND_ID_FR_NIR = 22;
  PII_KIND_ID_FR_SIREN = 23;
  PII_KIND_ID_FR_SIRET = 24;
  PII_KIND_ID_BR_CPF = 25;
  PII_KIND_ID_BR_CNPJ = 26;
  PII_KIND_ID_BIC = 27;
  PII_KIND_ID_CA_SIN = 28;
  PII_KIND_ID_ABA_ROUTING = 29;
  PII_KIND_ID_PHONE = 30;
}

// How much the text supports a mention's kind: the same numbers as the C
// TURBO_PII_CONFIDENCE_* constants, Java TurboPiiConfidence and the binary
// codec. UNSPECIFIED is never a tier and is refused.
enum PiiConfidenceTier
{
  PII_CONFIDENCE_TIER_UNSPECIFIED = 0;
  PII_CONFIDENCE_TIER_FORMAT = 1;
  PII_CONFIDENCE_TIER_CHECKSUM = 2;
  PII_CONFIDENCE_TIER_LABELLED_CHECKSUM = 3;
  PII_CONFIDENCE_TIER_LABELLED = 4;
}

// A mention's kind: a built-in id, or an index into the layer's
// TypedLayer.custom_pii_kinds.
message PiiKindRef
{
  oneof kind
  {
    // A built-in kind. UNSPECIFIED is refused.
    PiiKindId builtin = 1;
    // An index into the layer's custom_pii_kinds.
    uint32 custom = 2;
  }
}

// Who found a mention: a detector id that is stable across releases
// (`turbo-pii:cursor`, `turbo-pii:deny-list`, a custom extractor's id) and
// the version of that detector.
message PiiDetectorRef
{
  // The stable detector id. Non-empty.
  string id = 1;
  // The detector's version string; part of its identity.
  string version = 2;
}

// The check digit algorithm a checksum fact ran. UNSPECIFIED is refused.
enum PiiChecksumAlgorithm
{
  PII_CHECKSUM_ALGORITHM_UNSPECIFIED = 0;
  PII_CHECKSUM_ALGORITHM_LUHN = 1;
  PII_CHECKSUM_ALGORITHM_MOD97 = 2;
  PII_CHECKSUM_ALGORITHM_MOD11 = 3;
  PII_CHECKSUM_ALGORITHM_MOD23 = 4;
  PII_CHECKSUM_ALGORITHM_ES_CIF = 5;
  PII_CHECKSUM_ALGORITHM_ISO7064_MOD11_10 = 6;
  PII_CHECKSUM_ALGORITHM_ICAO9303 = 7;
  PII_CHECKSUM_ALGORITHM_BASE58CHECK = 8;
  PII_CHECKSUM_ALGORITHM_BECH32 = 9;
  PII_CHECKSUM_ALGORITHM_EIP55 = 10;
  PII_CHECKSUM_ALGORITHM_ABA_WEIGHTS = 11;
  PII_CHECKSUM_ALGORITHM_OTHER = 12;
  PII_CHECKSUM_ALGORITHM_LA_POSTE_MOD5 = 13;
}

// The text has the shape of the kind and nothing more was checked.
message PiiShapeEvidence
{
}

// A check digit algorithm ran over the mention and passed or failed.
message PiiChecksumEvidence
{
  // The algorithm that ran. UNSPECIFIED is refused.
  PiiChecksumAlgorithm algorithm = 1;
  // Whether the check digits matched.
  bool passed = 2;
}

// A label phrase for the kind stands near the mention: the phrase's wire
// span in this view, and its index in the detector's label phrase table.
message PiiLabelEvidence
{
  // The label phrase's span in this view and OffsetMode.
  SpanFragment span = 1;
  // The phrase's index in the detector's label phrase table.
  uint32 phrase = 2;
}

// A deny list term matched: the list's index in the detector's
// configuration and the term's index in that list.
message PiiDenyHitEvidence
{
  // The deny list's index in the detector's configuration.
  uint32 list = 1;
  // The term's index in that list.
  uint32 term = 2;
}

// A custom rule matched, by its index in the detector's configuration.
message PiiRuleEvidence
{
  // The custom rule's index in the detector's configuration.
  uint32 rule = 1;
}

// One fact a detector recorded for a candidate. The confidence tier is
// derived from these facts and never the other way round; a reader that
// finds no fact it knows refuses the mention.
message PiiEvidence
{
  oneof fact
  {
    // The text has the kind's shape.
    PiiShapeEvidence shape = 1;
    // A check digit algorithm ran.
    PiiChecksumEvidence checksum = 2;
    // A context label stands near the mention.
    PiiLabelEvidence label = 3;
    // A deny list term matched.
    PiiDenyHitEvidence deny_hit = 4;
    // A custom rule matched.
    PiiRuleEvidence rule = 5;
  }
}

// What a score's number means. UNSPECIFIED is refused.
enum PiiScoreKind
{
  PII_SCORE_KIND_UNSPECIFIED = 0;
  PII_SCORE_KIND_PROBABILITY = 1;
  PII_SCORE_KIND_LOGIT = 2;
  PII_SCORE_KIND_HEURISTIC = 3;
}

// An optional model score for a mention. A mention without one carries no
// PiiScore at all, which is not a score of zero.
message PiiScore
{
  // The score, finite: [0, 1] for probability and heuristic scores,
  // unbounded for logits.
  float value = 1;
  // What the score is. UNSPECIFIED is refused.
  PiiScoreKind kind = 2;
  // The model that scored.
  PiiDetectorRef model = 3;
  // Whether the score was calibrated against held-out data.
  bool calibrated = 4;
}

// A kept mention. Its detected value is not part of the finding:
// `value` says in which form, if any, it was released (#1904). The tier is derived from
// the evidence by PiiConfidence::derive and is carried for readers that
// want one number; a message whose tier is not the one its evidence
// derives to is refused.
message PiiMention
{
  // Never populated; use kind_ref.
  string kind = 1 [deprecated = true];
  // Never populated; use confidence.
  string confidence_tier = 2 [deprecated = true];
  // Never populated: was the normalized value in clear; read `value`
  // instead (#1904).
  string normalized = 3 [deprecated = true];
  // The value in the form released; `withheld` unless released (#1904,
  // #1909). Required.
  PiiValue value = 4;
  // 8 and 9 are spare.
  PiiDetectorRef detector = 5;
  // The facts recorded for the mention; at least one.
  repeated PiiEvidence evidence = 6;
  // The model score, when the detector has one.
  optional PiiScore score = 7;
  // The mention's kind. Required.
  PiiKindRef kind_ref = 10;
  // The tier the evidence derives to. UNSPECIFIED is refused.
  PiiConfidenceTier confidence = 11;
}

// The form a PII mention's value is released in. A finding carries
// `withheld` unless the request asked for values, the server's policy
// allows the form and the calling service is granted it for the
// mention's kind (#1909); a caller that holds the text slices it with
// the spans. `token` and `clear` are produced; `ciphertext` waits for
// #1885.
message PiiValue
{
  oneof form
  {
    // The value is not in the response.
    PiiValueWithheld withheld = 1;
    // A keyed token standing for the value.
    PiiValueToken token = 2;
    // The value encrypted; refused until #1885.
    PiiValueCiphertext ciphertext = 3;
    // The normalized value in clear.
    string clear = 4;
  }
}

// The value is not in the response.
message PiiValueWithheld {}

// A keyed token standing for the value: HMAC-SHA-256 under a registered
// key (#1909). Equal values under one key give equal tokens.
message PiiValueToken
{
  // The 32-byte HMAC-SHA-256, under the key, of a domain tag and the
  // normalized value.
  bytes token = 1;
  // The key the token was made under: the PiiPolicyKeyRef identity (id,
  // version) of turbo_pii_policy.proto, carried as plain fields because
  // that file imports this one.
  string key_id = 2;
  // The key's version, read unsigned.
  uint32 key_version = 3;
}

// The value encrypted under a registered key with a named scheme. Not
// produced until #1885.
message PiiValueCiphertext
{
  // The encrypted bytes, in `scheme`'s encoding.
  bytes ciphertext = 1;
  // The key, as in PiiValueToken: the PiiPolicyKeyRef identity (id,
  // version).
  string key_id = 2;
  // The encryption scheme's name.
  string scheme = 3;
  // The key's version, read unsigned.
  uint32 key_version = 4;
}

// The form a request asks PII values in. UNSPECIFIED means WITHHELD.
enum PiiValueForm
{
  PII_VALUE_FORM_UNSPECIFIED = 0;
  PII_VALUE_FORM_WITHHELD = 1;
  PII_VALUE_FORM_TOKEN = 2;
  PII_VALUE_FORM_CIPHERTEXT = 3;
  PII_VALUE_FORM_CLEAR = 4;
}

// What a response about a document holding PII findings (a turbo:pii
// layer) carries beyond the findings (#1904). Unset, every option is off:
// the response holds the findings (kind, confidence, spans, layer
// provenance) and no value, token, text or graph bytes. Each option the
// request turns on must be allowed by the server's PII output policy
// (--pii-output-allow), or the call is refused with TURBO_E_INVALID_STATE
// (FAILED_PRECONDITION) naming the option; nothing is dropped silently. A document with
// no turbo:pii layer is answered as before.
message PiiOutputOptions
{
  // The text of the requested view when that view is a PII rewrite
  // (masked or redacted) view: TypedDocumentResult.raw_text. The text of
  // any other view needs `full_text`.
  bool rewritten_text = 1;
  // Source and view texts and binary DocumentGraph bytes: raw_text of any
  // view, DocumentGraphResponse.source_text and graph, progressive
  // snapshots and sink graphs. These hold every detected value in clear.
  bool full_text = 2;
  // Candidates and evidence detail (#1903).
  bool detail = 3;
  // Values in this form; UNSPECIFIED or WITHHELD withholds them. TOKEN
  // and CLEAR are released by InspectDocumentGraph only, on a server with
  // PII release configured (#1909), and only for the kinds the calling
  // service's verified client certificate is granted; every other mention
  // stays withheld. A release needs the request's operation_key (#1908);
  // without one the answer is the findings only. Each release is
  // recorded with the audit service (turbo_audit.proto) before the
  // answer leaves, and fails when the record does. CIPHERTEXT, and TOKEN or CLEAR on any other call or on a
  // server without release, are refused with TURBO_E_UNSUPPORTED_OPTION
  // (UNIMPLEMENTED).
  PiiValueForm values = 4;
}

// Why a rule rejected a candidate. UNSPECIFIED is refused.
enum PiiRejectReason
{
  PII_REJECT_REASON_UNSPECIFIED = 0;
  PII_REJECT_REASON_LABEL_REQUIRED = 1;
  PII_REJECT_REASON_THRESHOLD = 2;
}

// Which allow table a rule came from. UNSPECIFIED is refused.
enum PiiAllowScope
{
  PII_ALLOW_SCOPE_UNSPECIFIED = 0;
  PII_ALLOW_SCOPE_GLOBAL = 1;
  PII_ALLOW_SCOPE_KIND = 2;
}

// An allow rule by its index in the detector's configuration: a term of
// the allow list or a pattern.
message PiiAllowRuleRef
{
  oneof rule
  {
    // The term's index in the allow list.
    uint32 term = 1;
    // The pattern's index in the allow list's patterns.
    uint32 pattern = 2;
  }
}

// A candidate an allow rule suppressed.
message PiiAllowedByRule
{
  // Whether the global or the kind's allow list matched. UNSPECIFIED is
  // refused.
  PiiAllowScope scope = 1;
  // The term or pattern that matched.
  PiiAllowRuleRef rule = 2;
}

// What became of a candidate. A mention index is a row of the turbo:pii
// layer with the same instance name.
message PiiDisposition
{
  oneof disposition
  {
    // Kept as this mention index of the turbo:pii layer.
    uint32 kept = 1;
    // Suppressed by an allow rule.
    PiiAllowedByRule allowed_by_rule = 2;
    // Dropped inside this kept mention index.
    uint32 nested_in = 3;
    // Rejected for this reason. UNSPECIFIED is refused.
    PiiRejectReason rejected_by_rule = 4;
    // A repeat of this kept mention index.
    uint32 repeats = 5;
  }
}

// One candidate of a turbo:pii-candidates layer: every span a detector
// considered, with its facts and the decision taken on it. A candidate
// never carries a value or a normalized form.
message PiiCandidateAnnotation
{
  // The kind the detector proposed.
  PiiKindRef kind = 1;
  // The detector that proposed it.
  PiiDetectorRef detector = 2;
  // The facts recorded for it; at least one.
  repeated PiiEvidence evidence = 3;
  // The model score, when the detector has one.
  optional PiiScore score = 4;
  // What became of the candidate. Required.
  PiiDisposition disposition = 5;
  // What a turbo-pii:redact dry run would do with a kept candidate; unset
  // for every other disposition and outside a dry run.
  PiiPlannedRewrite planned = 6;
}

// The rewrite a RedactionPolicy would give one kept mention, as a
// turbo-pii:redact dry run reports it: the same rule, rule id, strategy,
// revision and digest the edit covering it would record. A cluster of
// overlapping mentions is written by its winner's strategy, so a kept
// mention that loses its cluster is replaced by another's strategy.
message PiiPlannedRewrite
{
  // The rule that would choose the strategy. Required.
  PiiEditRule rule = 1;
  // That rule's RedactionPolicy rule_id; empty for the default.
  string rule_id = 2;
  // The strategy that would write it. UNSPECIFIED is refused.
  PiiStrategy strategy = 3;
  // The policy's revision (RedactionPolicy.revision).
  uint64 policy_revision = 4;
  // The raw 32 bytes of the policy digest.
  bytes policy_digest = 5;
}

// How a PII rewrite wrote a replacement: the same numbers as the native
// PiiStrategyKind ids. UNSPECIFIED is never a strategy and is refused.
enum PiiStrategy
{
  PII_STRATEGY_UNSPECIFIED = 0;
  PII_STRATEGY_MASK = 1;
  PII_STRATEGY_PSEUDONYM = 2;
  PII_STRATEGY_HMAC = 3;
  PII_STRATEGY_FORMAT = 4;
  PII_STRATEGY_STATIC = 5;
  PII_STRATEGY_SHA256 = 6;
  PII_STRATEGY_MAP = 7;
  PII_STRATEGY_TRUNCATE = 8;
  PII_STRATEGY_ABBREVIATE = 9;
}

// Which rule of the rewrite policy chose an edit's strategy: the default,
// or the override for one kind, named as the covered turbo:pii layer names
// it (custom indexes go into this layer's TypedLayer.custom_pii_kinds,
// which repeats the covered layer's table).
message PiiEditRule
{
  oneof rule
  {
    // The policy's default strategy; always true when set.
    bool default_rule = 1;
    // The override for this kind.
    PiiKindRef kind = 2;
  }
}

// One replacement a PII rewrite made (turbo:pii-edits). The annotation's
// spans are the replacement on the requested view. No original value is
// carried.
message PiiEditAnnotation
{
  // The replaced bytes on the parent of the layer's native view, in
  // canonical UTF-8 byte offsets whatever the result's OffsetMode.
  SpanFragment source = 1;
  // The covered mentions: row indexes of the covered turbo:pii layer,
  // ascending. Any subset, so not a range.
  repeated uint32 members = 2;
  // The rule that chose the strategy. Required.
  PiiEditRule rule = 3;
  // The strategy that wrote the replacement. UNSPECIFIED is refused.
  PiiStrategy strategy = 4;
  // The caller's revision of the policy; 0 when none was given.
  uint64 policy_revision = 5;
  // The rule_id of the RedactionPolicy rule that chose the strategy;
  // empty for the policy default and for a rewrite by no RedactionPolicy.
  string rule_id = 6;
  // The raw 32 bytes of the RedactionPolicy's digest: the SHA-256 of its
  // canonical encoding (docs/grpc-analysis.md, "Redaction policy"). Empty
  // for a rewrite by no RedactionPolicy.
  bytes policy_digest = 7;
}

