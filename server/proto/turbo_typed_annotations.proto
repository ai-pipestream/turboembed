// Strongly-typed document graph projection over gRPC (issue #1219).
//
// SPDX-License-Identifier: Apache-2.0

syntax = "proto3";
package turbo.result.v1;

// Which model produced a result, by the bundle's own identity: the
// manifest's model id and revision, and the manifest's sha256, the
// contract the load was made against.
message ModelRef
{
  string id = 1;
  string revision = 2;
  string sha256 = 3;
}

// The unit every span offset in a message is counted in. UTF-8 bytes
// are the internal offsets; UTF-16 code units are Java's string
// indices; code points count Unicode scalar values. Conversion uses
// the view text's checkpoint table and refuses offsets that are out
// of bounds, inverted, or inside a code point or UTF-16 surrogate
// pair, with TURBO_E_INVALID_ARGUMENT: nothing is snapped or cut.
enum OffsetMode
{
  OFFSET_MODE_UTF8 = 0;
  OFFSET_MODE_UTF16 = 1;
  OFFSET_MODE_CODE_POINT = 2;
}

// What became of one layer or view on its document. UNSPECIFIED is
// never written: an absent status is never read as OK (issue #1908).
enum LayerWireStatus
{
  LAYER_WIRE_STATUS_UNSPECIFIED = 0;
  LAYER_WIRE_STATUS_OK = 1;
  LAYER_WIRE_STATUS_SKIPPED = 2;
  LAYER_WIRE_STATUS_FAILED = 3;
}

// Why a layer or view is not OK, as a kind: no free text, no values, no
// debug formatting (issue #1908). DECLINED is an annotator declining
// the document; UPSTREAM is a skip because a layer it reads is not
// complete; the rest are the analysis error kinds.
enum LayerErrorKind
{
  LAYER_ERROR_KIND_UNSPECIFIED = 0;
  LAYER_ERROR_KIND_DECLINED = 1;
  LAYER_ERROR_KIND_UPSTREAM = 2;
  LAYER_ERROR_KIND_MISSING = 3;
  LAYER_ERROR_KIND_DUPLICATE = 4;
  LAYER_ERROR_KIND_CLASH = 5;
  LAYER_ERROR_KIND_BOUNDS = 6;
  LAYER_ERROR_KIND_MISALIGNED = 7;
  LAYER_ERROR_KIND_UNALIGNED = 8;
  LAYER_ERROR_KIND_INVALID = 9;
  LAYER_ERROR_KIND_PIPELINE = 10;
  LAYER_ERROR_KIND_ANNOTATOR = 11;
  LAYER_ERROR_KIND_PANIC = 12;
  LAYER_ERROR_KIND_OFFSET = 13;
  LAYER_ERROR_KIND_SOURCE = 14;
}

// A sanitized layer error: the kind, the turbo status a client routes
// it by, and the code names it involves. It never carries document
// text, PII values, annotator detail strings or a debug rendering.
message LayerError
{
  // What failed. UNSPECIFIED is refused.
  LayerErrorKind kind = 1;
  // TURBO_E_* as decimal; 0 for DECLINED and UPSTREAM, which are skips.
  int32 turbo_code = 2;
  // The layer instance the error names, when it names one.
  optional LayerInstanceRef layer = 3;
  // The annotator's registered name, for ANNOTATOR and PANIC.
  string annotator = 4;
}

// One text view of a document graph.
message ViewInfo
{
  string instance = 1;
  LayerWireStatus status = 2;
  reserved 3;
  reserved "status_detail";
  string annotator = 4;
  // The parent view's instance; empty for the source view.
  string parent = 5;
  // Why the view is not OK; absent when it is.
  optional LayerError error = 6;
}

// Request to project a binary DocumentGraph into a strongly-typed
// TypedDocumentResult in the caller's chosen view and OffsetMode.
message InspectDocumentGraphRequest
{
  string doc_id = 1;
  bytes graph = 2;
  uint32 view = 3;
  OffsetMode offsets = 4;
  // The caller's own identity of the input, copied into the result's
  // InputIdentity.binding as given; absent when the caller has none.
  optional InputBinding binding = 5;
  // The caller's operation (idempotency) key, echoed on the receipt;
  // empty when the caller has none (issue #1908).
  string operation_key = 6;

  // What the result carries beyond PII findings; see PiiOutputOptions.
  PiiOutputOptions pii_output = 7;
}

// ---- The result envelope (issue #1907) ----
//
// Every digest field holds the raw 32 bytes of a SHA-256, and the
// field says exactly what the digest is computed over. A digest that
// is not available is absent, never zero-filled or invented. Offsets
// inside the envelope's edit chain are UTF-8 bytes whatever the
// result's OffsetMode is; OffsetMode applies to annotation spans only.

// What the caller knows about where the input came from. The server
// copies it as given and never invents repository provenance: an
// absent binding means the caller supplied none.
message InputBinding
{
  // The source repository revision the input was taken at.
  string source_revision = 1;
  // The parse artifact the input text is, and its digest, both opaque
  // to the server.
  string parse_artifact_id = 2;
  // The parse artifact's digest, opaque bytes as the caller gave them.
  bytes parse_artifact_digest = 3;
}

// What the result was computed from, bound to the exact bytes.
message InputIdentity
{
  // The caller's binding; absent when the caller gave none.
  optional InputBinding binding = 1;
  // SHA-256 of the document's original bytes: the decoded file bytes
  // for a document decoded from bytes, else the UTF-8 of the source
  // view. raw_bytes_len is the length of those bytes.
  bytes raw_bytes_digest = 2;
  // The length of those original bytes.
  uint64 raw_bytes_len = 3;
  // SHA-256 of the source view's UTF-8 text (view 0), and that text's
  // length in UTF-8 bytes.
  bytes source_text_digest = 4;
  // The source view's length in UTF-8 bytes.
  uint32 source_text_len = 5;
}

// The immutable identity of one result.
message ResultIdentity
{
  // The lowercase hexadecimal of content_digest: two results with one
  // id hold the same graph bytes.
  string result_id = 1;
  // SHA-256 of the exact TGRF bytes DocumentGraph::to_bytes writes for
  // this document, nothing prepended, so `sha256sum` of the graph
  // bytes reproduces it. Protobuf bytes are not canonical across
  // languages and are never digested.
  bytes content_digest = 2;
  // The length of those graph bytes.
  uint64 graph_bytes_len = 3;
  // The TGRF FORMAT_VERSION the digested bytes are in.
  uint32 graph_format_version = 4;
  // The version of this envelope's messages and rules: 1.
  uint32 envelope_schema_version = 5;
}

// One layer or view instance, named as the graph names it.
message LayerInstanceRef
{
  // The layer id, such as turbo:pii, or turbo:view for a view.
  string layer = 1;
  // The instance name; empty for the default instance.
  string instance = 2;
}

// Processing provenance of one layer or view instance. model_ref names
// the models entry carrying the annotator, its version, the model
// bundle (weights id, revision and sha256) and the execution
// environment; config_hash there is the local FNV cache key and never
// an identity. The digests here are the identities.
message LayerProvenance
{
  // The layer id, such as turbo:pii.
  string layer = 1;
  // The instance name; empty for the default instance.
  string instance = 2;
  // Message-local, into TypedDocumentResult.models.
  string model_ref = 3;
  // SHA-256 chained provenance digest, rule turbo:provenance-digest:v2,
  // over: the annotator, its version, the config key, the model (id,
  // revision, sha256) when there is one, the source text digest, the
  // source bytes digest when the document was decoded from bytes,
  // every view read (instance, text digest) sorted by instance, and
  // every read layer (layer, instance, its own provenance digest)
  // sorted by layer then instance.
  bytes provenance_digest = 4;
  // SHA-256 content digest of the layer's payload, rule
  // turbo:layer-content:v2 over the layer name, instance, codec
  // schema, length, the layer's own content hash, its text spans, its
  // index bounds and, for a view, its text digest and edits. Absent
  // for a layer type that provides no complete content hash.
  optional bytes content_digest = 5;
  // SHA-256 snapshot, rule turbo:upstream-content:v2, of the content
  // digests of every layer this one read, sorted by layer then
  // instance. Absent for the source view and when a read layer has no
  // content digest.
  optional bytes input_snapshot_digest = 6;
  // The binary codec schema (Layer::SCHEMA) the layer's graph bytes
  // are in.
  uint32 codec_schema = 7;
  // The layer instances this one read, and the anchor and index
  // instances it is on, in the order the annotator declared them.
  repeated LayerInstanceRef reads = 8;
  // The anchor and index instances the layer is on.
  repeated LayerInstanceRef on = 9;
}

// A reference to one annotation that stays meaningful outside its
// message: the result it is in, the layer instance and item index,
// and the native view its spans are in, by instance and text digest.
// TypedDocumentResult.view, ViewChain.view, annotation indexes and
// model_ref values are message-local and mean nothing elsewhere.
message ScopedRef
{
  // ResultIdentity.result_id of the result the item is in.
  string result_id = 1;
  // The layer id.
  string layer = 2;
  // The layer instance; empty for the default.
  string instance = 3;
  // The item's index in that layer.
  uint32 index = 4;
  // The instance of the native view the item's spans are in.
  string view_instance = 5;
  // SHA-256 of that view's UTF-8 text, 32 bytes.
  bytes view_text_digest = 6;
}

// A run of count consecutive edits of one view to its parent, each
// replacing parent_width parent bytes with child_width child bytes,
// the first at (parent_start, child_start) and each next one starting
// where the one before it ends on both sides. count is 1 for a lone
// edit; a width of 0 on one side is a deletion or an insertion, never
// on both. Decoding a run gives exactly the native Edit list: edit k
// is parent [parent_start + k * parent_width, + parent_width) and
// child [child_start + k * child_width, + child_width).
message EditRun
{
  // First edit's start in the parent view, UTF-8 bytes.
  uint32 parent_start = 1;
  // Each edit's width in the parent view, UTF-8 bytes.
  uint32 parent_width = 2;
  // First edit's start in this view, UTF-8 bytes.
  uint32 child_start = 3;
  // Each edit's width in this view, UTF-8 bytes.
  uint32 child_width = 4;
  // The edits in the run; at least 1.
  uint32 count = 5;
}

// One view's place in the document's view tree and its native
// alignment to its parent: the ordered, non-overlapping edit pairs in
// canonical UTF-8 byte coordinates, exactly the native Alignment, in
// runs. Outside the edits parent and child are byte for byte the
// same. Mapping between any two views is the stepwise walk up from
// the span's own view to their lowest common ancestor and down again,
// one alignment at a time, a span's start widened to the start of an
// edit it falls inside and its end to that edit's end (Side::Start
// and Side::End); an empty span at inserted or deleted bytes stays
// empty before them. A composed net alignment is never substituted:
// its empty-span behaviour differs. A consumer of this chain holds
// byte lengths, not every view's text, so it can refuse only a span
// outside its view; the server also refuses a span that splits a
// UTF-8 scalar, and a port need not promise that refusal.
message ViewChain
{
  // Message-local ViewId; the source view is 0.
  uint32 view = 1;
  // The view's instance name; empty for the source view.
  string instance = 2;
  // The parent's view; absent for the source view, which has no edits.
  optional uint32 parent = 3;
  // SHA-256 of this view's UTF-8 text, and its length in UTF-8 bytes.
  bytes text_digest = 4;
  // The view's text length in UTF-8 bytes.
  uint32 text_len = 5;
  // The number of native edits: the sum of the runs' counts.
  uint32 edit_count = 6;
  // The native edits as runs, in order; empty for the source view.
  repeated EditRun edits = 7;
}

// The whole view tree, inline. The source view comes first and every
// view after its parent.
message InlineMapping
{
  // The version of the chain encoding and mapping rules above: 1.
  uint32 mapping_schema_version = 1;
  // Every view of the result, the source view first and each after its
  // parent.
  repeated ViewChain views = 2;
}

// The mapping payload. Inline is the only mode served; it is bounded
// by max_mapping_edits and a document over it is refused with
// TURBO_E_CAPACITY, never truncated. Arm 2, artifact, is reserved for
// an immutable artifact reference and is not implemented: the server
// keeps no artifacts.
message MappingPayload
{
  oneof payload
  {
    // The whole view tree in this message.
    InlineMapping inline = 1;
  }
  reserved 2;
  reserved "artifact";
}

// ---- The processing receipt (issue #1908) ----
//
// A receipt says what one attempt at an operation did. It is kept apart
// from the immutable result it references: a new attempt or receipt
// never changes the result identity. The server binds and echoes the
// caller's operation key and keeps no state for it; rejecting a reused
// key with different input is the caller's job, and nothing here
// promises exactly-once execution.

// What became of an operation, or of one layer in it. UNSPECIFIED is
// never written. COMPLETE with zero items is an explicit "assessed,
// nothing found".
enum ProcessingStatus
{
  PROCESSING_STATUS_UNSPECIFIED = 0;
  PROCESSING_STATUS_COMPLETE = 1;
  PROCESSING_STATUS_PARTIAL = 2;
  PROCESSING_STATUS_NOT_ASSESSED = 3;
  PROCESSING_STATUS_FAILED = 4;
  PROCESSING_STATUS_CANCELLED = 5;
}

// Why a layer assessed less than its whole text.
enum TruncationReason
{
  TRUNCATION_REASON_UNSPECIFIED = 0;
  // The encoder's longest sequence cut the input.
  TRUNCATION_REASON_MAX_SEQUENCE = 1;
  // An item or byte cap stopped the annotator early.
  TRUNCATION_REASON_MAX_ITEMS = 2;
  TRUNCATION_REASON_MAX_BYTES = 3;
  // The operation's deadline stopped the annotator early.
  TRUNCATION_REASON_DEADLINE = 4;
}

// A half-open range [start, end) of source view (view 0) UTF-8 bytes.
message ByteRange
{
  // First byte, inclusive.
  uint32 start = 1;
  // One past the last byte; at least `start`.
  uint32 end = 2;
}

// A detector (annotator) by its registered name and version.
message DetectorRef
{
  // The registered annotator name, such as turbo-pii:pii.
  string id = 1;
  // The annotator's version string (Annotator::VERSION).
  string version = 2;
}

// One layer or view instance in a receipt.
message LayerReceipt
{
  // The layer id, such as turbo:pii, or turbo:view for a view.
  string layer = 1;
  // The instance name; empty for the default instance.
  string instance = 2;
  // How far the layer was made. UNSPECIFIED is refused.
  ProcessingStatus status = 3;
  // The layer's item count: 0 on a COMPLETE layer means nothing found.
  uint32 item_count = 4;
  // What the layer assessed, in source view UTF-8 bytes, sorted and
  // disjoint; empty when nothing was assessed.
  repeated ByteRange assessed = 5;
  // The detector asked to make the layer, and the ones that ran on the
  // document (empty when it declined or was skipped upstream).
  repeated DetectorRef requested = 6;
  // The detectors that ran on the document.
  repeated DetectorRef executed = 7;
  // Why the layer's input was cut short, each reason once; empty when it
  // was not. UNSPECIFIED is refused.
  repeated TruncationReason truncations = 8;
  // Why the layer failed or was skipped; absent on a COMPLETE layer.
  optional LayerError error = 9;
  // The layer's configuration identity: its LayerProvenance
  // provenance_digest (rule turbo:provenance-digest:v2, over the
  // annotator, version, config key and model). Absent for a layer the
  // graph holds no digest for.
  optional bytes provenance_digest = 10;
}

// The receipt of one attempt at one operation.
message ProcessingReceipt
{
  // The version of the receipt's messages and rules: 1.
  uint32 receipt_schema_version = 1;
  // The caller's key, as given; empty when the caller supplied none.
  string operation_key = 2;
  // This attempt, from the server: 32 lowercase hexadecimal digits,
  // new on every attempt.
  string attempt_id = 3;
  // The exact input the attempt ran on.
  InputIdentity input = 4;
  // The result it produced; absent when it produced none (cancelled, or
  // failed before a result existed).
  optional ResultIdentity result = 5;
  // The attempt's overall status. UNSPECIFIED is refused.
  ProcessingStatus status = 6;
  // The sum of the layers' item counts.
  uint64 item_count = 7;
  // One entry per layer and view instance, in document order.
  repeated LayerReceipt layers = 8;
  // The pipeline steps asked for and the ones that ran; both empty for
  // an operation that runs no steps, such as InspectDocumentGraph.
  repeated string requested_steps = 9;
  // The steps that ran, in run order.
  repeated string executed_steps = 10;
  // SHA-256 of the processing configuration, independent of the input
  // text, rule turbo.processing-config.v1: the domain tag, then the entry
  // count and, for every view and layer entry sorted by (layer id,
  // instance), the layer id, instance, annotator and version (each a u64
  // little-endian length then UTF-8), the config hash as u64
  // little-endian, the model identity (byte 0 when absent, else byte 1 and
  // its id, revision and sha256) and the read keys sorted by (layer id,
  // instance), their count then each layer id and instance. No text, view,
  // source or content digest takes part, so one operation key reused under
  // another configuration is detectable; input carries the input digests.
  bytes config_digest = 11;
}

// Runtime execution environment for a model-backed layer.
message ExecutionInfo
{
  string backend = 1;
  string device = 2;
  string precision = 3;
}

// Deduplicated model and annotator provenance entry referenced by
// `model_ref` from layers and annotations.
message ModelProvenance
{
  string model_ref = 1;
  string annotator = 2;
  string version = 3;
  uint64 config_hash = 4;
  optional ModelRef bundle = 5;
  optional ExecutionInfo execution = 6;
}

// What a layer's items hang on.
enum AnchorKind
{
  ANCHOR_KIND_TEXT = 0;
  ANCHOR_KIND_ALIGNED = 1;
  ANCHOR_KIND_DOCUMENT = 2;
}

// What projecting a span onto the result's view did to it (issue
// #1907), straight from the native projection: never recomputed.
enum SpanOutcome
{
  // Never served; a validator refuses it.
  SPAN_OUTCOME_UNSPECIFIED = 0;
  // Mapped back along the chain, the fragment is the native span: it
  // covers exactly the bytes the annotation stood for. A span the
  // result shows on its own view, and a span that is not projected at
  // all (one the message says is in another view's bytes), is exact.
  SPAN_OUTCOME_EXACT = 1;
  // The fragment covers more than the native span stood for: a lossy
  // edit on the chain widened it to the edit's bounds.
  SPAN_OUTCOME_WIDENED = 2;
  // A non-empty native span landed on text the result's view deleted:
  // the fragment is empty and anchors where the text was. Only an
  // empty fragment is deleted.
  SPAN_OUTCOME_DELETED = 3;
}

// One native fragment that coalesced into a projected SpanFragment: its
// index in the annotation's native fragment list and its own outcome.
message FragmentMember
{
  // The native fragment's index in the annotation's native fragment list.
  uint32 index = 1;
  // That fragment's own outcome. UNSPECIFIED is refused.
  SpanOutcome outcome = 2;
}

// One contiguous half-open span fragment [start, end) in the enclosing
// message's view and OffsetMode, with what projection did to it.
// Projected onto another view, native fragments that overlap, or an
// empty one inside or touching another, coalesce into one fragment:
// `members` then lists them by ascending native index, each with its
// own outcome, and the fragment's outcome is widened when any member
// is, else exact when any member is, else deleted. A fragment that is
// not coalesced carries no members. A consumer holding the result's
// mapping (InlineMapping) reproduces every outcome by mapping the
// native span to this view and back along the chain, stepwise: it is
// exact when the round trip gives the native span back, deleted when
// a non-empty span lands empty, widened otherwise.
message SpanFragment
{
  uint32 start = 1;
  uint32 end = 2;
  // What projection did to the fragment. UNSPECIFIED is refused.
  SpanOutcome outcome = 3;
  // The native fragments coalesced here, by ascending index; empty when
  // none were.
  repeated FragmentMember members = 4;
}

// A cross-layer index bound declared by a TypedLayer (`Layer::indexes`).
message LayerIndexBound
{
  string layer = 1;
  string instance = 2;
  uint32 bound = 3;
}

// Strongly-typed projection of an entire Document in dependency order.
message TypedDocumentResult
{
  string doc_id = 1;
  string raw_text = 2;
  // Message-local ViewId of the view raw_text and every span are in.
  uint32 view = 3;
  OffsetMode offsets = 4;
  repeated ModelProvenance models = 5;
  repeated ViewInfo views = 6;
  repeated TypedLayer layers = 7;
  // The envelope (issue #1907): what the result was computed from,
  // what it is, how each layer was made, and the view edit chain.
  InputIdentity input = 8;
  // What the result is: its graph digest and schema versions.
  ResultIdentity result = 9;
  // One entry per view and layer instance, in document order.
  repeated LayerProvenance provenance = 10;
  // The view edit chain every span maps through.
  MappingPayload mapping = 11;
  // The processing receipt of the operation that produced this answer
  // (issue #1908). It is not part of the result: the result identity is
  // the digest of the graph bytes, so a new receipt never changes it.
  ProcessingReceipt receipt = 12;

  // Set when `raw_text` was withheld for PII (PiiOutputOptions, #1904):
  // the target view text's length in `offsets` units, which the spans are
  // bounded by.
  optional uint32 withheld_text_len = 20;
}

// One typed layer instance on a TypedDocumentResult.
message TypedLayer
{
  string id = 1;
  string instance = 2;
  LayerWireStatus status = 3;
  reserved 4;
  reserved "status_detail";
  AnchorKind scope = 5;
  repeated string model_refs = 6;
  optional string anchor_layer = 7;
  repeated TypedAnnotation annotations = 8;
  repeated LayerIndexBound indexes_layer = 9;
  // Message-local ViewId of the view the layer's native spans are in,
  // before projection into TypedDocumentResult.view; absent for a
  // layer without text spans.
  optional uint32 native_view = 10;
  // Why the layer is not OK; absent when it is.
  optional LayerError error = 11;
  // The custom-kind names a turbo:pii or turbo:pii-candidates layer's
  // PiiKindRef.custom indexes, and for a turbo:pii-edits layer its covered
  // pii layer's table; empty for every other layer.
  repeated string custom_pii_kinds = 12;
}

// One recognizer vote on an EntityAnnotation, populated from
// Evidence<Entities> when present.
message EntityVote
{
  string annotator = 1;
  optional string model_ref = 2;
  repeated SpanFragment spans = 3;
  optional double probability = 4;
  optional double calibrated_probability = 5;
  optional string abstention = 6;
}

message SentenceAnnotation
{
  uint32 index = 1;
  string text = 2;
}

message TokenAnnotation
{
  optional uint32 sentence_index = 1;
  string surface = 2;
}

message WordAnnotation
{
  uint32 token_start = 1;
  uint32 token_end = 2;
  optional SpanFragment subspan = 3;
  string form = 4;
}

message SubwordAnnotation
{
  int32 vocab_id = 1;
  optional uint32 token_index = 2;
  string surface = 3;
}

message PosTagAnnotation
{
  string tagset = 1;
  string tag = 2;
  uint32 target_index = 3;
}

message MorphFeaturesAnnotation
{
  uint32 target_index = 1;
  string features = 2;
}

message LemmaAnnotation
{
  uint32 target_index = 1;
  string lemma = 2;
}

message StemAnnotation
{
  uint32 token_index = 1;
  string stem = 2;
}

message TermAnnotation
{
  uint32 token_index = 1;
  string surface = 2;
  string folded = 3;
  optional string stem = 4;
  optional string lemma = 5;
}

message ChunkTagAnnotation
{
  string tagset = 1;
  string tag = 2;
  uint32 token_index = 3;
}

message PhraseChunkAnnotation
{
  string tagset = 1;
  string kind = 2;
  uint32 token_start = 3;
  uint32 token_end = 4;
}

message PhraseAnnotation
{
  string tagset = 1;
  string kind = 2;
  uint32 token_start = 3;
  uint32 token_end = 4;
  uint32 head_token = 5;
  optional uint32 parent_index = 6;
}

message DependencyAnnotation
{
  string tagset = 1;
  uint32 target_index = 2;
  optional uint32 head_index = 3;
  string relation = 4;
}

message EntityAnnotation
{
  string tagset = 1;
  string kind = 2;
  uint32 token_start = 3;
  uint32 token_end = 4;
  string canonical = 5;
  optional string kb_id = 6;
  repeated EntityVote votes = 7;
}

message RelationAnnotation
{
  string tagset = 1;
  string kind = 2;
  uint32 subject_entity = 3;
  uint32 object_entity = 4;
}

message CorefMentionAnnotation
{
  uint32 sentence_index = 1;
  uint32 token_start = 2;
  uint32 token_end = 3;
  uint32 head_token = 4;
  optional uint32 entity_index = 5;
  string kind = 6;
  string origin = 7;
  string number = 8;
  string gender = 9;
  string animacy = 10;
  string person = 11;
}

message CorefChainAnnotation
{
  string representative = 1;
  repeated uint32 mention_indices = 2;
}

message SpeakerAnnotation
{
  string speaker = 1;
}

message WordNetSenseAnnotation
{
  uint32 token_index = 1;
  uint32 synset_offset = 2;
  string pos = 3;
  string lexname = 4;
  string gloss = 5;
  repeated string lemmas = 6;
  repeated uint32 hypernym_offsets = 7;
  string synset_id = 8;
  string sense_id = 9;
  string lemma = 10;
  uint32 sense_rank = 11;
  string lexicon_id = 12;
}

message LexicalExpansionAnnotation
{
  uint32 token_index = 1;
  repeated string synonyms = 2;
  repeated string hypernyms = 3;
  repeated string derivations = 4;
  repeated string morph_roots = 5;
