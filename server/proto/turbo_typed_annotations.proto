  bool cut = 4;
}

message ModalityAnnotation
{
  string polarity = 1;
  string epistemic = 2;
  string deontic = 3;
  optional SpanFragment cue = 4;
  float confidence = 5;
}

message ConsolidatedMentionProto
{
  SpanFragment span = 1;
  optional uint32 entity_index = 2;
  bool is_representative = 3;
  optional string role = 4;
}

message EntityRelationProto
{
  uint32 subject = 1;
  uint32 object = 2;
  string kind = 3;
  float score = 4;
  uint32 support = 5;
}

message DocumentEntityAnnotation
{
  string canonical_name = 1;
  string kind = 2;
  optional string kb_id = 3;
  optional float latitude = 4;
  optional float longitude = 5;
  optional string country_code = 6;
  repeated ConsolidatedMentionProto mentions = 7;
  uint32 subject_count = 8;
  uint32 object_count = 9;
  uint32 modifier_count = 10;
  uint32 other_count = 11;
  float mean_sentiment = 12;
  uint32 sentiment_mentions = 13;
  float confidence = 14;
  repeated EntityRelationProto relations = 15;
}

message EventArgumentProto
{
  SpanFragment span = 1;
  string role = 2;
  string anchored_layer = 3;
  optional uint32 anchored_index = 4;
}

message EventAnnotation
{
  optional string trigger_lemma = 1;
  uint32 sentence_index = 2;
  float confidence = 3;
  repeated EventArgumentProto arguments = 4;
}

message EduAnnotation
{
  uint32 index = 1;
  uint32 sentence_index = 2;
  string text = 3;
}

message SparseTermEntryProto
{
  uint32 term_id = 1;
  float weight = 2;
  optional SpanFragment span = 3;
  repeated SpanFragment occurrences = 4;
}

message SparseTermsAnnotation
{
  uint32 target_index = 1;
  repeated SparseTermEntryProto entries = 2;
}

message AlternativeAnnotation
{
  uint32 position = 1;
  uint32 position_length = 2;
  uint32 mode_bits = 3;
  optional double score = 4;
  optional string form = 5;
}

message NBestCandidateProto
{
  uint32 rank = 1;
  double sequence_score = 2;
  string tag = 3;
  optional double probability = 4;
}

message NBestAnnotation
{
  uint32 target_index = 1;
  string tagset = 2;
  repeated NBestCandidateProto candidates = 3;
}

message TableCellAnnotation
{
  uint32 table_id = 1;
  uint32 row_index = 2;
  uint32 col_index = 3;
  uint32 row_span = 4;
  uint32 col_span = 5;
  bool is_header = 6;
  string align = 7;
}

message KeyValuePairAnnotation
{
  SpanFragment key_span = 1;
  SpanFragment separator_span = 2;
  SpanFragment value_span = 3;
  string key_text = 4;
  string value_text = 5;
}

message EntitySalienceAnnotation
{
  uint32 entity_index = 1;
  float salience = 2;
  uint32 rank = 3;
  float position_score = 4;
  float syntax_score = 5;
  float frequency_score = 6;
  float centrality_score = 7;
}

message ChunkTableHeaderAnnotation
{
  uint32 chunk_index = 1;
  uint32 table_id = 2;
  bool is_continuation = 3;
  repeated SpanFragment header_cells = 4;
  string header_prefix = 5;
}

message RecordValueAnnotation
{
  uint32 record_index = 1;
  string record_type = 2;
  uint32 instance = 3;
  string path = 4;
  double score = 5;
  double logit = 6;
}

// View-specific heuristic metrics, not annotation probabilities. Every metric
// must be present. Explicit presence preserves zero values, including -0.0.
// Ratios/composite score are finite [0,1], MTLD is finite and nonnegative,
// and readability indices are finite but may be negative. Flags use the
// shared QualityFlags bit set (currently bits 0 through 6).
message QualityMetricsAnnotation
{
  optional float composite_score = 1;
  optional float mtld_lexical_diversity = 2;
  optional float flesch_kincaid_grade = 3;
  optional float automated_readability_index = 4;
  optional float coleman_liau_index = 5;
  optional float information_density = 6;
  optional float alpha_ratio = 7;
  optional float digit_ratio = 8;
  optional float symbol_ratio = 9;
  optional float whitespace_ratio = 10;
  optional float replacement_ratio = 11;
  uint32 flags = 12;
}

// One syntactic or morphological grammar diagnostic in turbo:grammar_diagnostics.
message GrammarDiagnosticAnnotation
{
  enum Category
  {
    SUBJECT_VERB_AGREEMENT = 0;
    DETERMINER_NOUN_AGREEMENT = 1;
    ARTICLE_PHONETICS = 2;
    AUXILIARY_VERB_FORM = 3;
    REPEATED_TOKEN = 4;
    CASE_GOVERNMENT = 5;
    CLAUSE_PUNCTUATION = 6;
  }
  string rule_id = 1;
  optional Category category = 2;
  string message = 3;
  repeated string replacements = 4;
  float confidence = 5;
}

// Exact layer instance and item range supporting an evidence record.
message EvidenceSupport
{
  string layer = 1;
  string instance = 2;
  uint32 start = 3;
  uint32 end = 4;
}

// One record aligned to its selected category row. The producer is the
// annotation's model_ref; annotation spans are projected source evidence.
// Raw scores are finite and may be negative; calibrated scores are [0,1].
message EvidenceAnnotation
{
  uint32 target_index = 1;
  optional double raw_score = 2;
  optional double calibrated_probability = 3;
  optional string abstention = 4;
  repeated EvidenceSupport support = 5;
}

// One strongly-typed annotation in a TypedLayer.
// Content is carried by the enclosing annotation's projected spans. Optional
// speaker/cue messages retain presence even when normalization deletes their
// text and projects them to an empty span.
message QuotationAnnotation
{
  enum Kind
  {
    DIRECT = 0;
    INDIRECT = 1;
    MIXED = 2;
  }
  optional Kind kind = 1;
  // Required on successful quotation records. Explicit presence preserves
  // every native f32 bit, including negative zero, and distinguishes omission.
  optional float confidence = 2;
  SpanFragment speaker = 3;
  SpanFragment cue_verb = 4;
  // Raw contextual row in the producer's default coreference chains. The
  // native layer does not bounds-check or resolve this field; it may be
  // present without a chain layer, and is not an indexes_layer reference.
  optional uint32 speaker_chain = 5;
}

message PageBoundingBoxProto
{
  uint32 page = 1;
  float x0 = 2;
  float y0 = 3;
  float x1 = 4;
  float y1 = 5;
}

message LayoutBoxAnnotation
