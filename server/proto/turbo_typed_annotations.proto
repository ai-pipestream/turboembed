  uint32 record_index = 1;
  string record_type = 2;
  uint32 instance = 3;
  string path = 4;
  double score = 5;
  double logit = 6;
}

// View-specific heuristic metrics, not annotation probabilities. Every metric
// must be present. Explicit presence preserves zero values, including -0.0.
// Ratios/composite score are finite [0,1], MTLD is finite and nonnegative,
// and readability indices are finite but may be negative. Flags use the
// shared QualityFlags bit set (currently bits 0 through 6).
message QualityMetricsAnnotation
{
  optional float composite_score = 1;
  optional float mtld_lexical_diversity = 2;
  optional float flesch_kincaid_grade = 3;
  optional float automated_readability_index = 4;
  optional float coleman_liau_index = 5;
  optional float information_density = 6;
  optional float alpha_ratio = 7;
  optional float digit_ratio = 8;
  optional float symbol_ratio = 9;
  optional float whitespace_ratio = 10;
  optional float replacement_ratio = 11;
  uint32 flags = 12;
}

// Exact layer instance and item range supporting an evidence record.
message EvidenceSupport
{
  string layer = 1;
  string instance = 2;
  uint32 start = 3;
  uint32 end = 4;
}

// One record aligned to its selected category row. The producer is the
// annotation's model_ref; annotation spans are projected source evidence.
// Raw scores are finite and may be negative; calibrated scores are [0,1].
message EvidenceAnnotation
{
  uint32 target_index = 1;
  optional double raw_score = 2;
  optional double calibrated_probability = 3;
  optional string abstention = 4;
  repeated EvidenceSupport support = 5;
}

// One strongly-typed annotation in a TypedLayer.
message TypedAnnotation
{
  repeated SpanFragment spans = 1;
  optional double probability = 2;
  optional string model_ref = 3;

  oneof value
  {
    SentenceAnnotation sentence = 10;
    TokenAnnotation token = 11;
    WordAnnotation word = 12;
    SubwordAnnotation subword = 13;
    PosTagAnnotation pos_tag = 14;
    MorphFeaturesAnnotation morph_features = 15;
    LemmaAnnotation lemma = 16;
    StemAnnotation stem = 17;
    TermAnnotation term = 18;
    ChunkTagAnnotation chunk_tag = 19;
    PhraseChunkAnnotation phrase_chunk = 20;
    PhraseAnnotation phrase = 21;
    DependencyAnnotation dependency = 22;
    EntityAnnotation entity = 23;
    RelationAnnotation relation = 24;
    CorefMentionAnnotation coref_mention = 25;
    CorefChainAnnotation coref_chain = 26;
    SpeakerAnnotation speaker = 27;
    WordNetSenseAnnotation wordnet_sense = 28;
    LexicalExpansionAnnotation lexical_expansion = 29;
    GlossaryTermAnnotation glossary_term = 30;
    NumberAnnotation number = 31;
    OrdinalAnnotation ordinal = 32;
    MoneyAnnotation money = 33;
    QuantityAnnotation quantity = 34;
    TemporalAnnotation temporal = 35;
    TimeAnnotation time = 36;
    DocumentDateAnnotation document_date = 37;
    PlaceResolution place = 38;
    ContainmentChain containment = 39;
    RegionVote region_vote = 40;
    LanguageAnnotation language = 41;
    LanguageSpanAnnotation language_span = 42;
    CategoryAnnotation category = 43;
    SentimentAnnotation sentiment = 44;
    EmotionAnnotation emotion = 45;
    AspectAnnotation aspect = 46;
    OpinionAnnotation opinion = 47;
    IncivilityAnnotation incivility = 48;
    PragmaticsAnnotation pragmatics = 49;
    PiiMention pii = 50;
    NoiseSpan noise = 51;
    TextArtifact artifact = 52;
    EmbeddedAsset asset = 53;
    SpellingCorrection correction = 54;
    PlaceholderAnnotation placeholder = 55;
    EmojiAnnotation emoji = 56;
    ProtectedSpanAnnotation protected_span = 57;
    AbbreviationAnnotation abbreviation = 58;
    MatchAnnotation rule_match = 59;
    BoilerplateAnnotation boilerplate = 60;
    ConfidenceAnnotation confidence = 61;
    StopwordFlagAnnotation stopword_flag = 62;
    WordTypeAnnotation word_type = 63;
    ReadingAnnotation reading = 64;
    KeywordAnnotation keyword = 65;
    SourceEncodingAnnotation source_encoding = 66;
    VectorAnnotation vector = 67;
    ChunkAnnotation chunk = 68;
    LevelAnnotation level_unit = 69;
    BoundaryAnnotation boundary = 70;
    StructureAnnotation structure = 71;
    AnswerAnnotation answer = 72;
    EdgeAnnotation edge = 73;
    GroupAnnotation group = 74;
    LinkedEntityAnnotation linked_entity = 75;
    CalibratedAnnotation calibrated = 76;
    TokenVectorWindowAnnotation token_vector_window = 77;
    Utf16SpanAnnotation utf16_span = 78;
    ModalityAnnotation modality = 79;
    DocumentEntityAnnotation document_entity = 80;
    EventAnnotation event = 81;
    EduAnnotation edu = 82;
    SparseTermsAnnotation sparse_terms = 83;
    AlternativeAnnotation alternative = 84;
    NBestAnnotation nbest = 85;
    TableCellAnnotation table_cell = 86;
    KeyValuePairAnnotation key_value_pair = 87;
    RecordValueAnnotation record_value = 88;
    EntitySalienceAnnotation entity_salience = 89;
    ChunkTableHeaderAnnotation chunk_table_header = 90;
    QualityMetricsAnnotation text_quality = 91;
    QualityMetricsAnnotation span_quality = 92;
    EvidenceAnnotation evidence = 93;
  }
}
