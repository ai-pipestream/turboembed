// Lexical resources over gRPC (docs/grpc-vocabulary.md): dictionaries a
// client uploads and the server validates with the analysis readers, and
// corpus vocabularies the server learns from a stream of documents, both
// kept as artifacts in the server's vocabulary store.
//
// SPDX-License-Identifier: Apache-2.0

syntax = "proto3";
package turbo.vocabulary.v1;

// The vocabulary store. Listing, describing and downloading are served
// to every client; ImportDictionary, LearnVocabulary and
// DeleteVocabularyArtifact write to the store and are admin calls, served
// only when the server runs with --admin and a --vocabulary-dir. A
// refusal carries turbo-code like every other service of the server: a
// malformed upload is TURBO_E_INVALID_ARGUMENT, an upload past a limit
// TURBO_E_CAPACITY, an unknown artifact TURBO_E_BUNDLE_NOT_FOUND.
service TurboVocabularyService
{
  // The dictionary formats the server knows, which of them it can import,
  // and the store's limits.
  rpc ListDictionaryFormats(ListDictionaryFormatsRequest) returns (ListDictionaryFormatsResponse) {}

  // The stored dictionaries, in artifact id order.
  rpc ListDictionaries(ListDictionariesRequest) returns (ListDictionariesResponse) {}

  // The stored learned vocabularies, in artifact id order.
  rpc ListVocabularies(ListVocabulariesRequest) returns (ListVocabulariesResponse) {}

  // Removes a dictionary or a vocabulary from the store.
  rpc DeleteVocabularyArtifact(DeleteVocabularyArtifactRequest) returns (DeleteVocabularyArtifactResponse) {}

  // A client-streaming upload: one ImportDictionaryHeader, then the
  // file's bytes in chunk frames. The server checks the byte count and
  // the SHA-256 the header names, parses the whole file with the format's
  // reader, and only then stores it, so a refused upload leaves the store
  // as it was. The same bytes in the same format are the same artifact.
  rpc ImportDictionary(stream ImportDictionaryRequest) returns (DictionaryArtifactDescriptor) {}

  // A client-streaming corpus learner: one LearnVocabularyHeader, then
  // documents. The answer describes the stored vocabulary, whose bytes
  // DownloadVocabulary returns. The same documents in the same order with
  // the same header give the same bytes.
  rpc LearnVocabulary(stream LearnVocabularyRequest) returns (VocabularyArtifactDescriptor) {}

  // The bytes of a stored artifact, a dictionary as uploaded or a
  // vocabulary as learned, in chunks of at most 64 KiB, the descriptor
  // first.
  rpc DownloadVocabulary(DownloadVocabularyRequest) returns (stream VocabularyArtifactChunk) {}

  // Lists compiled stem-to-surface and surface-prefix lexicons (#2341).
  rpc ListSuggestLexicons(ListSuggestLexiconsRequest) returns (ListSuggestLexiconsResponse) {}

  // Client-streaming builder for a zero-copy stem-to-surface and prefix
  // lexicon (#2341): one BuildSuggestLexiconHeader followed by either
  // explicit (surface, stem, count) observations or raw documents.
  rpc BuildSuggestLexicon(stream BuildSuggestLexiconRequest) returns (SuggestLexiconArtifactDescriptor) {}

  // Completes a surface prefix against a mapped suggest lexicon (#2341),
  // returning canonical surface completions paired with target stems.
  rpc SuggestPrefix(SuggestPrefixRequest) returns (SuggestPrefixResponse) {}

  // Looks up canonical surface realizations for an indexed stem (#2341).
  rpc LookupStemSurfaces(LookupStemSurfacesRequest) returns (LookupStemSurfacesResponse) {}

  // Context-aware multi-word query spellcheck ("Did you mean?", #2341)
  // backed by a learned vocabulary artifact's unigram and n-gram counts.
  rpc SpellcheckQuery(SpellcheckQueryRequest) returns (SpellcheckQueryResponse) {}

  // Client-streaming upload of collection-wide (term, df, doc_count) snapshots
  // (#2346), compiling a deterministic TCIDF001 corpus IDF artifact.
  rpc ImportCorpusStatistics(stream ImportCorpusStatisticsRequest) returns (CorpusStatisticsArtifactDescriptor) {}

  // Lists stored TCIDF001 corpus IDF statistics artifacts (#2346).
  rpc ListCorpusStatistics(ListCorpusStatisticsRequest) returns (ListCorpusStatisticsResponse) {}

  // Client-streaming trainer for spherical k-means Voronoi routing centroids
  // (#2346), exporting a versioned TCENT001 centroid bundle.
  rpc TrainVoronoiCentroids(stream TrainVoronoiCentroidsRequest) returns (VoronoiCentroidArtifactDescriptor) {}

  // Lists stored TCENT001 Voronoi routing centroid artifacts (#2346).
  rpc ListVoronoiCentroids(ListVoronoiCentroidsRequest) returns (ListVoronoiCentroidsResponse) {}
}

message ListDictionaryFormatsRequest {}

message DictionaryFormat
{
  // The id an upload names, such as glossary-csv.
  string format_id = 1;
  string description = 2;
  // Whether ImportDictionary accepts the format. A format read from more
  // than one file (hunspell-aff-dic, morfologik-fsa) is listed but not
  // importable as one upload.
  bool importable = 3;
  // Whether the header's language selects what is read (glossary-tbx).
  bool needs_language = 4;
}

message StoreLimits
{
  // Whether this server has a vocabulary store, and serves its writes.
  bool store = 1;
  bool admin = 2;
  // The largest dictionary upload, in bytes.
  uint64 max_dictionary_upload_bytes = 3;
  // The most document text one LearnVocabulary reads, in bytes.
  uint64 max_learn_bytes = 4;
  // The largest n-gram size a LearnVocabulary may ask for.
  uint32 max_ngram_size = 5;
  // The largest frame DownloadVocabulary sends.
  uint32 download_chunk_bytes = 6;
}

message ListDictionaryFormatsResponse
{
  repeated DictionaryFormat formats = 1;
  StoreLimits limits = 2;
}

message DictionaryArtifactDescriptor
{
  string artifact_id = 1;
  string format_id = 2;
  string language = 3;
  // The name the uploader gave, kept as given.
  string name = 4;
  // Entries the format's reader found: glossary entries, words, headwords,
  // dictionary entries, or WordNet senses.
  uint64 entry_count = 5;
  uint64 byte_size = 6;
  // Lowercase hex of the stored bytes' SHA-256.
  string sha256 = 7;
}

message VocabularyArtifactDescriptor
{
  string artifact_id = 1;
  string language = 2;
  // Documents and word tokens the learner read.
  uint64 documents = 3;
  uint64 tokens = 4;
  // Rows of the vocabulary: single terms, and n-grams.
  uint64 term_count = 5;
  uint64 ngram_count = 6;
  uint64 byte_size = 7;
  string sha256 = 8;
  // The seed dictionary the learner merged, or empty.
  string seed_dictionary_artifact_id = 9;
}

message ListDictionariesRequest {}

message ListDictionariesResponse
{
  repeated DictionaryArtifactDescriptor dictionaries = 1;
}

message ListVocabulariesRequest {}

message ListVocabulariesResponse
{
  repeated VocabularyArtifactDescriptor vocabularies = 1;
}

message DeleteVocabularyArtifactRequest
{
  string artifact_id = 1;
}

message DeleteVocabularyArtifactResponse {}

message ImportDictionaryHeader
{
  string format_id = 1;
  // A BCP 47 tag. Required where the format needs one, kept otherwise.
  string language = 2;
  string name = 3;
  // The upload's size and lowercase hex SHA-256, both checked.
  uint64 byte_size = 4;
  string sha256 = 5;
  // Delimited formats only: the first record is a header and is dropped.
  bool has_header_row = 6;
}

message ImportDictionaryRequest
{
  oneof frame
  {
    ImportDictionaryHeader header = 1;
    bytes chunk = 2;
  }
}

message LearnVocabularyHeader
{
  // A term or n-gram seen fewer times than this is left out (0 is 1).
  uint32 min_term_frequency = 1;
  // The most single terms, and separately the most n-grams, kept: the
  // most frequent, ties in byte order (0 keeps all).
  uint32 max_terms = 2;
  bool lowercase = 3;
  // Drops the language's bundled stopwords from the terms, and n-grams
  // that start or end with one.
  bool filter_stopwords = 4;
  bool include_ngrams = 5;
  // n-gram sizes, both at least 2 and at most StoreLimits.max_ngram_size.
  uint32 min_ngram_size = 6;
  uint32 max_ngram_size = 7;
  // An n-gram's pointwise mutual information, in bits, must reach this.
  double min_pmi = 8;
  // A stored dictionary whose headwords are kept whatever their counts.
  string dictionary_artifact_id = 9;
  string language = 10;
}

message LearnVocabularyDocument
{
  string text = 1;
}

message LearnVocabularyRequest
{
  oneof frame
  {
    LearnVocabularyHeader header = 1;
    LearnVocabularyDocument document = 2;
  }
}

message DownloadVocabularyRequest
{
  string artifact_id = 1;
}

message VocabularyArtifactChunk
{
  oneof frame
  {
    // The first frame: the artifact's descriptor.
    DictionaryArtifactDescriptor dictionary = 1;
    VocabularyArtifactDescriptor vocabulary = 2;
    // Every later frame: the next bytes, at most 64 KiB.
    bytes data = 3;
    SuggestLexiconArtifactDescriptor suggest_lexicon = 4;
    CorpusStatisticsArtifactDescriptor corpus_statistics = 5;
    VoronoiCentroidArtifactDescriptor voronoi_centroids = 6;
  }
}

message SuggestLexiconArtifactDescriptor
{
  string artifact_id = 1;
  string language = 2;
  uint64 entry_count = 3;
  uint64 stem_count = 4;
  uint64 byte_size = 5;
  string sha256 = 6;
}

message ListSuggestLexiconsRequest {}

message ListSuggestLexiconsResponse
{
  repeated SuggestLexiconArtifactDescriptor lexicons = 1;
}

message BuildSuggestLexiconHeader
{
  // BCP 47 language tag selecting the server stemmer when raw documents are
  // streamed (defaults to "en" Snowball English when empty).
  string language = 1;
  // Maximum completions stored per folded prefix node (0 uses default 16).
  uint32 top_k_prefix = 2;
  // Maximum surface realizations stored per stem (0 uses default 16).
  uint32 top_k_stem = 3;
  // When raw documents are streamed, count document frequency (1 per document)
  // rather than raw term frequency.
  bool count_doc_freq = 4;
}

message SuggestObservation
{
  string surface = 1;
  string stem = 2;
  uint64 count = 3;
}

message BuildSuggestLexiconRequest
{
  oneof frame
  {
    BuildSuggestLexiconHeader header = 1;
    SuggestObservation observation = 2;
    LearnVocabularyDocument document = 3;
  }
}

message SuggestPrefixRequest
{
  string artifact_id = 1;
  string prefix = 2;
  uint32 limit = 3;
}

message SurfaceCompletionItem
{
  string surface = 1;
  string stem = 2;
  uint64 count = 3;
}

message SuggestPrefixResponse
{
  repeated SurfaceCompletionItem completions = 1;
}

message LookupStemSurfacesRequest
{
  string artifact_id = 1;
  string stem = 2;
  uint32 limit = 3;
}

message StemSurfaceItem
{
  string surface = 1;
  uint64 count = 2;
}

message LookupStemSurfacesResponse
{
  repeated StemSurfaceItem surfaces = 1;
}

enum SpellcheckOffsetMode
{
  SPELLCHECK_OFFSET_MODE_UTF8 = 0;
  SPELLCHECK_OFFSET_MODE_UTF16 = 1;
  SPELLCHECK_OFFSET_MODE_CODE_POINT = 2;
}

message SpellcheckSpan
{
  uint32 start = 1;
  uint32 end = 2;
}

message SpellcheckQueryRequest
{
  string vocabulary_artifact_id = 1;
  string query = 2;
  SpellcheckOffsetMode offsets = 3;
  repeated SpellcheckSpan protected_spans = 4;
  uint32 max_edit_distance = 5;
}

message SpellcheckEditItem
{
  SpellcheckSpan span = 1;
  string original = 2;
  string replacement = 3;
  uint32 edit_distance = 4;
}

message SpellcheckQueryResponse
{
  string corrected_query = 1;
  bool did_change = 2;
  double confidence = 3;
  SpellcheckOffsetMode offsets = 4;
  repeated SpellcheckEditItem edits = 5;
}

message CorpusStatisticsHeader
{
  string language = 1;
  uint64 doc_count = 2;
  string name = 3;
}

message CorpusTermFrequencyEntry
{
  string term = 1;
  uint64 doc_freq = 2;
}

message CorpusTermFrequencyBatch
{
  repeated CorpusTermFrequencyEntry entries = 1;
}

message ImportCorpusStatisticsRequest
{
  oneof frame
  {
    CorpusStatisticsHeader header = 1;
    CorpusTermFrequencyBatch batch = 2;
  }
}

message CorpusStatisticsArtifactDescriptor
{
  string artifact_id = 1;
  string language = 2;
  string name = 3;
  uint64 doc_count = 4;
  uint64 term_count = 5;
  uint64 byte_size = 6;
  string sha256 = 7;
}

message ListCorpusStatisticsRequest {}

message ListCorpusStatisticsResponse
{
  repeated CorpusStatisticsArtifactDescriptor statistics = 1;
}

message TrainVoronoiCentroidsHeader
{
  string model_id = 1;
  string model_revision = 2;
  string model_sha256 = 3;
  uint32 dim = 4;
  uint32 num_centroids = 5;
  uint32 max_iters = 6;
  uint64 seed = 7;
  string tag_set_name = 8;
  double temperature = 9;
}

message VoronoiSampleBatch
{
  repeated float values = 1;
}

message TrainVoronoiCentroidsRequest
{
  oneof frame
  {
    TrainVoronoiCentroidsHeader header = 1;
    VoronoiSampleBatch batch = 2;
  }
}

message VoronoiCentroidArtifactDescriptor
{
  string artifact_id = 1;
  string model_id = 2;
  string model_revision = 3;
  string model_sha256 = 4;
  uint32 dim = 5;
  uint32 num_centroids = 6;
  uint64 sample_count = 7;
  double mean_cosine = 8;
  uint64 byte_size = 9;
  string sha256 = 10;
  repeated uint64 cluster_counts = 11;
}

message ListVoronoiCentroidsRequest {}

message ListVoronoiCentroidsResponse
{
  repeated VoronoiCentroidArtifactDescriptor centroids = 1;
}
