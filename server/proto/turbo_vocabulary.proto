// Lexical resources over gRPC (docs/grpc-vocabulary.md): dictionaries a
// client uploads and the server validates with the analysis readers, and
// corpus vocabularies the server learns from a stream of documents, both
// kept as artifacts in the server's vocabulary store.
//
// SPDX-License-Identifier: Apache-2.0

syntax = "proto3";
package turbo.vocabulary.v1;

// The vocabulary store. Listing, describing and downloading are served
// to every client; ImportDictionary, LearnVocabulary and
// DeleteVocabularyArtifact write to the store and are admin calls, served
// only when the server runs with --admin and a --vocabulary-dir. A
// refusal carries turbo-code like every other service of the server: a
// malformed upload is TURBO_E_INVALID_ARGUMENT, an upload past a limit
// TURBO_E_CAPACITY, an unknown artifact TURBO_E_BUNDLE_NOT_FOUND.
service TurboVocabularyService
{
  // The dictionary formats the server knows, which of them it can import,
  // and the store's limits.
  rpc ListDictionaryFormats(ListDictionaryFormatsRequest) returns (ListDictionaryFormatsResponse) {}

  // The stored dictionaries, in artifact id order.
  rpc ListDictionaries(ListDictionariesRequest) returns (ListDictionariesResponse) {}

  // The stored learned vocabularies, in artifact id order.
  rpc ListVocabularies(ListVocabulariesRequest) returns (ListVocabulariesResponse) {}

  // Removes a dictionary or a vocabulary from the store.
  rpc DeleteVocabularyArtifact(DeleteVocabularyArtifactRequest) returns (DeleteVocabularyArtifactResponse) {}

  // A client-streaming upload: one ImportDictionaryHeader, then the
  // file's bytes in chunk frames. The server checks the byte count and
  // the SHA-256 the header names, parses the whole file with the format's
  // reader, and only then stores it, so a refused upload leaves the store
  // as it was. The same bytes in the same format are the same artifact.
  rpc ImportDictionary(stream ImportDictionaryRequest) returns (DictionaryArtifactDescriptor) {}

  // A client-streaming corpus learner: one LearnVocabularyHeader, then
  // documents. The answer describes the stored vocabulary, whose bytes
  // DownloadVocabulary returns. The same documents in the same order with
  // the same header give the same bytes.
  rpc LearnVocabulary(stream LearnVocabularyRequest) returns (VocabularyArtifactDescriptor) {}

  // The bytes of a stored artifact, a dictionary as uploaded or a
  // vocabulary as learned, in chunks of at most 64 KiB, the descriptor
  // first.
  rpc DownloadVocabulary(DownloadVocabularyRequest) returns (stream VocabularyArtifactChunk) {}
}

message ListDictionaryFormatsRequest {}

message DictionaryFormat
{
  // The id an upload names, such as glossary-csv.
  string format_id = 1;
  string description = 2;
  // Whether ImportDictionary accepts the format. A format read from more
  // than one file (hunspell-aff-dic, morfologik-fsa) is listed but not
  // importable as one upload.
  bool importable = 3;
  // Whether the header's language selects what is read (glossary-tbx).
  bool needs_language = 4;
}

message StoreLimits
{
  // Whether this server has a vocabulary store, and serves its writes.
  bool store = 1;
  bool admin = 2;
  // The largest dictionary upload, in bytes.
  uint64 max_dictionary_upload_bytes = 3;
  // The most document text one LearnVocabulary reads, in bytes.
  uint64 max_learn_bytes = 4;
  // The largest n-gram size a LearnVocabulary may ask for.
  uint32 max_ngram_size = 5;
  // The largest frame DownloadVocabulary sends.
  uint32 download_chunk_bytes = 6;
}

message ListDictionaryFormatsResponse
{
  repeated DictionaryFormat formats = 1;
  StoreLimits limits = 2;
}

message DictionaryArtifactDescriptor
{
  string artifact_id = 1;
  string format_id = 2;
  string language = 3;
  // The name the uploader gave, kept as given.
  string name = 4;
  // Entries the format's reader found: glossary entries, words, headwords,
  // dictionary entries, or WordNet senses.
  uint64 entry_count = 5;
  uint64 byte_size = 6;
  // Lowercase hex of the stored bytes' SHA-256.
  string sha256 = 7;
}

message VocabularyArtifactDescriptor
{
  string artifact_id = 1;
  string language = 2;
  // Documents and word tokens the learner read.
  uint64 documents = 3;
  uint64 tokens = 4;
  // Rows of the vocabulary: single terms, and n-grams.
  uint64 term_count = 5;
  uint64 ngram_count = 6;
  uint64 byte_size = 7;
  string sha256 = 8;
  // The seed dictionary the learner merged, or empty.
  string seed_dictionary_artifact_id = 9;
}

message ListDictionariesRequest {}

message ListDictionariesResponse
{
  repeated DictionaryArtifactDescriptor dictionaries = 1;
}

message ListVocabulariesRequest {}

message ListVocabulariesResponse
{
  repeated VocabularyArtifactDescriptor vocabularies = 1;
}

message DeleteVocabularyArtifactRequest
{
  string artifact_id = 1;
}

message DeleteVocabularyArtifactResponse {}

message ImportDictionaryHeader
{
  string format_id = 1;
  // A BCP 47 tag. Required where the format needs one, kept otherwise.
  string language = 2;
  string name = 3;
  // The upload's size and lowercase hex SHA-256, both checked.
  uint64 byte_size = 4;
  string sha256 = 5;
  // Delimited formats only: the first record is a header and is dropped.
  bool has_header_row = 6;
}

message ImportDictionaryRequest
{
  oneof frame
  {
    ImportDictionaryHeader header = 1;
    bytes chunk = 2;
  }
}

message LearnVocabularyHeader
{
  // A term or n-gram seen fewer times than this is left out (0 is 1).
  uint32 min_term_frequency = 1;
  // The most single terms, and separately the most n-grams, kept: the
  // most frequent, ties in byte order (0 keeps all).
  uint32 max_terms = 2;
  bool lowercase = 3;
  // Drops the language's bundled stopwords from the terms, and n-grams
  // that start or end with one.
  bool filter_stopwords = 4;
  bool include_ngrams = 5;
  // n-gram sizes, both at least 2 and at most StoreLimits.max_ngram_size.
  uint32 min_ngram_size = 6;
  uint32 max_ngram_size = 7;
  // An n-gram's pointwise mutual information, in bits, must reach this.
  double min_pmi = 8;
  // A stored dictionary whose headwords are kept whatever their counts.
  string dictionary_artifact_id = 9;
  string language = 10;
}

message LearnVocabularyDocument
{
  string text = 1;
}

message LearnVocabularyRequest
{
  oneof frame
  {
    LearnVocabularyHeader header = 1;
    LearnVocabularyDocument document = 2;
  }
}

message DownloadVocabularyRequest
{
  string artifact_id = 1;
}

message VocabularyArtifactChunk
{
  oneof frame
  {
    // The first frame: the artifact's descriptor.
    DictionaryArtifactDescriptor dictionary = 1;
    VocabularyArtifactDescriptor vocabulary = 2;
    // Every later frame: the next bytes, at most 64 KiB.
    bytes data = 3;
  }
}
