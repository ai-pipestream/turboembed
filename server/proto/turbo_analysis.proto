// The shared analysis result layer over gRPC (docs/grpc-analysis.md),
// beside the vendored Open Inference Protocol file: the Stage 5 result
// kinds of epic #151, so an analysis result crosses a process boundary
// the way the in-process layers hold it, and a capability call that
// lists what every loaded bundle is, so a client rejects an incompatible
// request before sending it.
//
// SPDX-License-Identifier: Apache-2.0

syntax = "proto3";
package turbo.result;

// Analysis results and the server's bundle capabilities.
//
// Every result message is the data columns of one in-process result
// layer, in the layer's own layout, plus the model identity that
// produced it. A RoundTrip rpc answers with the message it was given,
// after validating it exactly as the layer's own check proves it: the
// round trip is the wire-format proof, and nothing is cut down or
// filled in. A message over a limit the capability listing names is
// refused with TURBO_E_CAPACITY naming that limit.
service AnalysisService
{
  // What this server serves: one entry per loaded bundle, its identity,
  // roles, widths, limits and task, and the result-message limits. The
  // listing follows bundles added or removed while serving.
  rpc Capabilities(CapabilitiesRequest) returns (CapabilitiesResponse) {}

  // Loads a bundle and serves it under a name; the answer is the new
  // bundle's capabilities, as the listing now shows it.
  rpc LoadBundle(LoadBundleRequest) returns (LoadBundleResponse) {}

  // Stops serving a name. Requests holding its sessions finish; the
  // name is refused from then on, as never served.
  rpc UnloadBundle(UnloadBundleRequest) returns (UnloadBundleResponse) {}

  // Each result kind answers with the message it was given, validated.
  rpc RoundTripSparseTerms(SparseTermsResult) returns (SparseTermsResult) {}
  rpc RoundTripTokenVectors(TokenVectorsResult) returns (TokenVectorsResult) {}
  rpc RoundTripRerankScores(RerankScoresResult) returns (RerankScoresResult) {}
  rpc RoundTripExtraction(ExtractionResult) returns (ExtractionResult) {}

  // Schema-extracted structured records, every span offset in the
  // message's chosen OffsetMode.
  rpc RoundTripRecords(RecordsResult) returns (RecordsResult) {}

  // Chunks, their level tree and their embeddings in one round trip,
  // with every span offset in the message's chosen OffsetMode.
  rpc RoundTripChunkLevels(ChunkLevelsResult) returns (ChunkLevelsResult) {}

  // A binary DocumentGraph in, the same document re-exported out,
  // with every view and layer's identity, provenance and status.
  rpc RoundTripDocumentGraph(DocumentGraphRequest) returns (DocumentGraphResponse) {}

  // Bulk document analysis over one bidirectional stream (issue #722):
  // the client opens with one AnalyzeStreamHeader naming the ordering and
  // its flow-control knobs, then sends documents, each with its own
  // correlation id. Every document answers exactly once, tagged with its
  // id: the document's vectors, or a structured per-document failure the
  // stream then continues past. Documents waiting on the same model are
  // micro-batched up to the bundle's batch limit, which never changes a
  // document's answer. Queued work is bounded and advertised in
  // ServerLimits.stream: a client that sends without reading is stopped
  // by backpressure, and cancelling the stream drops what was queued for
  // it. The answer bytes per document equal the single-document call's
  // raw_output_contents row for the same text and options.
  rpc AnalyzeStream(stream AnalyzeStreamRequest) returns (stream AnalyzeStreamResponse) {}

  // Progressive single-document pipeline analysis (issue #1218): runs an
  // Analyzer DAG over one document and streams each step's completion
  // (or non-backbone branch failure) with a strictly increasing 1-based
  // sequence number as soon as that step finishes, ending with the final
  // canonical DocumentGraphResponse.
  rpc AnalyzeDocumentProgressive(AnalyzePipelineRequest) returns (stream AnalyzeProgressiveEvent) {}

  // Windowed inspection of one view of a DocumentGraph (#1220):
  // elementary annotation segments inside a paginated viewport,
  // document-level category chips, multi-lane document heatmaps, and
  // optional normalization x-ray diff runs against a target view.
  rpc InspectDocumentWindow(DocumentWindowRequest) returns (DocumentWindowResponse) {}

  // Deterministic 2D/3D PCA chunk embedding projection, sentence
  // boundary drift curve, ranked term-vector stacks, and multi-budget
  // strategy comparison over a DocumentGraph (#1220).
  rpc ProjectChunks(ProjectChunksRequest) returns (ProjectChunksResponse) {}

  // Lists the standard document output formatters registered on the
  // server (#1220).
  rpc ListOutputFormats(ListOutputFormatsRequest) returns (ListOutputFormatsResponse) {}

  // Exports a DocumentGraph into a registered interchange format
  // (conllu, brat, tsv, csv, markdown, jsonld, warc) in the requested
  // OffsetMode (#1220).
  rpc FormatDocument(FormatDocumentRequest) returns (FormatDocumentResponse) {}
}

message CapabilitiesRequest {}

message CapabilitiesResponse
{
  // One entry per loaded bundle, in the order served.
  repeated BundleCapabilities bundles = 1;

  // What one result message may carry; a larger one is refused with
  // TURBO_E_CAPACITY naming the limit. Nothing is truncated.
  ResultLimits limits = 2;

  // What LoadBundle may ask for; a larger request is refused with
  // TURBO_E_CAPACITY naming the limit, before anything is allocated.
  ServerLimits server = 3;
}

// What LoadBundle may ask for. The caps keep one request from taking
// the server down: sessions pile up pinned buffers, and every served
// name holds a loaded model.
message ServerLimits
{
  // Sessions per model; a larger request is TURBO_E_CAPACITY naming
  // max_sessions_per_model.
  uint32 max_sessions_per_model = 1;

  // Served models in all, startup ones included; a registration past
  // it is TURBO_E_CAPACITY naming max_loaded_models.
  uint32 max_loaded_models = 2;

  // What the streaming bulk analysis call may queue, per stream and
  // server-wide; its flow control holds queued work to these caps.
  StreamLimits stream = 3;
}

// What one loaded bundle is and takes, so a client rejects an
// incompatible request before sending it.
message BundleCapabilities
{
  // The name requests use.
  string name = 1;

  // The bundle's own identity.
  ModelRef model = 2;

  // The task it serves, the header constant's name: TASK_EMBED,
  // TASK_RERANK, or TASK_EXTRACTIVE_QA.
  string task = 3;

  // The prompt roles it takes: PROMPT_QUERY for a non-empty
  // prefix_query, PROMPT_DOCUMENT for a non-empty prefix_document,
  // PROMPT_NONE when it carries neither.
  repeated string roles = 4;

  // The vector widths it answers: dim first, then the output_dims a
  // request may name by output_dim, ascending.
  repeated uint32 widths = 5;

  // Tokens per row; a longer row is TURBO_E_CAPACITY naming
  // context_limit.
  uint32 context_limit = 6;

  // Rows per run; a larger batch is TURBO_E_CAPACITY naming
  // batch_limit.
  uint32 batch_limit = 7;

  // The limits an extraction schema may carry, the schema-extract
  // crate's Limits (docs/schema-extract.md); present only for a bundle
  // whose task reads a schema. No bundle the server loads today has
  // such a task, so this is unset until the server loads one.
  SchemaLimits schema = 8;
}

// The limits an extraction schema may carry, the schema-extract crate's
// Limits. A schema over a limit is TURBO_E_CAPACITY naming that limit.
message SchemaLimits
{
  // Never filled by any release; replaced by the crate's own limits.
  reserved 2, 3, 4;
  reserved "max_label_sets", "max_fields", "max_depth";

  uint32 max_entity_types = 1;
  uint32 max_classification_tasks = 5;
  uint32 max_labels_per_task = 6;
  uint32 max_structures = 7;
  uint32 max_fields_per_structure = 8;
  // The longest name, description or choice, in bytes.
  uint32 max_text_bytes = 9;
  // The subwords the schema prompt may take of the encoder's input.
  uint32 max_prompt_subwords = 10;
  // The words of text read in one encoder window.
  uint32 max_words = 11;
}

// What one result message may carry, refused with TURBO_E_CAPACITY
// naming the limit.
message ResultLimits
{
  uint64 max_sparse_entries = 1;
  uint64 max_sparse_occurrences = 2;
  uint64 max_token_vector_bytes = 3;
  uint64 max_rerank_items = 4;
  uint64 max_answers = 5;
  uint64 max_answer_fragments = 6;
  uint64 max_windows = 7;
  uint64 max_chunks = 8;
  uint64 max_levels = 9;
  uint64 max_fragments = 10;
  uint64 max_graph_bytes = 11;
  uint64 max_record_values = 12;
}

message LoadBundleRequest
{
  // The served name; empty is the bundle path's last component.
  string name = 1;

  // The bundle directory (docs/bundle.md).
  string bundle = 2;

  // A runtime device index (docs/grpc.md, Device indices).
  uint32 device = 3;

  // Sessions the model pools; at least 1.
  uint32 sessions = 4;

  // TURBO_PRECISION_*; 0 is the model's.
  uint32 precision = 5;

  // The sessions' batch and sequence limits; 0 is the model's.
  uint32 max_batch = 6;
  uint32 max_seq = 7;

  // Select a device with turbo_runtime_select for the bundle's task
  // instead of indexing `device` (must leave `device` at 0).
  bool select_device = 11;
}

message LoadBundleResponse
{
  BundleCapabilities capabilities = 1;
}

message UnloadBundleRequest
{
  string name = 1;
}

message UnloadBundleResponse {}

// Which model produced a result, by the bundle's own identity: the
// manifest's model id and revision, and the manifest's sha256, the
// contract the load was made against.
message ModelRef
{
  string id = 1;
  string revision = 2;
  string sha256 = 3;
}

// The learned sparse terms of one document or of each unit of a level
// (#708): the turbo-analysis-layers SparseTerms layer's columns. One
// entry per (unit, term); unit i's entries are
// row[i]..row[i + 1] in ascending term id, each with its learned
// weight, its source span where the term came from the input, and its
// occurrence spans where the producer recorded them.
message SparseTermsResult
{
  ModelRef model = 1;

  // One start per unit and one past the last entry: units + 1 values,
  // the first 0, non-decreasing.
  repeated uint32 row = 2;

  // The model vocabulary id per entry, ascending within each unit.
  repeated uint32 term = 3;

  // The learned weight per entry: finite and over 0.
  repeated float weight = 4;

  // One entry per term: false marks an expanded term the model added,
  // which carries no span. All three columns are empty, or all three
  // hold one value per entry.
  repeated bool has_span = 5;
  repeated uint32 span_start = 6;
  repeated uint32 span_end = 7;

  // The occurrence spans of every entry that records them, entry order
  // within each unit: entry e's are
  // occ_at[e - 1]..occ_at[e] (0..occ_at[0] for the first). Empty when
  // the result records none; then occ_at is empty too.
  repeated uint32 occ_start = 8;
  repeated uint32 occ_end = 9;
  repeated uint32 occ_at = 10;

  // The view text the spans are offsets into; when empty in
  // OFFSET_MODE_UTF8, spans are carried as raw UTF-8 byte offsets.
  string text = 11;
  OffsetMode offsets = 12;
}

// One contextual vector per model token with the spans of the encoder
// windows that produced them (#709): the turbo-analysis-layers
// Vectors<Subwords> and TokenVectorWindows layers. Each row ties to its
// piece's source text through the windows; a row the producer could
// make no vector for (whitespace alone, say) is zeros and listed in
// empty.
message TokenVectorsResult
{
  ModelRef model = 1;

  // Values per row; over 0.
  uint32 dim = 2;

  // rows x dim little-endian f32, row-major, as raw_output_contents
  // carries vectors; rows is data bytes / (4 x dim).
  bytes data = 3;

  // The rows with no vector, ascending, each once; their rows are
  // zeros.
  repeated uint32 empty = 4;

  // The text view the windows are offsets into; 0 is the source text.
  // Offsets of another view read against the wrong text without it.
  uint32 view = 7;

  // The encoder windows, in text order, non-overlapping and
  // continuous: token i's vector is taken from the window holding its
  // piece.
  repeated uint32 window_start = 5;
  repeated uint32 window_end = 6;

  // The view text the windows are offsets into; when empty in
  // OFFSET_MODE_UTF8, windows are carried as raw UTF-8 byte offsets.
  string text = 8;
  OffsetMode offsets = 9;
}

// The relevance order of a shortlist (#707): the turbo-analysis-embed
// Reranked layer with document-local indices and keys made plain.
// Scores are descending, one finite score per item, and the model
// identity rides along, not a bare float.
message RerankScoresResult
{
  ModelRef model = 1;

  // The layer the items index, its full name (turbo:chunks, say).
  string source = 2;

  // The source layer instance the items index: a Key's instance name,
  // empty for the default instance. Two instances of one layer (a gold
  // shortlist beside a predicted one) index different items under one
  // type, so the name rides with the layer name.
  string source_instance = 5;

  // The source layer's items, a vocabulary index per entry, in
  // relevance order, each once.
  repeated uint32 item = 3;

  // The relevance score per item: finite, descending.
  repeated float score = 4;
}

// The ranked answers of an extraction or question-answering run: the
// turbo-analysis-embed Answers layer (extractive QA, #745) plus the
// model identity. Schema-driven structured records travel as
// RecordsResult. An empty
// result is a calibrated abstention: null_probability is 1.
message ExtractionResult
{
  ModelRef model = 1;

  // The text view the spans are offsets into; 0 is the source text.
  uint32 view = 2;

  // One answer per entry, in rank order, as byte offsets [start, end)
  // into the view: the bounding envelope of a discontinuous answer
  // (first fragment's start to last fragment's end).
  repeated uint32 span_start = 3;
  repeated uint32 span_end = 4;

  // The score and normalized probability per answer.
  repeated double score = 5;
  repeated double probability = 6;

  // The abstention score and its probability; the probabilities and
  // null_probability sum to 1.
  double null_score = 7;
  double null_probability = 8;

  // The fragments of answers made of separated pieces, flat by column
  // in answer order: answer a's fragments are
  // frag_at[a - 1]..frag_at[a] (0..frag_at[0] for the first). Empty
  // when every answer is one continuous piece; the envelope columns
  // then say it all. Without these, the gap inside a discontinuous
  // answer would decode as answer text.
  repeated uint32 frag_start = 9;
  repeated uint32 frag_end = 10;
  repeated uint32 frag_at = 11;

  // The view text the spans are offsets into; when empty in
  // OFFSET_MODE_UTF8, spans are carried as raw UTF-8 byte offsets.
  string text = 12;
  OffsetMode offsets = 13;
}

// The structured records of a schema extraction (the schema-extract
// crate's turbo:records layer) plus the model identity, over one view's
// text, with every span offset in the message's OffsetMode. A record is
// one instance of a record type; its values are spans of the text, each
// under a field path ("invoice.total"), or closed choices with no span.
// Decoding re-proves the layer's own check: every value names a record
// and a path of that record's type, every record has a value, scores are
// in [0, 1] and logits finite.
message RecordsResult
{
  ModelRef model = 1;

  // The view text the spans are offsets into.
  string text = 2;
  uint32 view = 3;
  OffsetMode offsets = 4;

  // The label sets the tags below index: record types, every
  // record.field path, and every closed choice, each with its set name.
  string types_name = 5;
  repeated string types = 6;
  string paths_name = 7;
  repeated string paths = 8;
  string choices_name = 9;
  repeated string choices = 10;

  // Per record: its type (an index into types) and the model's
  // instance index.
  repeated uint32 record_type = 11;
  repeated uint32 record_instance = 12;

  // Per span value: its fragments, flat by column in value order (value
  // v's fragments are value_frag_at[v - 1]..value_frag_at[v], from 0 for
  // the first), its record, its path (an index into paths), probability
  // and logit.
  repeated uint32 value_frag_start = 13;
  repeated uint32 value_frag_end = 14;
  repeated uint32 value_frag_at = 15;
  repeated uint32 value_record = 16;
  repeated uint32 value_path = 17;
  repeated double value_score = 18;
  repeated double value_logit = 19;

  // The deterministic rows corroborating each span value: value v's are
  // support_end[v - 1]..support_end[v]. A source is 0 glossary, 1 PII,
  // 2 numbers, 3 locations; the row indexes that source layer's instance
  // in the producing document.
  repeated uint32 support_end = 20;
  repeated uint32 support_source = 21;
  repeated uint32 support_row = 22;

  // Per closed-choice value: its record, path, choice (an index into
  // choices), probability and logit.
  repeated uint32 choice_record = 23;
  repeated uint32 choice_path = 24;
  repeated uint32 choice = 25;
  repeated double choice_score = 26;
  repeated double choice_logit = 27;
}

// What the streaming bulk analysis call accepts and answers (issue
// #722). One stream carries one header followed by any number of
// documents; each document answers exactly once, in the header's order
// or as it completes, tagged with its correlation id.

// Which order response items leave the stream in.
enum AnalyzeOrder
{
  // The order the documents were sent in; the default.
  ANALYZE_ORDER_INPUT = 0;

  // The order the documents finish in.
  ANALYZE_ORDER_COMPLETION = 1;
}

// One stream message: the header first, then documents.
message AnalyzeStreamRequest
{
  oneof kind
  {
    // The first message of the stream must be the header; a header
    // anywhere else is TURBO_E_INVALID_ARGUMENT and ends the stream.
    AnalyzeStreamHeader header = 1;

    // One document to analyze.
    AnalyzeDocument document = 2;
  }
}

// The stream's opening message: the ordering and the client side of the
// flow control. Every knob is capped by ServerLimits.stream, which the
// capability listing advertises; a larger one is TURBO_E_INVALID_ARGUMENT
// naming the limit.
message AnalyzeStreamHeader
{
  // The order response items leave the stream in.
  AnalyzeOrder order = 1;

  // How many documents may be executing or awaiting their answer at
  // once, this client's own bound; 0 is the server's default
  // max_inflight_items_per_stream.
  uint32 max_inflight = 2;

  // How long documents wait on the same model so they can be batched
  // into one run, in milliseconds; 0 is the server's default
  // default_batch_linger_ms.
  uint32 batch_linger_ms = 3;
}

// What kind of analysis output one document in AnalyzeStream asks for.
enum AnalyzeOutput
{
  // Pooled document embedding (AnalyzeVectors).
  ANALYZE_OUTPUT_VECTORS = 0;

  // Learned sparse lexical expansion (SparseTermsResult, #708 / #917).
  ANALYZE_OUTPUT_SPARSE_TERMS = 1;

  // Per-token contextual vectors with encoder window spans
  // (TokenVectorsResult, #709 / #917).
  ANALYZE_OUTPUT_TOKEN_VECTORS = 2;
}

// The embed options one document asks for: the fields of
// turbo_embed_options, each 0 for the model's default, exactly what the
// single-document call's parameters carry, plus optional sparse-term and
// token-vector knobs. Documents batch together only with documents of the
// same model, output kind, offset mode, and options.
message AnalyzeOptions
{
  // TURBO_TRUNCATE_*.
  uint32 truncate = 1;

  // Tokens per row; 0 is the model's max_seq.
  uint32 max_tokens = 2;

  // TURBO_PROMPT_*.
  uint32 prompt_role = 3;

  // TURBO_NORMALIZE_*.
  uint32 normalize = 4;

  // TURBO_POOLING_*.
  uint32 pooling = 5;

  // One of the widths the capability listing names; 0 is the model's dim.
  uint32 output_dim = 6;

  // Maximum number of non-zero sparse terms kept per document for
  // ANALYZE_OUTPUT_SPARSE_TERMS; 0 keeps all non-zero terms.
  uint32 sparse_top_k = 7;

  // Minimum weight threshold for ANALYZE_OUTPUT_SPARSE_TERMS; terms with
  // weight <= sparse_floor are dropped (must be finite and >= 0).
  float sparse_floor = 8;

  // Sliding-window stride in subword pieces for
  // ANALYZE_OUTPUT_TOKEN_VECTORS; 0 uses half the window width.
  uint32 token_stride = 9;
}

// One document to analyze: its client correlation id, the served model's
// name, the text, and the options.
message AnalyzeDocument
{
  // The client's correlation id; non-empty, carried back on the answer.
  string id = 1;

  // The served model's name, as the capability listing names it.
  string model = 2;

  // The document's text; empty is a document.
  bytes text = 3;

  // What to compute; absent is every model default.
  AnalyzeOptions options = 4;

  // Which result kind to compute; 0 is ANALYZE_OUTPUT_VECTORS.
  AnalyzeOutput output = 5;

  // Wire unit for span offsets on SparseTermsResult and
  // TokenVectorsResult; 0 is OFFSET_MODE_UTF8.
  OffsetMode offsets = 6;
}

// One document's answer, tagged with its correlation id: its vectors,
// sparse terms, token vectors, or failure. A failed document never ends
// the stream.
message AnalyzeStreamResponse
{
  // The document's correlation id.
  string id = 1;

  oneof outcome
  {
    // The document's vectors.
    AnalyzeVectors vectors = 2;

    // Why this document failed.
    AnalyzeFailure failure = 3;

    // The document's learned sparse terms (#917).
    SparseTermsResult sparse_terms = 4;

    // The document's per-token contextual vectors and windows (#917).
    TokenVectorsResult token_vectors = 5;
  }
}

// The vectors of one document: the model identity and the row the
// single-document call's raw_output_contents carries for the same text
// and options, one row of little-endian f32, dim values.
message AnalyzeVectors
{
  // The served model's name.
  string model = 1;

  // The bundle's revision.
  string version = 2;

  // Values per row; over 0.
  uint32 dim = 3;

  // dim x 4 little-endian f32, row-major: exactly the row the
  // single-document call answers with.
  bytes data = 4;
}

// Why one document failed: the turbo status the refusal carries, as the
// single-document call's status would carry it, so a client routes it
// the same way. The stream continues past it.
message AnalyzeFailure
{
  // The turbo status code, TURBO_E_* as decimal.
  int32 turbo_code = 1;

  // turbo_error.field, when the failure names a field.
  uint32 field = 2;

  // The refusal, named the way the layer refuses a malformed column.
  string message = 3;
}

// What the streaming bulk analysis call may queue, per stream and
// server-wide: the caps its flow control holds queued work to, so a fast
// client cannot grow the server's memory without limit. A send past them
// is held by backpressure until the queue drains, never a mid-stream
// error.
message StreamLimits
{
  // Documents a stream may have queued, not yet executing.
  uint64 max_queued_items_per_stream = 1;

  // Document bytes a stream may have queued.
  uint64 max_queued_bytes_per_stream = 2;

  // Documents all streams may have queued in all.
  uint64 max_queued_items_server = 3;

  // Document bytes all streams may have queued in all.
  uint64 max_queued_bytes_server = 4;

  // Documents a stream may have executing or awaiting their answer at
  // once; the most its max_inflight may ask for.
  uint64 max_inflight_items_per_stream = 5;

  // The wait that gathers one model's documents into a batch, in
  // milliseconds, when the header does not say.
  uint64 default_batch_linger_ms = 6;

  // The most a header's batch_linger_ms may ask for.
  uint64 max_batch_linger_ms = 7;
}

// The unit every span offset in a message is counted in. UTF-8 bytes
// are the internal offsets; UTF-16 code units are Java's string
// indices; code points count Unicode scalar values. Conversion uses
// the view text's checkpoint table and refuses offsets that are out
// of bounds, inverted, or inside a code point or UTF-16 surrogate
// pair, with TURBO_E_INVALID_ARGUMENT: nothing is snapped or cut.
enum OffsetMode
{
  OFFSET_MODE_UTF8 = 0;
  OFFSET_MODE_UTF16 = 1;
  OFFSET_MODE_CODE_POINT = 2;
}

// What became of one layer or view on its document.
enum LayerWireStatus
{
  LAYER_WIRE_STATUS_OK = 0;
  LAYER_WIRE_STATUS_SKIPPED = 1;
  LAYER_WIRE_STATUS_FAILED = 2;
}

// One layer instance of a document graph: its standard layer id
// (opennlp:* or turbo:*), instance, status and provenance.
message LayerInfo
{
  string layer = 1;
  string instance = 2;
  LayerWireStatus status = 3;
  // Why the layer was skipped, or its failure; empty when OK.
  string status_detail = 4;
  string annotator = 5;
  string version = 6;
  ModelRef model = 7;
  uint64 config_hash = 8;
  uint32 items = 9;
}

// One text view of a document graph.
message ViewInfo
{
  string instance = 1;
  LayerWireStatus status = 2;
  string status_detail = 3;
  string annotator = 4;
  // The parent view's instance; empty for the source view.
  string parent = 5;
}

// A whole document as binary DocumentGraph bytes (turbo-analysis
// export). The answer is the same document imported and re-exported,
// with its layers and views listed.
message DocumentGraphRequest
{
  bytes graph = 1;
}

message DocumentGraphResponse
{
  bytes graph = 1;
  repeated LayerInfo layers = 2;
  repeated ViewInfo views = 3;
  string source_text = 4;
}

// turbo:chunks, turbo:levels and opennlp:embeddings (over the chunks)
// in one message, over one view's text. Every span offset is counted
// in `offsets`. Spans are fragment columns in item order: item i's
// fragments are frag_at[i - 1]..frag_at[i] (0..frag_at[0] first), at
// least one per item, ascending and non-overlapping, as the layers'
// own checks prove them.
message ChunkLevelsResult
{
  // The view text the spans are offsets into.
  string text = 1;
  uint32 view = 2;
  OffsetMode offsets = 3;

  // Chunks: one entry per column per chunk.
  repeated uint32 chunk_frag_start = 4;
  repeated uint32 chunk_frag_end = 5;
  repeated uint32 chunk_frag_at = 6;
  repeated uint32 chunk_level = 7;
  // The parent chunk index, or -1 for a level-0 chunk.
  repeated int32 chunk_parent = 8;
  repeated uint32 chunk_sentence_start = 9;
  repeated uint32 chunk_sentence_end = 10;
  // The cut reason tag of the DocumentGraph layer codec (0 document,
  // 1 sentence, 2 section, 3 heading, 4 paragraph, 5 topic, 6 clause,
  // 7 item, 8 inside a block, 9 overlap into a block); chunk_cut_block
  // names the block (its codec table index) for tags 8 and 9, else 0.
  repeated uint32 chunk_cut = 11;
  repeated uint32 chunk_cut_block = 12;
  repeated int64 chunk_cost = 13;
  repeated uint32 chunk_model_tokens = 24;
  repeated bool chunk_over_budget = 25;

  // Levels: the chunk/section/document tree over the same view.
  repeated uint32 level_frag_start = 14;
  repeated uint32 level_frag_end = 15;
  repeated uint32 level_frag_at = 16;
  // 0 chunk, 1 section, 2 document.
  repeated uint32 level_kind = 17;
  // The chunk or structure index the unit names; 0 for the document.
  repeated uint32 level_ix = 18;
  // The parent unit index, or -1 for the document unit.
  repeated int32 level_parent = 19;

  // Embeddings: one row per chunk.
  ModelRef model = 20;
  uint32 dim = 21;
  bytes data = 22;
  repeated uint32 empty = 23;
}

// Request for AnalyzeDocumentProgressive (issue #1218).
message AnalyzePipelineRequest
{
  // Client document identifier, echoed in AnalysisStarted.
  string doc_id = 1;

  // Input UTF-8 text to analyze (used when source_bytes and initial_graph
  // are empty).
  string text = 2;

  // Raw UTF-8 source bytes to analyze (used when non-empty and
  // initial_graph is empty).
  bytes source_bytes = 3;

  // Wire offset unit for spans and metadata; 0 is OFFSET_MODE_UTF8.
  OffsetMode offsets = 4;

  // Named pipeline profile ("default", "minimal", "chunking"); empty uses
  // "default".
  string profile = 5;

  // Explicit list of step IDs to run in the Analyzer DAG; when non-empty,
  // overrides profile.
  repeated string steps = 6;

  // Optional served bundle name for model-backed steps.
  string model = 7;

  // Optional pre-existing DocumentGraph bytes to seed the Document before
  // running the pipeline.
  bytes initial_graph = 8;
}

// One server-streamed event from AnalyzeDocumentProgressive, numbered with
// a strictly increasing 1-based sequence.
message AnalyzeProgressiveEvent
{
  uint64 sequence = 1;

  oneof event
  {
    AnalysisStarted started = 2;
    AnalysisLayerBatch layers_ready = 3;
    AnalysisStepFailure step_failed = 4;
    DocumentGraphResponse complete = 5;
  }
}

// Emitted first (sequence = 1) once the Analyzer DAG is built and ready.
message AnalysisStarted
{
  string doc_id = 1;
  OffsetMode offsets = 2;
  repeated string step_ids = 3;
  repeated ViewInfo views = 4;
}

// Emitted as soon as an individual DAG step completes successfully.
message AnalysisLayerBatch
{
  string completed_step = 1;
  uint32 stage = 2;
  uint64 duration_us = 3;
  repeated LayerInfo layers = 4;
  repeated ViewInfo views = 5;
  bytes graph = 6;
}

// Emitted when a step fails on the document, naming the step, its
// structured AnalyzeFailure, and any downstream steps whose required
// inputs were skipped as a consequence.
message AnalysisStepFailure
{
  string step_id = 1;
  uint32 stage = 2;
  uint64 duration_us = 3;
  AnalyzeFailure failure = 4;
  repeated string skipped_dependents = 5;
  repeated LayerInfo layers = 6;
}

// ============================================================================
// Issue #1220: InspectDocumentWindow, ProjectChunks, ListOutputFormats,
// and FormatDocument RPC messages.
// ============================================================================

message DocumentWindowRequest
{
  // Binary DocumentGraph bytes.
  bytes graph = 1;

  // Target text view id (0 is the source view).
  uint32 view = 2;

  // Wire offset unit for all spans in the response.
  OffsetMode offsets = 3;

  // Page size in UTF-8 bytes (0 defaults to 16000 bytes).
  uint32 page_size = 4;

  // Zero-based page index into the view.
  uint32 page = 5;

  // Optional allow-list of layer ids (e.g. "opennlp:entities",
  // "turbo:chunks"); empty includes all positional layers on the view.
  repeated string filter_layers = 6;

  // Number of minimap buckets for heatmap lanes (0 uses exact segment
  // mode; > 0 bins into equal-width buckets).
  uint32 heatmap_buckets = 7;

  // When set, computes NormalizationXray diff runs from `view` to
  // `xray_target_view`.
  optional uint32 xray_target_view = 8;
}

message DocumentShapeSummaryProto
{
  uint32 view = 1;
  uint32 total_bytes = 2;
  uint32 total_units = 3;
  uint32 view_count = 4;
  uint32 layer_count = 5;
  repeated LayerInfo layers = 6;
  repeated ViewInfo views = 7;
}

message DocumentWindowProto
{
  uint32 view = 1;
  uint32 byte_start = 2;
  uint32 byte_end = 3;
  uint32 start = 4;
  uint32 end = 5;
  uint32 page = 6;
  uint32 page_count = 7;
  bool clamped = 8;
  string text = 9;
}

message SegmentAnnotationProto
{
  string layer = 1;
  string instance = 2;
  uint32 item = 3;
  string label = 4;
  double score = 5;
}

message CombinedSegmentProto
{
  uint32 start = 1;
  uint32 end = 2;
  string text = 3;
  repeated SegmentAnnotationProto annotations = 4;
}

message DocumentChipProto
{
  string layer = 1;
  string instance = 2;
  string label = 3;
  double score = 4;
}

message HeatmapBucketProto
{
  // Half-open range in the request's OffsetMode, relative to the whole view.
  // Minimap boundaries are snapped down to UTF-8 character boundaries before
  // conversion. These display coordinates may collapse even a covered raw
  // bin. Exact coverage coordinates remain in byte_start/byte_end below.
  uint32 start = 1;
  uint32 end = 2;
  // Token/Entity/PiiDensity count distinct source items. Scored lanes use the
  // signed score with greatest absolute magnitude, ties to lowest item index.
  // Coverage is over the raw byte bin, before display-coordinate snapping.
  // An uncovered raw bin has score 0; scores are not length-weighted averages.
  float score = 3;
  // Distinct layer items overlapping the bucket, not fragment count. Multiple
  // fragments of one item contribute once. Exact mode includes uncovered
  // ranges; minimap mode retains every requested raw bin, including empty bins.
  uint32 count = 4;
  // Index in this lane's source layer, absent when count is 0. Density lanes
  // use the lowest overlapping item index; scored lanes use the
  // item supplying score. This is a representative, not the count or a span.
  optional uint32 primary_item = 5;
  // Exact shared-library coverage bounds in source-view UTF-8 bytes,
  // independent of the requested OffsetMode. Minimap bins can split scalars,
  // including empty bins inside a scalar; these bounds are not text slices.
  uint32 byte_start = 6;
  uint32 byte_end = 7;
}

message HeatmapLaneProto
{
  string id = 1;
  string kind = 2;
  uint32 view = 3;
  float min_score = 4;
  float max_score = 5;
  repeated HeatmapBucketProto buckets = 6;
}

enum XrayEditKindProto
{
  XRAY_EDIT_KIND_PROTO_EQUAL = 0;
  XRAY_EDIT_KIND_PROTO_REPLACED = 1;
  XRAY_EDIT_KIND_PROTO_INSERTED = 2;
  XRAY_EDIT_KIND_PROTO_DELETED = 3;
}

message XrayEditRunProto
{
  uint32 parent_start = 1;
  uint32 parent_end = 2;
  uint32 child_start = 3;
  uint32 child_end = 4;
  XrayEditKindProto kind = 5;
  string parent_text = 6;
  string child_text = 7;
}

message XrayStepSummaryProto
{
  uint32 view = 1;
  optional uint32 parent_view = 2;
  string instance = 3;
  string annotator = 4;
  string version = 5;
  uint64 config_hash = 6;
  uint32 edit_count = 7;
  uint32 parent_bytes = 8;
  uint32 child_bytes = 9;
}

message NormalizationXrayProto
{
  uint32 from_view = 1;
  uint32 to_view = 2;
  OffsetMode offsets = 3;
  repeated XrayEditRunProto runs = 4;
  repeated XrayStepSummaryProto steps = 5;
}

message DocumentWindowResponse
{
  DocumentShapeSummaryProto summary = 1;
  DocumentWindowProto window = 2;
  repeated CombinedSegmentProto segments = 3;
  repeated DocumentChipProto document_chips = 4;
  repeated HeatmapLaneProto heatmap_lanes = 5;
  optional NormalizationXrayProto xray = 6;
}

message BudgetSpec
{
  string name = 1;
  uint32 max_tokens = 2;
  uint32 target_tokens = 3;
  uint32 size_weight = 4;
  uint32 overhead = 5;
}

message ProjectChunksRequest
{
  // Projection joins the default layer instances. Aligned columns bound to a
  // different instance are refused with TURBO_E_INVALID_ARGUMENT instead of
  // attaching their rows to unrelated default spans.
  bytes graph = 1;
  OffsetMode offsets = 2;
  // Number of principal components: 2 or 3 (0 defaults to 2).
  uint32 pca_dims = 3;
  // Maximum top-K term segments per TermVectorStack (0 defaults to 10).
  uint32 max_stack_segments = 4;
  bool include_drift_curve = 5;
  bool include_strategy_matrix = 6;
  repeated BudgetSpec strategy_budgets = 7;
}

message ProjectedPointProto
{
  uint32 item = 1;
  uint32 start = 2;
  uint32 end = 3;
  uint32 level = 4;
  float x = 5;
  float y = 6;
  float z = 7;
  bool empty = 8;
  optional float adjacent_cosine = 9;
}

message VectorProjectionProto
{
  ModelRef model = 1;
  uint32 pca_dims = 2;
  repeated float explained_variance = 3;
  repeated ProjectedPointProto points = 4;
}

message DriftGapPointProto
{
  uint32 sentence = 1;
  uint32 gap_offset = 2;
  optional int64 raw_cosine_micro = 3;
  optional int64 smoothed_cosine_micro = 4;
  int64 depth_score_micro = 5;
  int32 cost = 6;
  uint32 reason = 7;
  bool is_chunk_cut = 8;
}

message BoundaryDriftCurveProto
{
  uint32 window = 1;
  uint32 smoothing = 2;
  repeated DriftGapPointProto gaps = 3;
}

message TermWeightSegmentProto
{
  string term = 1;
  uint32 term_id = 2;
  uint32 frequency = 3;
  float weight = 4;
  float share = 5;
  bool is_expanded = 6;
  repeated uint32 occ_start = 7;
  repeated uint32 occ_end = 8;
}

message TermVectorStackProto
{
  uint32 unit = 1;
  repeated TermWeightSegmentProto segments = 2;
  uint32 total_terms = 3;
  uint64 total_frequency = 4;
  float total_weight = 5;
  uint32 other_term_count = 6;
  uint64 other_frequency = 7;
  float other_weight = 8;
}

message StrategyComparisonEntryProto
{
  string name = 1;
  BudgetSpec budget = 2;
  uint32 chunk_count = 3;
  uint32 over_budget_count = 4;
  int64 total_cost = 5;
  uint32 matched_cuts_with_baseline = 6;
  uint32 disagreements_with_baseline = 7;
  repeated uint32 cut_starts = 8;
}

message StrategyMatrixProto
{
  repeated StrategyComparisonEntryProto strategies = 1;
}

message ProjectChunksResponse
{
  VectorProjectionProto projection = 1;
  optional BoundaryDriftCurveProto drift_curve = 2;
  repeated TermVectorStackProto chunk_term_stacks = 3;
  optional TermVectorStackProto document_term_stack = 4;
  optional StrategyMatrixProto strategy_matrix = 5;
}

message ListOutputFormatsRequest {}

message OutputFormatDescriptorProto
{
  string format_id = 1;
  string display_name = 2;
  string media_type = 3;
  string file_extension = 4;
  bool binary = 5;
  bool lossless = 6;
  repeated string required_layers = 7;
  string description = 8;
}

message ListOutputFormatsResponse
{
  repeated OutputFormatDescriptorProto formats = 1;
}

message FormatDocumentRequest
{
  string doc_id = 1;
  bytes graph = 2;
  string format_id = 3;
  OffsetMode offsets = 4;
}

message FormatDocumentResponse
{
  string format_id = 1;
  string media_type = 2;
  string file_extension = 3;
  bytes content = 4;
}
