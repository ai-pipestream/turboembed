// Calibrated Cross-Encoder Reranking and Source-Projected Semantic Highlight
// Span Attribution (#2342): pairs TURBO_TASK_RERANK micro-batches with
// turbo-calibration [0, 1] relevance probabilities and top-K sentence/sub-span
// highlights in original source coordinates (UTF-8, UTF-16, or code points).
//
// SPDX-License-Identifier: Apache-2.0

syntax = "proto3";
package turbo.result.v1;

import "turbo_typed_annotations.proto";

enum RerankHighlightMode
{
  RERANK_HIGHLIGHT_MODE_AUTO = 0;
  RERANK_HIGHLIGHT_MODE_SUBWORD_MAXSIM = 1;
  RERANK_HIGHLIGHT_MODE_RANGE_POOL = 2;
  RERANK_HIGHLIGHT_MODE_EXTRACTIVE_QA = 3;
  RERANK_HIGHLIGHT_MODE_NONE = 4;
}

message RerankPlattSpecProto
{
  double slope = 1;
  double intercept = 2;
}

message RerankIsotonicSpecProto
{
  repeated double upper = 1;
  repeated double value = 2;
}

message RerankCalibrationSpecProto
{
  oneof kind
  {
    double temperature = 1;
    RerankPlattSpecProto platt = 2;
    RerankIsotonicSpecProto isotonic = 3;
    bytes tcal_artifact = 4;
  }
  string domain = 5;
  uint64 inference_hash = 6;
}

message RerankCandidateInputProto
{
  string doc_id = 1;
  string text = 2;
  // Optional chunk offset within a parent document (in the request's OffsetMode)
  // so returned parent_span_start/parent_span_end compose directly.
  uint64 parent_offset = 3;
  // Optional pre-segmented sentence spans in the request's OffsetMode.
  repeated uint32 sentence_span_start = 4;
  repeated uint32 sentence_span_end = 5;
}

message RerankAndHighlightRequest
{
  string query = 1;
  string rerank_model = 2;
  // Optional TASK_EMBED model for pooled range or contextual MaxSim highlights.
  string embed_model = 3;
  // Optional TASK_EXTRACTIVE_QA model for extractive QA span highlights.
  string qa_model = 4;
  repeated RerankCandidateInputProto candidates = 5;
  OffsetMode offsets = 6;
  RerankCalibrationSpecProto calibration = 7;
  RerankHighlightMode highlight_mode = 8;
  // Top-K reranked candidates to attribute semantic highlight spans for (default 10).
  uint32 highlight_top_k = 9;
  // Maximum non-overlapping highlight spans per candidate (default 2).
  uint32 max_snippets_per_candidate = 10;
  string language = 11;
  uint32 query_tokens = 12;
  uint32 max_tokens = 13;
  uint32 stride = 14;
  uint32 max_answer_tokens = 15;
  optional double qa_null_threshold = 16;
}

message SemanticHighlightSpanProto
{
  uint32 span_start = 1;
  uint32 span_end = 2;
  uint64 parent_span_start = 3;
  uint64 parent_span_end = 4;
  double score = 5;
  string surface = 6;
}

message RerankedCandidateProto
{
  uint32 input_index = 1;
  string doc_id = 2;
  float raw_logit = 3;
  double calibrated_probability = 4;
  optional double conformal_p_value = 5;
  repeated SemanticHighlightSpanProto highlights = 6;
  bool qa_abstained = 7;
  optional double qa_null_probability = 8;
}

message RerankAndHighlightResponse
{
  string query = 1;
  ModelRef rerank_model = 2;
  optional ModelRef highlight_model = 3;
  OffsetMode offsets = 4;
  repeated RerankedCandidateProto results = 5;
}
