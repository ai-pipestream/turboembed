[package]
name = "turbo-kserve"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "turbo_kserve"
path = "src/lib.rs"

[[bin]]
name = "turbo-kserve"
path = "src/main.rs"

[dependencies]
turbo = { path = "../core" }
# The analysis result kinds the wire messages carry, and their layer
# invariants, which the message validation re-proves.
turbo-analysis = { path = "../analysis/core" }
turbo-analysis-layers = { path = "../analysis/layers" }
turbo-analysis-embed = { path = "../analysis/embed" }
turbo-abbrev = { path = "../analysis/abbrev" }
turbo-chunker = { path = "../analysis/chunker" }
turbo-coref = { path = "../analysis/coref" }
turbo-encoding-layers = { path = "../analysis/encoding-layers" }
turbo-entity-linker = { path = "../analysis/entity-linker" }
turbo-geo = { path = "../analysis/geo" }
turbo-gliner = { path = "../analysis/gliner" }
turbo-glossary-layers = { path = "../analysis/glossary-layers" }
turbo-group = { path = "../analysis/group" }
turbo-keywords = { path = "../analysis/keywords" }
turbo-normalize-layers = { path = "../analysis/normalize-layers" }
turbo-relation = { path = "../analysis/relation" }
# The structured records of a schema extraction and the limits its
# schemas are held to.
turbo-schema-extract = { path = "../analysis/schema-extract" }
turbo-sentdetect = { path = "../analysis/sentdetect" }
turbo-stem = { path = "../analysis/stem" }
turbo-stopword = { path = "../analysis/stopword" }
turbo-stopword-layers = { path = "../analysis/stopword-layers" }
turbo-structure = { path = "../analysis/structure" }
turbo-tokenize = { path = "../analysis/tokenize" }
turbo-tokenize-layers = { path = "../analysis/tokenize-layers" }
# The vocabulary store's readers: each upload is parsed by the crate that
# owns its format, and the learner counts UAX #29 words.
turbo-glossary = { path = "../analysis/glossary" }
turbo-lemmatizer = { path = "../analysis/lemmatizer" }
turbo-maxent = { path = "../analysis/maxent" }
turbo-sequence = { path = "../analysis/sequence" }
turbo-stopword = { path = "../analysis/stopword" }
turbo-tokenize = { path = "../analysis/tokenize" }
turbo-wordnet = { path = "../analysis/wordnet" }
# The model catalog: the zoo index, licence acceptances, verified fetches.
turbo-zoo = { path = "../analysis/zoo", default-features = false }
# The response's vectors are handed to the encoder in place (Bytes::from_owner).
bytes = "1.9"
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-stream = "0.1"
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "router", "server", "channel"] }
tonic-prost = "0.14"
# Gives a message over the size limit RESOURCE_EXHAUSTED (Server::start).
tower = { version = "0.5", default-features = false, features = ["util"] }

[target.'cfg(unix)'.dependencies]
# statvfs, for the free disk check before an install.
libc = "0.2"

[build-dependencies]
# Compiles the vendored .proto without protoc.
protox = "0.9"
tonic-prost-build = { version = "0.14", default-features = false, features = ["transport"] }

[dev-dependencies]
# The tests read the bundle's manifest and reference.
serde_json = "1"
turbo-normalize = { path = "../analysis/normalize" }

[features]
default = ["catalog-http"]
# The catalog fetches its models over HTTPS (--catalog-dir). Without it the
# server builds with no TLS stack and refuses --catalog-dir.
catalog-http = ["turbo-zoo/http"]
# Each links that backend into the library the server runs; the cpu backend
# is always in. What a backend needs to build is on its page under docs/.
cuda = ["turbo/cuda"]
metal = ["turbo/metal"]
levelzero = ["turbo/levelzero"]
levelzero-onednn = ["turbo/levelzero-onednn"]
npu = ["turbo/npu"]
hailo = ["turbo/hailo"]
