[package]
name = "turbo-inferstream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Inferstream: the KServe Open Inference Protocol v2 (gRPC and REST) and OpenAI-shaped server over libturbo"
publish = false

[[bin]]
name = "inferstream"
path = "src/main.rs"

[dependencies]
turbo = { path = "../crates/turbo" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "signal", "time"] }
axum = { version = "0.8", features = ["json", "http1", "tokio"] }
tonic = { version = "0.14", features = ["server", "router", "codegen"] }
tonic-prost = "0.14"
# gRPC server reflection, so grpcurl and the KServe clients need no proto file.
tonic-reflection = "0.14"
prost = "0.14"
clap = { version = "4", features = ["derive"] }
# Already in the tree through axum and tonic; declared for the Stream trait only.
futures-core = "0.3"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
# Already in the workspace lock through tonic and axum; the tests need the
# client half of the generated service and a way to drive the router.
tonic = { version = "0.14", features = ["channel"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
