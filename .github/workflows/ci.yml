name: ci

on:
  push:
    branches: [main, turbo-v2]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  contract:
    name: Contract (Linux, mock provider)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install cbindgen
        run: cargo install cbindgen --locked
      - name: Format
        run: cargo fmt --all -- --check
      # providers/cuda needs a CUDA toolkit (nvcc); hosted runners have none,
      # so the workspace commands exclude it. It is built and tested on the
      # GPU machines named in PLAN.md section 11.
      - name: Clippy
        run: cargo clippy --locked --workspace --exclude turbo-provider-cuda --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --exclude turbo-provider-cuda
      - name: Headers are up to date
        run: scripts/gen-header.sh --check
      - name: struct_size tables are up to date
        run: scripts/gen-versioned.py --check
      - name: Mock bundle fixtures are up to date
        run: |
          cargo run -p turbo-core --example write_mock_bundles
          git diff --exit-code -- testdata/bundles
      - name: C smoke test against libturbo
        run: scripts/c-smoke.sh
      - name: Header compiles as C11 and C++17
        run: |
          printf '#include "turbo/turbo.h"\nint main(void){return 0;}\n' > /tmp/h.c
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude -c /tmp/h.c -o /dev/null
          c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -Iinclude -x c++ -c /tmp/h.c -o /dev/null
