name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets
      - name: test
        run: cargo test --workspace
      - name: header compiles as C11 and C++17 with no padding
        run: |
          echo '#include <turbo/turbo.h>' > "$RUNNER_TEMP/h.c"
          cc  -std=c11   -Wall -Wextra -Wpadded -Werror -pedantic -fsyntax-only -Iinclude "$RUNNER_TEMP/h.c"
          c++ -std=c++17 -Wall -Wextra -Wpadded -Werror -pedantic -fsyntax-only -x c++ -Iinclude "$RUNNER_TEMP/h.c"
