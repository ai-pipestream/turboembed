name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue's run on the queued pull requests stacked on main.
  merge_group:
  # The lanes skipped on pushes to main run here once a day, so main's
  # build caches, which only main saves, follow its dependencies.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

# A new push to a pull request cancels the run still going on its older
# head. On main the run going is never cancelled, but only the newest
# push waits behind it: GitHub keeps one pending run per group and
# cancels the older one, whose commit the newer run also tests. The daily
# run has a group of its own, so it never cancels a pending push run, whose
# Windows lanes and main-only steps it does not run.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'schedule-' || '' }}${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Test builds carry no debug info: linking the test binaries is most of
  # a run, and without it they link in a fraction of the time. Debug
  # assertions and overflow checks stay on.
  CARGO_PROFILE_DEV_DEBUG: "0"

# The lanes run in parallel. `check` at the end passes only when every
# lane passed, so one green check is still the whole workflow.
#
# The Linux lanes run on the GitHub-hosted runner unless the repository
# variable TURBO_CI_LINUX names the labels of self-hosted runners as JSON,
# such as ["self-hosted", "turbo-ci"]. Pull requests from forks are sent
# to the hosted runner, but a fork can edit this file: what keeps outside
# code off the self-hosted runners is the approval the repository requires
# for every outside collaborator's run (.github/runner/README.md). The
# Windows lanes are always hosted.
jobs:
  lint:
    runs-on: ${{ github.event.pull_request.head.repo.fork != true && vars.TURBO_CI_LINUX && fromJSON(vars.TURBO_CI_LINUX) || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-unknown-linux-gnu
      # Only main saves the build caches; pull requests restore them, so
      # they do not push each other's caches out of the repository's limit.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: fmt
        run: cargo fmt --all --check
      - name: header compiles as C11 and C++17 with no padding
        run: |
          printf '#include <turbo/turbo.h>\n#include <turbo/turbo_backend.h>\n' > "$RUNNER_TEMP/h.c"
          cc  -std=c11   -Wall -Wextra -Wpadded -Werror -pedantic -fsyntax-only -Iinclude "$RUNNER_TEMP/h.c"
          c++ -std=c++17 -Wall -Wextra -Wpadded -Werror -pedantic -fsyntax-only -x c++ -Iinclude "$RUNNER_TEMP/h.c"
      - name: clippy
        run: cargo clippy --workspace --all-targets
      - name: clippy (fuzz)
        run: cargo clippy -p turbo-goldens-tool --features fuzz --all-targets
      - name: bench feature configurations
        run: |
          cargo clippy --locked -p turbo-bench --all-targets -- -D warnings
          cargo clippy --locked -p turbo-bench --all-targets --features grammar -- -D warnings
          cargo clippy --locked -p turbo-bench --all-targets --features lattice -- -D warnings
          cargo clippy --locked -p turbo-bench --all-targets --features lattice,grammar,postag -- -D warnings
      - name: clippy (npu)
        run: cargo clippy -p turbo --features npu --all-targets
      - name: clippy (turboquant)
        run: cargo clippy -p turbo-vector-index --features turboquant --all-targets
      # The arm64 machines (aarch64 Linux, Apple silicon) build without
      # the x86_64 kernels. Checked only: the crates left out reach ring
      # through ureq, whose build script needs an aarch64 C compiler. The
      # server is checked without catalog-http, its one way to ureq; the
      # docling example's server client depends on it with default features.
      - name: check (aarch64)
        run: |
          cargo check --workspace --target aarch64-unknown-linux-gnu \
            --exclude turbo-bench --exclude turbo-bundle --exclude turbo-eval --exclude turbo-kserve \
            --exclude turbo-zoo --exclude turbo-train-components --exclude turbo-train-recipes \
            --exclude turbo-example-docling
          cargo check -p turbo-kserve --no-default-features --target aarch64-unknown-linux-gnu

  # Lints the versioned turbo.*.v1 proto contracts, checks pull requests
  # that touch server/proto/ for wire or file-level breaking changes against
  # main (issue #1296), and verifies that the published Java Maven and Python
  # wheel client stubs call Capabilities and AnalyzeStream against a running
  # server (issue #1297, docs/grpc.md, docs/release.md).
  proto:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.70.0
          # Authenticated, so the version lookup is not rate limited.
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: buf lint
        run: buf lint server/proto
      - name: buf breaking against main
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |
          if git diff --quiet origin/main...HEAD -- server/proto; then
            echo "server/proto unchanged from origin/main"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/base"
          git archive origin/main server/proto | tar -x -C "$RUNNER_TEMP/base"
          if [ ! -f "$RUNNER_TEMP/base/server/proto/buf.yaml" ]; then
            cp server/proto/buf.yaml "$RUNNER_TEMP/base/server/proto/buf.yaml"
            sed -i \
              -e 's/^package turbo\.\([a-z_]*\);$/package turbo.\1.v1;/' \
              -e 's/turbo\.result\.\([A-Z]\)/turbo.result.v1.\1/g' \
              "$RUNNER_TEMP"/base/server/proto/turbo_*.proto
          fi
          buf breaking server/proto --against "$RUNNER_TEMP/base/server/proto"
      # The demo page's Connect-ES code (docs/demo.md) is committed; it must
      # be what the protos generate with the pins in demo/web/package-lock.json.
      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
      - name: generated TypeScript matches server/proto
        run: bash scripts/generate-web-stubs.sh --check
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: proto-stubs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # uv provides the build Python and the oldest one the wheel declares.
      - uses: astral-sh/setup-uv@v7
      - name: package proto archive and verify Java and Python client stubs against turbo-kserve
        run: |
          cargo build --locked -p turbo-kserve
          target/debug/turbo-kserve --listen 127.0.0.1:18089 \
            --model bundle=testdata/tiny-bert-bundle,device=0,sessions=2 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for _ in $(seq 60); do
            if target/debug/turbo-kserve health --addr 127.0.0.1:18089 >/dev/null 2>&1; then
              break
            fi
            sleep 0.2
          done
          target/debug/turbo-kserve health --addr 127.0.0.1:18089
          bash scripts/package-proto-stubs.sh v0.1.0 "$RUNNER_TEMP/proto-stubs-dist" 127.0.0.1:18089
          ls -la "$RUNNER_TEMP/proto-stubs-dist"

  # turbo-bench's throughput CLI across Cargo profile settings. A job of
  # its own, not steps in lint: its record test pins counts over the
  # goldens inputs, so a pull request that adds an input fails here, and
  # in lint it showed as a red lint and skipped the lint steps after it.
  bench-throughput:
    runs-on: ${{ github.event.pull_request.head.repo.fork != true && vars.TURBO_CI_LINUX && fromJSON(vars.TURBO_CI_LINUX) || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: throughput refuses opt-level zero with assertions disabled
        env:
          CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: "false"
        run: cargo test --locked -p turbo-bench --features lattice,grammar --test throughput_build
      - name: optimized throughput accepts debug assertions
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: "1"
          CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: "true"
          TURBO_BENCH_REQUIRE_THROUGHPUT: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '0' }}
        run: cargo test --locked -p turbo-bench --features lattice,grammar --test throughput_build

  # The workspace tests other than the core's and turbo-fuzz's, the
  # crates dealt round robin by sorted name into four shards, from `cargo
  # metadata`, so a new crate joins a shard without an edit here. With the
  # fuzz job below, the shards run what `cargo test --workspace --exclude
  # turbo` ran.
  test:
    name: test (shard ${{ matrix.shard }}/4)
    # Skipped on pushes to main: the merge queue ran this lane on the very
    # commit main now points to, and direct pushes to main are refused. A
    # push that bypasses the queue is not tested by these lanes, nor by
    # fuzz and parity, until the daily run.
    if: github.event_name != 'push'
    runs-on: ${{ github.event.pull_request.head.repo.fork != true && vars.TURBO_CI_LINUX && fromJSON(vars.TURBO_CI_LINUX) || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: shard-${{ matrix.shard }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The OpenNLP models the JVM goldens were made with, downloaded from
      # downloads.apache.org and checked against their published SHA-512
      # (analysis/goldens-tool/src/recipe/models.rs). With them present, the
      # tests over them compare instead of skipping.
      - uses: actions/cache@v4
        with:
          path: .opennlp-models
          key: opennlp-models-${{ hashFiles('analysis/goldens-tool/src/recipe/**', 'analysis/goldens-tool/src/models.rs') }}
      - name: fetch the OpenNLP models
        run: cargo run -q -p turbo-goldens-tool -- fetch-models .opennlp-models
      - name: the shard's crates
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name != "turbo" and .name != "turbo-fuzz") | .name' \
            | sort \
            | awk -v n="${{ matrix.shard }}" -v k=4 '(NR - 1) % k == n - 1 { printf "-p %s ", $0 }' > "$RUNNER_TEMP/packages"
          echo "PACKAGES=$(cat "$RUNNER_TEMP/packages")" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/packages"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # nextest runs the shard's test binaries side by side, where cargo
      # test runs them one after another; it does not run doctests, so
      # those run after it.
      - name: test
        env:
          TURBO_GOLDENS_MODELS: ${{ github.workspace }}/.opennlp-models
        run: |
          cargo nextest run --no-tests=warn $PACKAGES
          cargo test --doc $PACKAGES

  # turbo-fuzz's tests run every annotator run over every corpus and
  # golden text, about 20 minutes unoptimized. Here they are built
  # optimized, with debug assertions and overflow checks kept on, in a
  # target directory of their own so the other jobs' builds are untouched.
  fuzz:
    name: test (turbo-fuzz)
    # Skipped on pushes to main, as the shards are.
    if: github.event_name != 'push'
    runs-on: ${{ github.event.pull_request.head.repo.fork != true && vars.TURBO_CI_LINUX && fromJSON(vars.TURBO_CI_LINUX) || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@v4
        with:
          path: .opennlp-models
          key: opennlp-models-${{ hashFiles('analysis/goldens-tool/src/recipe/**', 'analysis/goldens-tool/src/models.rs') }}
      - name: fetch the OpenNLP models
        run: cargo run -q -p turbo-goldens-tool -- fetch-models .opennlp-models
      - name: test
        env:
          TURBO_GOLDENS_MODELS: ${{ github.workspace }}/.opennlp-models
          CARGO_TARGET_DIR: target/fuzz
          CARGO_PROFILE_DEV_OPT_LEVEL: "2"
          CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: "true"
          CARGO_PROFILE_DEV_OVERFLOW_CHECKS: "true"
        run: cargo test -p turbo-fuzz

  features:
    runs-on: ${{ github.event.pull_request.head.repo.fork != true && vars.TURBO_CI_LINUX && fromJSON(vars.TURBO_CI_LINUX) || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@v4
        with:
          path: .opennlp-models
          key: opennlp-models-${{ hashFiles('analysis/goldens-tool/src/recipe/**', 'analysis/goldens-tool/src/models.rs') }}
      - name: fetch the OpenNLP models
        run: cargo run -q -p turbo-goldens-tool -- fetch-models .opennlp-models
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # TurboQuant storage is behind a feature that brings in turbovec.
      - name: test (turboquant)
        run: cargo test -p turbo-vector-index --features turboquant
      - name: test (fuzz command)
        env:
          TURBO_GOLDENS_MODELS: ${{ github.workspace }}/.opennlp-models
        run: cargo test -p turbo-goldens-tool --features fuzz
      # The core's own tests build it with its `internals` feature, and
      # the core is a cdylib as well, so its rlib has no hash in its name:
      # one run building both the core's tests and the crates that use the
      # core writes two different builds to target/debug/deps/libturbo.rlib,
      # and a crate compiled against the one overwritten fails to load
      # (#358). So the core's tests, and every later run that turns on
      # another core feature, build in a target directory of their own.
      # nextest runs the core's test binaries side by side; the doctests
      # run after it.
      - name: test (core)
        env:
          CARGO_TARGET_DIR: target/core
        run: |
          cargo nextest run -p turbo
          cargo test --doc -p turbo
      # Host-only. This runner is ubuntu-24.04 and has no Intel NPU.
      # The job does not pass --include-ignored and does not set
      # TURBO_TEST_REQUIRE_NPU, so the device tests in core/tests/npu.rs
      # stay ignored and a missing device is a skip. There is no
      # self-hosted NPU runner. A green job is not a device run.
      # docs/npu.md, "Host-only blocker".
      - name: test (npu)
        env:
          CARGO_TARGET_DIR: target/core
        run: cargo nextest run -p turbo --features npu
      - name: a benchmark record end to end, from the pushed commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TURBO_BENCH_REQUIRE_RECORD: "1"
        run: cargo test -p turbo-bench --test tool a_cpu_record_is_measured_and_without_a_reference_backs_nothing

  parity:
    # Skipped on pushes to main, as the shards are.
    if: github.event_name != 'push'
    runs-on: ${{ github.event.pull_request.head.repo.fork != true && vars.TURBO_CI_LINUX && fromJSON(vars.TURBO_CI_LINUX) || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@v4
        with:
          path: .opennlp-models
          key: opennlp-models-${{ hashFiles('analysis/goldens-tool/src/recipe/**', 'analysis/goldens-tool/src/models.rs') }}
      - name: fetch the OpenNLP models
        run: cargo run -q -p turbo-goldens-tool -- fetch-models .opennlp-models
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # The published UD sentence detector, tokenizer, part-of-speech and
      # lemmatizer models are trained on CC BY-SA treebanks and not checked
      # in either; the tests over them skip without them and fail here.
      # turbo-maxent evaluates the es and fr token models, and
      # turbo-sequence's beam and tag-format tests the en pos model.
      # turbo-zoo checks their bytes against its index, turbo-eval's
      # default sentence model is the English one, and turbo-train-recipes
      # gates its models against the English sentence and token models (its
      # tagger's reference, OpenNLP 1.5's en-pos-maxent, is local-only).
      # LibreOffice's Hunspell dictionaries are not checked in either
      # (de_DE_frami is GPL, hu_HU MPL or LGPL; en_US, under SCOWL's
      # permissive terms, is downloaded with them); turbo-hunspell's
      # goldens over them run here. The SMS Spam Collection (CC BY 4.0) is
      # not checked in either: fetch-models downloads it into
      # .opennlp-models/corpora by the URL and SHA-512 in the recipe, so the
      # cache above, keyed by the recipe, keeps it until its digest changes.
      # turbo-train-components trains the maxent document categorizer on it
      # here and compares the models with the JVM's byte for byte.
      - name: parity against the JVM with the published models, models required
        env:
          TURBO_GOLDENS_MODELS: ${{ github.workspace }}/.opennlp-models
          TURBO_TEST_REQUIRE_OPENNLP_MODELS: "1"
        # nextest runs the test binaries side by side, where cargo test runs
        # them one after another; the doctests run after it.
        run: |
          PACKAGES="-p turbo-maxent -p turbo-sequence -p turbo-langdetect -p turbo-langspan -p turbo-sentdetect -p turbo-tokenize -p turbo-postag -p turbo-lemmatizer -p turbo-hunspell"
          cargo nextest run $PACKAGES
          cargo test --doc $PACKAGES
          cargo nextest run -p turbo-zoo --test builtin
          cargo nextest run -p turbo-eval --lib
          cargo nextest run -p turbo-train-recipes --test recipes
          cargo nextest run -p turbo-train-components --test doccat_goldens
      # The sentence detectors against the conformance suites (Pragmatic
      # Segmenter, pySBD, UAX #29) and the rule splitter's agreement with
      # the maxent detector, with the de, en and pt sentence models. The
      # step above runs these tests too; this one names them, so that a
      # change in a pass count or an agreement number shows as its own
      # failing step. docs/segmentation.md, "RuleSentenceDetector".
      - name: sentence conformance and agreement, models required
        env:
          TURBO_GOLDENS_MODELS: ${{ github.workspace }}/.opennlp-models
          TURBO_TEST_REQUIRE_OPENNLP_MODELS: "1"
        run: cargo test -p turbo-sentdetect --test conformance --test agreement -- --nocapture
      # fetch-models also unpacks the MeCab dictionaries into the same
      # directory (IPADIC with its UTF-8 copy). The lattice tokenizer's
      # IPADIC and mecab-ko-dic golden tests, and the readings tests over
      # the same goldens, are ignored by default; here they run, and a
      # missing dictionary fails them.
      - name: lattice tokenizer parity against the JVM, dictionaries required
        env:
          TURBO_MECAB_DICTIONARIES: ${{ github.workspace }}/.opennlp-models
        run: cargo nextest run -p turbo-tokenize --test lattice_golden --test lattice_readings --run-ignored only

  # A static bundle against Model2Vec's own ids and vectors
  # (core/tests/static_parity.rs, docs/static.md). potion-base-2M, the
  # smallest potion model, is fetched at its recipe's pinned commit, and
  # turbo-bundle checks every file's SHA-256 before it uses it; the cache
  # is keyed by the recipe, so it changes only with those digests. The
  # golden image is built from bundle/model2vec-golden, whose base is
  # pinned by digest and whose packages are pinned by version and commit;
  # its layers are cached by content, so a run rebuilds it only when one of
  # those files changes. The goldens are made from the repository's
  # tokenizer texts, with no network in the container.
  static-parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@v4
        with:
          path: .potion/upstream
          key: potion-base-2M-${{ hashFiles('bundle/recipes/potion/potion-base-2M.json') }}
      - name: the potion-base-2M bundle, from its pinned files
        run: cargo run -q --release -p turbo-bundle -- make minishlab/potion-base-2M .potion/upstream .potion/bundle
      - uses: docker/setup-buildx-action@v3
      - name: the Model2Vec golden image
        uses: docker/build-push-action@v6
        with:
          context: bundle/model2vec-golden
          load: true
          tags: turbo-model2vec-golden
          cache-from: type=gha,scope=model2vec-golden
          cache-to: type=gha,scope=model2vec-golden,mode=max
      - name: Model2Vec's ids and vectors for the tokenizer texts
        run: |
          mkdir -p .potion/golden
          cp testdata/tokenizer-texts.jsonl .potion/golden/texts.jsonl
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount type=bind,src="$PWD/.potion/upstream",dst=/model,readonly \
            --mount type=bind,src="$PWD/.potion/golden",dst=/golden \
            turbo-model2vec-golden /model /golden/texts.jsonl /golden/out
      # The core's tests build in a target directory of their own (#358,
      # the features lane).
      - name: parity with Model2Vec, to the bit
        env:
          CARGO_TARGET_DIR: target/core
          TURBO_PARITY_BUNDLE: ${{ github.workspace }}/.potion/bundle
          TURBO_PARITY_GOLDEN: ${{ github.workspace }}/.potion/golden/out
        run: cargo test --release -p turbo --test static_parity -- --nocapture

  check:
    if: always()
    needs: [lint, proto, bench-throughput, test, fuzz, features, parity, static-parity, windows-lint, windows-test, windows-fuzz, windows-core]
    # Hosted: it takes seconds, and on the self-hosted runners it would
    # wait behind the queue of test jobs.
    runs-on: ubuntu-24.04
    steps:
      - name: every lane passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          # The Windows lanes are skipped on pull requests and in the merge queue.
          for r in $RESULTS; do [ "$r" = success ] || [ "$r" = skipped ] || exit 1; done

  # Windows, the host the Intel NPU machines run (#1011). The CPU backend
  # and the host-only NPU build: the CUDA, Metal, Level Zero and Hailo
  # backends need toolchains this runner does not have, and the JVM
  # parity steps above need the OpenNLP models, so their tests skip here.
  # The lanes mirror the Linux ones: lint, the workspace tests in four
  # shards, turbo-fuzz optimized, and the core with its C ABI tests.
  # Skipped in the shards: two docker runner tests (unix exit status
  # text, unix mount paths; the docker runners are Linux-only).
  # They run on pushes to main, not on pull requests or in the merge
  # queue: the hosted pool
  # runs few Windows jobs at once, and six per pull request push queued
  # every run behind them.
  windows-lint:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      # The goldens and fixtures are compared byte for byte; a checkout
      # with core.autocrlf would rewrite their line endings.
      - name: keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # One package at a time: `cargo fmt --all` passes every file to one
      # rustfmt and passes the Windows command line limit (os error 206).
      - name: fmt
        shell: bash
        run: |
          for p in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name' | tr -d '\r'); do
            cargo fmt -p "$p" --check || exit 1
          done
      - name: clippy
        run: cargo clippy --workspace --all-targets
      - name: clippy (fuzz)
        run: cargo clippy -p turbo-goldens-tool --features fuzz --all-targets
      - name: clippy (npu)
        run: cargo clippy -p turbo --features npu --all-targets
      - name: clippy (turboquant)
        run: cargo clippy -p turbo-vector-index --features turboquant --all-targets

  # The crates dealt as in the Linux shards. With windows-fuzz and
  # windows-core, the shards run what `cargo test --workspace` ran.
  windows-test:
    name: windows test (shard ${{ matrix.shard }}/4)
    if: github.event_name == 'push'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # The goldens and fixtures are compared byte for byte; a checkout
      # with core.autocrlf would rewrite their line endings.
      - name: keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-shard-${{ matrix.shard }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: the shard's crates
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name != "turbo" and .name != "turbo-fuzz") | .name' \
            | tr -d '\r' \
            | sort \
            | awk -v n="${{ matrix.shard }}" -v k=4 '(NR - 1) % k == n - 1 { printf "-p %s ", $0 }' > "$RUNNER_TEMP/packages"
          echo "PACKAGES=$(cat "$RUNNER_TEMP/packages")" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/packages"
      # --no-fail-fast: a Windows-only failure in one crate should not
      # hide another's.
      - name: test
        shell: bash
        run: >-
          cargo test $PACKAGES --no-fail-fast --
          --skip a_program_that_fails_is_a_reason_and_docker_failing_is_an_error
          --skip the_two_runs_make_one_measured_reference

  # Optimized as in the Linux fuzz job, with debug assertions and
  # overflow checks kept on.
  windows-fuzz:
    name: windows test (turbo-fuzz)
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      # The goldens and fixtures are compared byte for byte; a checkout
      # with core.autocrlf would rewrite their line endings.
      - name: keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: test
        env:
          CARGO_TARGET_DIR: target/fuzz
          CARGO_PROFILE_DEV_OPT_LEVEL: "2"
          CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: "true"
          CARGO_PROFILE_DEV_OVERFLOW_CHECKS: "true"
        run: cargo test -p turbo-fuzz --no-fail-fast

  # The core and its C ABI tests, in their own target directory, as in
  # the features job (#358).
  windows-core:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      # The goldens and fixtures are compared byte for byte; a checkout
      # with core.autocrlf would rewrite their line endings.
      - name: keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: test (core)
        env:
          CARGO_TARGET_DIR: target/core
        run: cargo test -p turbo --no-fail-fast
      # Host-only: no NPU on the runner, so the device tests stay ignored.
      - name: test (npu)
        env:
          CARGO_TARGET_DIR: target/core
        run: cargo test -p turbo --features npu
