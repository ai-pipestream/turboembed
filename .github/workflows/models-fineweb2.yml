name: models-fineweb2

# A first look at FineWeb-2 for the language detector recipe (#429): its
# current revision, licence, configurations, the files and bytes of each
# configuration's splits, and the Parquet footer of one small test file,
# so the recipe can be written against what the dataset holds. Hugging
# Face refuses the containers the recipes are written in; GitHub's
# runners are not refused. Nothing is trained or kept.

on:
  pull_request:
    paths:
      - ".github/workflows/models-fineweb2.yml"

permissions:
  contents: read

env:
  DATASET: HuggingFaceFW/fineweb-2

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: revision, licence and files
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o info.json "https://huggingface.co/api/datasets/$DATASET?blobs=true"
          ls -l info.json
          jq -r '"sha \(.sha)", "lastModified \(.lastModified)", "license \(.cardData.license // "-")",
                 "siblings \(.siblings | length)"' info.json
          jq -r '.siblings[] | select(.rfilename | startswith("data/"))
                 | [.rfilename, (.size // .lfs.size // 0), (.lfs.sha256 // "-")] | @tsv' info.json > files.tsv
          awk -F'\t' '{ n = split($1, p, "/"); if (n == 4) { k = p[2] "\t" p[3]; c[k]++; b[k] += $2 } }
                      END { for (k in c) print k "\t" c[k] "\t" b[k] }' files.tsv | sort > splits.tsv
          wc -l files.tsv splits.tsv
          echo "== configurations (without _removed)"
          cut -f1 splits.tsv | grep -v '_removed$' | sort -u | paste -sd' ' | fold -w 200
          echo "== config, split, files, bytes (without _removed)"
          grep -v '_removed' splits.tsv
          echo "== other top-level files"
          jq -r '.siblings[] | select(.rfilename | startswith("data/") | not) | .rfilename' info.json
          echo "sha=$(jq -r .sha info.json)" >> "$GITHUB_ENV"
      - name: the dataset card on licence and splits
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o README.md "https://huggingface.co/datasets/$DATASET/resolve/$sha/README.md"
          wc -l README.md
          grep -n -i -E 'licen|odc|common crawl|terms of use|test split|test set|"test"|split: test|glotlid|columns?|fields?' README.md \
            | grep -v -E '^[0-9]+:  *- (config_name|split|path):' | head -120
      - name: one test file's Parquet footer
        run: |
          set -euo pipefail
          f=$(awk -F'\t' '$1 ~ /^data\/fao_Latn\/test\// { print $1; exit }' files.tsv)
          echo "file $f"
          curl -fsSL --retry 3 -o test.parquet "https://huggingface.co/datasets/$DATASET/resolve/$sha/$f"
          size=$(stat -c %s test.parquet)
          echo "size $size; sha256 $(sha256sum < test.parquet | cut -c1-64)"
          head -c 4 test.parquet | xxd -p
          len=$(tail -c 8 test.parquet | head -c 4 | od -An -tu4 | tr -d ' ')
          echo "footer length $len"
          tail -c $((len + 8)) test.parquet | xxd -p | tr -d '\n' | fold -w 200
          echo
