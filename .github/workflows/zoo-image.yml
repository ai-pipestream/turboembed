name: Zoo image

# The model zoo image (docs/zoo-container.md): server/Dockerfile.zoo built
# from the tree, then docker-compose.zoo.yml with RustFS and the smoke test
# in scripts/test-zoo-image.sh.

on:
  pull_request:
    paths:
      - '.github/workflows/zoo-image.yml'
      - 'docker-compose.zoo.yml'
      - 'scripts/test-zoo-image.sh'
      - 'server/Dockerfile.zoo'
      - 'server/Dockerfile.zoo.dockerignore'
      - 'server/zoo/**'
      - 'server/tests/zoo_image_smoke.rs'
      - 'server/src/catalog/**'
      - 'analysis/zoo/**'
      - 'demo/src/**'
      - 'demo/static/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/zoo-image.yml'
      - 'docker-compose.zoo.yml'
      - 'scripts/test-zoo-image.sh'
      - 'server/Dockerfile.zoo'
      - 'server/Dockerfile.zoo.dockerignore'
      - 'server/zoo/**'
      - 'server/tests/zoo_image_smoke.rs'
      - 'server/src/catalog/**'
      - 'analysis/zoo/**'
      - 'demo/src/**'
      - 'demo/static/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zoo-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zoo-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: build the zoo image
        run: docker build -f server/Dockerfile.zoo -t turbo-zoo:ci .
      - name: the image runs as a user
        run: |
          user="$(docker image inspect -f '{{.Config.User}}' turbo-zoo:ci)"
          if [ "$user" != "10001:10001" ]; then echo "the image runs as $user, not 10001:10001"; exit 1; fi
      - name: compose with RustFS, reads through the store
        run: bash scripts/test-zoo-image.sh
