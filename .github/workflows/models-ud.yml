name: models-ud

# Trains the models of release $TAG (release::UD_MODELS in
# analysis/train-recipes) on their UD 2.16 treebanks, gates them, checks
# that they are the bytes the zoo's built-in index lists at their
# addresses in the release, and, run by hand on main, publishes them with
# their cards and gate records as the release's assets through
# models-publish.yml (analysis/train-recipes/README.md, "The models
# releases"). A pull request that changes the workflow, the recipes or the
# zoo's index trains and checks, and keeps the files as an artifact;
# nothing is published.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/models-ud.yml"
      - ".github/workflows/models-publish.yml"
      - "analysis/train-recipes/**"
      - "analysis/zoo/index/zoo.json"

permissions:
  contents: read

# A new push to a pull request cancels the training still going on its
# older head; a run by hand is never cancelled. The training job runs
# on the runners TURBO_TRAIN_LINUX names, apart from the ci lanes so a
# training run of up to three hours does not hold their runners;
# publishing is hosted.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The release's tag and where its assets are published
  # (release::UD_MODELS and release::RELEASES; a test checks both).
  TAG: models-ud-2.16-1
  RELEASES: https://github.com/ai-pipestream/turboembed/releases/download/

jobs:
  ud:
    runs-on: ${{ github.event.pull_request.head.repo.fork != true && vars.TURBO_TRAIN_LINUX && fromJSON(vars.TURBO_TRAIN_LINUX) || 'ubuntu-24.04' }}
    outputs:
      tag: ${{ env.TAG }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The release's models are the ones the zoo's index lists at its
      # addresses; `zoo-index --check` below fails unless those are
      # exactly release::UD_MODELS's.
      - id: models
        name: the release's models
        run: |
          set -euo pipefail
          jq -r --arg p "$RELEASES$TAG/" '.artifacts[] | select(.files[0].url | startswith($p)) | .id' \
            analysis/zoo/index/zoo.json > "$RUNNER_TEMP/ids"
          [ -s "$RUNNER_TEMP/ids" ]
          cat "$RUNNER_TEMP/ids"
          echo "ids=$(sha256sum < "$RUNNER_TEMP/ids" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # Every download is cached, and saved as soon as it is checked, so a
      # run that fails later does not fetch it again. Only the treebanks
      # the release's models are trained on are fetched; their digests are
      # in treebank.rs, so the cache's key changes with it and with the
      # models. The zoo checks a cached file's size and digests and fetches
      # it again only when they differ, and writes a fetched file only
      # after checking it.
      - id: treebanks-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/zoo/artifacts
          key: ud-2.16-treebanks-${{ hashFiles('analysis/train-recipes/src/treebank.rs') }}-${{ steps.models.outputs.ids }}
      - name: fetch the treebanks
        env:
          USER: runner
        run: |
          set -euo pipefail
          recipes=()
          while read -r id; do recipes+=(--recipe "$id"); done < "$RUNNER_TEMP/ids"
          cargo run -q --release -p turbo-train-recipes -- fetch-ud --home "$RUNNER_TEMP/zoo" "${recipes[@]}"
      - if: steps.treebanks-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/zoo/artifacts
          key: ${{ steps.treebanks-cache.outputs.cache-primary-key }}
      # The models the gates score beside the trained ones, from the
      # addresses ud-references.txt lists, each checked against the
      # SHA-256 listed with it before it is cached. The cache's key
      # changes with the list. `ud` checks them again before it trains
      # anything.
      - id: references-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/references
          key: ud-references-${{ hashFiles('analysis/train-recipes/ud-references.txt') }}
      - name: fetch the reference models
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/references"
          while read -r sha256 url; do
            case "$sha256" in ''|'#'*) continue ;; esac
            f="$RUNNER_TEMP/references/${url##*/}"
            [ -f "$f" ] || curl -fsSL --retry 3 -o "$f" "$url"
            echo "$sha256  $f" | sha256sum -c -
          done < analysis/train-recipes/ud-references.txt
      - if: steps.references-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/references
          key: ${{ steps.references-cache.outputs.cache-primary-key }}
      - name: train and gate
        run: |
          set -euo pipefail
          recipes=()
          while read -r id; do recipes+=(--recipe "$id"); done < "$RUNNER_TEMP/ids"
          cargo run -q --release -p turbo-train-recipes -- ud --treebanks "$RUNNER_TEMP/zoo/artifacts" \
            --references "$RUNNER_TEMP/references" --out "$RUNNER_TEMP/models" "${recipes[@]}"
      - name: the models are the bytes the zoo's index lists
        run: |
          cargo run -q --release -p turbo-train-recipes -- zoo-index --models "$RUNNER_TEMP/models" \
            --release "$TAG" --check
      # A run that fails keeps what it trained, to compare with the index.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAG }}-failed-run
          path: ${{ runner.temp }}/models
          if-no-files-found: ignore
          retention-days: 7
      - name: the release's files
        run: |
          set -euo pipefail
          mkdir dist
          while read -r id; do
            d="$RUNNER_TEMP/models/$id"
            cp "$d/$id.bin" dist/
            cp "$d/card.json" "dist/$id.card.json"
            cp "$d/gate.json" "dist/$id.gate.json"
          done < "$RUNNER_TEMP/ids"
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAG }}
          path: dist
          if-no-files-found: error

  # Publishes exactly the files the ud job checked and uploaded.
  publish:
    needs: ud
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/models-publish.yml
    with:
      tag: ${{ needs.ud.outputs.tag }}
      summary: The Spanish and Catalan sentence detectors, tokenizers, part-of-speech taggers and lemmatizers, and the Finnish part-of-speech tagger and lemmatizer, the UD recipes train on UD 2.16.
