// -----------------------------------------------------------------------------
// INFERSTREAM EXTENSION — not part of the KServe Open Inference Protocol.
//
// The vendored OIP V2 service (`inference.GRPCInferenceService`, see
// open_inference_grpc.proto) stays untouched and fully interoperable; this
// file adds a SECOND, clearly separated service with inferstream-specific
// conveniences:
//
//   * Tokenize / Detokenize — batch-friendly access to the server-side
//     HuggingFace tokenizer configured for a model (input_ids, attention
//     mask, and byte offsets when requested).
//   * Embed — a typed convenience wrapper over ModelInfer for embedding
//     clients that do not want to pack/unpack raw tensors. Pooling /
//     normalize / truncate hints are forwarded to the backend as OIP
//     InferParameters ("pooling", "normalize", "truncate").
//   * ListModels — richer repository listing than per-model ModelReady /
//     ModelMetadata round-trips: name, backend, readiness, platform and
//     embedding dimension in one call.
//   * Rerank — query/document relevance scoring. Serving engines without a
//     reranker report UNAVAILABLE; the mock backend implements a
//     deterministic scorer so the wire path is testable everywhere.
//
// Clients that only speak OIP lose nothing: every Embed call is expressible
// as ModelInfer with a BYTES "text" input tensor and the InferParameters
// named above.
// -----------------------------------------------------------------------------

syntax = "proto3";
package inferstream.v1;

service InferstreamService {
  // Tokenize a batch of texts with the tokenizer configured for the model.
  rpc Tokenize(TokenizeRequest) returns (TokenizeResponse) {}

  // Reassemble text from token ids (inverse of Tokenize).
  rpc Detokenize(DetokenizeRequest) returns (DetokenizeResponse) {}

  // Embed a batch of texts. Thin typed wrapper over OIP ModelInfer: the
  // server packs the BYTES "text" tensor, forwards pooling/normalize/
  // truncate as InferParameters, and unpacks the FP32 "embedding" output.
  rpc Embed(EmbedRequest) returns (EmbedResponse) {}

  // List every configured model with backend, readiness and shape info.
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse) {}

  // Score documents against a query with the model's reranker. Engines
  // without a reranker fail with UNAVAILABLE.
  rpc Rerank(RerankRequest) returns (RerankResponse) {}
}

message TokenizeRequest {
  // Model whose tokenizer to use (must be a configured model name).
  string model_name = 1;
  // Batch of texts to tokenize.
  repeated string texts = 2;
  // Skip the tokenizer's special tokens (CLS/SEP/BOS/...). Default false:
  // special tokens ARE added, matching what embedding inference feeds the
  // model.
  bool no_special_tokens = 3;
  // Also return per-token byte offsets into the original text.
  bool with_offsets = 4;
  // Truncate each sequence to at most this many tokens (0 = tokenizer /
  // model default).
  uint32 truncate_to = 5;
  // Pad every sequence in the batch to the longest sequence's length using
  // the tokenizer's pad token; attention_mask marks real tokens with 1.
  bool pad_to_longest = 6;
}

message TokenizeResponse {
  // One encoding per input text, in request order.
  repeated Encoding encodings = 1;
}

message Encoding {
  repeated uint32 input_ids = 1;
  // 1 for real tokens, 0 for padding. Same length as input_ids.
  repeated uint32 attention_mask = 2;
  // String form of each token (useful for debugging; same length as
  // input_ids).
  repeated string tokens = 3;
  // Byte offsets into the original text; present only when
  // TokenizeRequest.with_offsets was set. Special/pad tokens carry (0, 0).
  repeated Offset offsets = 4;
}

message Offset {
  uint32 start = 1;
  uint32 end = 2;
}

message DetokenizeRequest {
  string model_name = 1;
  // Batch of token-id sequences to decode.
  repeated TokenIds sequences = 2;
  // Drop special tokens (CLS/SEP/PAD/...) from the decoded text.
  // Default false: decode everything.
  bool skip_special_tokens = 3;
}

message TokenIds {
  repeated uint32 ids = 1;
}

message DetokenizeResponse {
  // One decoded text per input sequence, in request order.
  repeated string texts = 1;
}

message EmbedRequest {
  string model_name = 1;
  repeated string texts = 2;
  // Pooling override: "mean" or "cls". Empty = backend/model default.
  // Forwarded to the backend as InferParameter "pooling".
  string pooling = 3;
  // L2-normalize override. Unset = backend/model default. Forwarded to the
  // backend as InferParameter "normalize".
  optional bool normalize = 4;
  // Truncate inputs to at most this many tokens (0 = model default).
  // Forwarded to the backend as InferParameter "truncate".
  uint32 truncate_to = 5;
}

message EmbedResponse {
  // Embedding dimension (columns of every vector below).
  uint32 dim = 1;
  // One embedding per input text, in request order.
  repeated Embedding embeddings = 2;
  string model_name = 3;
  string model_version = 4;
}

message Embedding {
  repeated float values = 1;
}

message ListModelsRequest {}

message ListModelsResponse {
  repeated ModelInfo models = 1;
}

message ModelInfo {
  // Name clients address in model_name.
  string name = 1;
  // Backend id serving this model, e.g. "mock", "onnxruntime", "ovms".
  string backend = 2;
  // Whether the model is loaded and ready to serve (OIP ModelReady).
  bool ready = 3;
  // OIP platform string from model metadata, e.g. "onnxruntime_onnx".
  // Empty when the backend cannot report metadata (e.g. engine not linked).
  string platform = 4;
  repeated string versions = 5;
  // Output embedding dimension when the model reports a 1-D FP32
  // "embedding" output; 0 when unknown or not an embedding model.
  int64 embedding_dim = 6;
  // Whether a server-side tokenizer is configured for this model
  // (Tokenize / Detokenize will work).
  bool has_tokenizer = 7;
}

message RerankRequest {
  string model_name = 1;
  string query = 2;
  repeated string documents = 3;
  // Return only the top N results (0 = all), sorted by descending score.
  uint32 top_n = 4;
}

message RerankResponse {
  // Scored documents sorted by descending score (ties broken by input
  // order), truncated to top_n when requested.
  repeated RerankResult results = 1;
}

message RerankResult {
  // Index of the document in RerankRequest.documents.
  uint32 index = 1;
  // Relevance score (backend-specific scale; higher = more relevant).
  float score = 2;
}
