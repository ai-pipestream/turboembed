[package]
name = "turbo-zoo-remote"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "turbo_zoo_remote"

[dependencies]
turbo-zoo = { path = "../analysis/zoo", default-features = false }
# The zoo server's client, over the tonic stack the server already uses
# (outside analysis/, whose crates keep to the plain dependency allowlist);
# grpcs:// is the tls feature's.
prost = "0.14"
tokio = { version = "1", features = ["rt", "time"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "channel"] }
tonic-prost = "0.14"

[features]
default = ["tls", "s3"]
# grpcs://: TLS with the public web roots (the webpki roots ureq trusts)
# or a private CA. Without it the crate builds with no TLS stack, which
# the arm64 check in CI needs, and a grpcs:// address is refused.
tls = ["tonic/tls-ring", "tonic/tls-webpki-roots"]
# s3://: an S3 bucket (AWS, RustFS) holding blobs/sha256/<hex>.
# Its HTTPS stack also reaches ring, so the arm64 check leaves it out too.
# The bucket itself is turbo-zoo's S3Bucket, over its HTTPS transport.
s3 = ["turbo-zoo/http"]
# Real service coverage, run by scripts/test-rustfs.sh.
rustfs-tests = ["s3"]

[[test]]
name = "rustfs"
required-features = ["rustfs-tests"]

[build-dependencies]
# Compiles the server's turbo_training.proto without protoc, as the
# server's own build does.
protox = "0.9"
tonic-prost-build = { version = "0.14", default-features = false, features = ["transport"] }

[dev-dependencies]
# The tests read files from a real server started in-process.
turbo-kserve = { path = "../server" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
