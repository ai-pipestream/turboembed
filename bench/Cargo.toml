[package]
name = "turbo-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "turbo-bench"
path = "src/main.rs"

[dependencies]
turbo = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
ureq = "3"
# The part-of-speech tagger `turbo-bench postag` measures (the postag feature).
turbo-analysis = { path = "../analysis/core", optional = true }
turbo-postag = { path = "../analysis/postag", optional = true }

[features]
# Links the BiLSTM-CRF part-of-speech tagger for `turbo-bench postag`
# (docs/benchmarks.md, "Part-of-speech records").
postag = ["dep:turbo-analysis", "dep:turbo-postag"]
# Links the CUDA backend into the library the tool measures (docs/cuda.md).
cuda = ["turbo/cuda"]
# cuBLAS in that library as well, for a record with TURBO_CUDA_CUBLAS set.
cuda-cublas = ["turbo/cuda-cublas"]
# Links the Level Zero backend (docs/levelzero.md).
levelzero = ["turbo/levelzero"]
# Links the NPU backend (docs/npu.md). OpenVINO is the kernel reference
# (benchmark_app -d NPU); the library still loads through Level Zero.
npu = ["turbo/npu"]
# Links the Metal backend (docs/metal.md); TEI is then its router built
# natively with Metal (--tei-bin).
metal = ["turbo/metal"]
