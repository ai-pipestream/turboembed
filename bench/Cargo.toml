[package]
name = "turbo-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "turbo-bench"
path = "src/main.rs"

[dependencies]
turbo = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
ureq = "3"

[features]
# Links the CUDA backend into the library the tool measures (docs/cuda.md).
cuda = ["turbo/cuda"]
# Links the Level Zero backend (docs/levelzero.md).
levelzero = ["turbo/levelzero"]
