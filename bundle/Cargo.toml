[package]
name = "turbo-bundle"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "turbo-bundle"
path = "src/main.rs"

[dependencies]
turbo = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
ureq = "3"
# F16 tables for a distilled static model (distill.rs).
half = "2"

turbo-gliner = { path = "../analysis/gliner" }
# The BiLSTM-CRF part-of-speech model postag-convert reads (postag.rs).
turbo-postag = { path = "../analysis/postag" }

[dev-dependencies]
# The postag-neural goldens tests/postag.rs converts.
turbo-goldens = { path = "../analysis/goldens" }
