[package]
name = "turbo-trainer-recipes"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "turbo_trainer_recipes"

[[bin]]
name = "turbo-train-head"
path = "src/main.rs"

[dependencies]
turbo = { path = "../../core" }
turbo-trainer = { path = ".." }
# Per-word encoder features, read the way the annotators read them.
turbo-analysis = { path = "../../analysis/core" }
turbo-tagger = { path = "../../analysis/tagger" }
turbo-analysis-embed = { path = "../../analysis/embed" }
turbo-eval = { path = "../../analysis/eval" }
turbo-sentdetect = { path = "../../analysis/sentdetect" }
turbo-tokenize = { path = "../../analysis/tokenize" }
turbo-gliner = { path = "../../analysis/gliner" }
turbo-schema-extract = { path = "../../analysis/schema-extract" }
turbo-relation = { path = "../../analysis/relation" }
# MASC: the recorded release, its digest and fixed split, and the Penn
# tag reader. These pins outlive the maxent recipes (plan B17).
turbo-train-recipes = { path = "../../analysis/train-recipes" }
turbo-formats = { path = "../../analysis/formats" }
# The zoo's licence classes, which a head's corpus licence maps to.
turbo-zoo = { path = "../../analysis/zoo", default-features = false }
# The receipt.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
cuda = ["turbo/cuda", "turbo-trainer/cuda"]
cuda-shim = ["turbo-trainer/cuda-shim"]

[dev-dependencies]
turbo-scratch = { path = "../../analysis/scratch" }
turbo-analysis-layers = { path = "../../analysis/layers" }
turbo-pins = { path = "../../analysis/pins" }
