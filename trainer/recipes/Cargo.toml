[package]
name = "turbo-trainer-recipes"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "turbo_trainer_recipes"

[[bin]]
name = "turbo-train-head"
path = "src/main.rs"

[dependencies]
turbo = { path = "../../core" }
turbo-trainer = { path = ".." }
# Per-word encoder features, read the way the annotators read them.
turbo-tagger = { path = "../../analysis/tagger" }
turbo-analysis-embed = { path = "../../analysis/embed" }
# MASC: the recorded release, its digest and fixed split, and the Penn
# tag reader. These pins outlive the maxent recipes (plan B17).
turbo-train-recipes = { path = "../../analysis/train-recipes" }
turbo-formats = { path = "../../analysis/formats" }
# The receipt.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
