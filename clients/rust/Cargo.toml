[package]
name = "turbo-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "turbo_client"
path = "src/lib.rs"

[dependencies]
turbo-analysis = { path = "../../analysis/core" }
turbo-analysis-layers = { path = "../../analysis/layers" }
turbo-calibration = { path = "../../analysis/calibration" }
turbo-chunker = { path = "../../analysis/chunker" }
turbo-depparse = { path = "../../analysis/depparse" }
turbo-doccat = { path = "../../analysis/doccat", features = ["classical"] }
turbo-entity-linker = { path = "../../analysis/entity-linker" }
turbo-geo = { path = "../../analysis/geo" }
turbo-glossary = { path = "../../analysis/glossary" }
turbo-group = { path = "../../analysis/group" }
turbo-hunspell = { path = "../../analysis/hunspell" }
turbo-keywords = { path = "../../analysis/keywords" }
turbo-matcher = { path = "../../analysis/matcher" }
turbo-namefind = { path = "../../analysis/namefind" }
turbo-normalize = { path = "../../analysis/normalize" }
turbo-normalize-layers = { path = "../../analysis/normalize-layers" }
turbo-numeric = { path = "../../analysis/numeric" }
turbo-query = { path = "../../analysis/query" }
turbo-relation = { path = "../../analysis/relation" }
turbo-sentdetect = { path = "../../analysis/sentdetect" }
turbo-sha256 = { path = "../../analysis/sha256" }
turbo-stem = { path = "../../analysis/stem" }
turbo-stopword = { path = "../../analysis/stopword" }
turbo-suggest = { path = "../../analysis/suggest", features = ["mmap"] }
turbo-tokenize = { path = "../../analysis/tokenize" }
turbo-unicode = { path = "../../analysis/unicode" }

turbo = { path = "../../core", optional = true }
turbo-analysis-embed = { path = "../../analysis/embed", features = ["turboquant"], optional = true }

bytes = { version = "1.9", optional = true }
prost = { version = "0.14", optional = true }
tokio = { version = "1", features = ["rt", "sync", "time"], optional = true }
tokio-stream = { version = "0.1", optional = true }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "channel"], optional = true }
tonic-prost = { version = "0.14", optional = true }

[features]
default = ["local-core", "grpc"]
# In-process hardware inference through libturbo (`core/`) and `turbo-analysis-embed`.
local-core = ["dep:turbo", "dep:turbo-analysis-embed"]
# Runtime-scoped pooled gRPC offload to `turbo-kserve`. Kept separate from `tls`
# so cross-target `aarch64` checks compile without a C toolchain for `ring`, and
# embedded mobile callers can build with `default-features = false`.
grpc = ["dep:bytes", "dep:prost", "dep:tokio", "dep:tokio-stream", "dep:tonic", "dep:tonic-prost"]
# Optional tonic server trait generation for downstream integration test harnesses.
server-stubs = ["grpc", "tonic/router"]
# TLS and mutual TLS (`https://` / client certificates) over `ring`.
tls = ["grpc", "tonic/tls-ring", "tonic/tls-webpki-roots"]
cuda = ["local-core", "turbo/cuda"]
metal = ["local-core", "turbo/metal"]
levelzero = ["local-core", "turbo/levelzero"]
levelzero-onednn = ["local-core", "turbo/levelzero-onednn"]
npu = ["local-core", "turbo/npu"]
hailo = ["local-core", "turbo/hailo"]

[build-dependencies]
protox = "0.9"
tonic-prost-build = { version = "0.14", default-features = false, features = ["transport"] }

[dev-dependencies]
turbo-kserve = { path = "../../server" }
turbo-scratch = { path = "../../analysis/scratch" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
