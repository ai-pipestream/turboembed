[package]
name = "turbo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "turbo"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_path_to_error = "0.1"
sha2 = "0.11"
# The Unicode tables upstream tokenizers uses, so the ids match it exactly.
unicode-normalization-alignments = "0.1.12"
unicode_categories = "0.1.1"
# Grapheme clusters, which SentencePiece's character map is applied by.
unicode-segmentation = "1"
# Opens the Level Zero loader at run time, so a machine without it lists
# no Intel GPU (levelzero) or NPU (npu) instead of failing to load
# libturbo.
libloading = { version = "0.9", optional = true }

[target.'cfg(unix)'.dependencies]
# mmap for a static model's table (bundle.rs).
libc = "0.2"

[build-dependencies]
# build.rs refuses a record that is not JSON, naming the file.
serde_json = "1"

[dev-dependencies]
# The Level Zero loader, which tests/levelzero.rs calls to read device
# memory from the caller's side.
libloading = "0.9"
# The upstream tokenizer sentence-transformers runs through; the tests
# compare the core's ids with it on the upstream tokenizer.json.
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
# Grapheme clusters, for where the tests expect a span to end.
unicode-segmentation = "1"
# The tests read where a model's weights are through `internals`.
turbo = { path = ".", features = ["internals"] }

[features]
default = ["cpu"]
# Backends are linked in by feature; turbo_version() lists them.
cpu = []
# NVIDIA GPUs through CUDA: needs the CUDA toolkit to build (build.rs,
# docs/cuda.md); the library then needs the NVIDIA driver alone to run.
cuda = []
# cuBLAS linked in as well, for measuring the backend's GEMMs against it
# (TURBO_CUDA_CUBLAS) and checking them in the tests; a build without it
# refuses those and needs no cuBLAS on the machine.
cuda-cublas = ["cuda"]
# Apple GPUs through Metal: needs the Xcode command line tools to build
# (build.rs, docs/metal.md).
metal = []
# Hailo accelerators through HailoRT: needs HailoRT's headers and library
# to build (build.rs, docs/hailo.md).
hailo = []
# Test-only views of the core's state, never in a release library.
internals = []
levelzero = ["dep:libloading"]
# oneDNN's kernels for the levelzero backend's F16 linear layers: needs the
# oneAPI compiler and oneDNN to build and oneDNN and the SYCL runtime to
# run (build.rs, docs/levelzero.md).
levelzero-onednn = ["levelzero"]
# Intel NPUs (AI Boost) through the Level Zero graph extension: the
# loader is opened at run time, so nothing is needed to build
# (docs/npu.md). Distinct from `levelzero`, the Intel GPU backend.
npu = ["dep:libloading"]
