# inferstream-intel example configuration (krick-1-class Intel host,
# Arc/Battlemage GPU).
#
# Default embed path: in-process OpenVINO GenAI TextEmbeddingPipeline
# (`backend = "openvino"`, feature `openvino-genai`). Plain strings in,
# openvino-tokenizers + CLS/MEAN/LAST + L2 inside the C++ pipeline, device
# GPU when the plugin is present. OVMS gRPC is out of scope — Intel
# embeddings are GenAI only.
#
#   scripts/build-intel.sh                  # SYCL + GenAI when OpenVINO is found
#   make fetch-ov-genai                     # SHA-256-pinned OV-format dirs
#   scripts/run-intel.sh --config config/intel.toml
#
# Generation: llama.cpp-SYCL in-process (`--features llamacpp-sycl`).
# Source oneAPI in the build shell AND the service unit:
#   source /opt/intel/oneapi/setvars.sh
# OpenVINO GenAI also accepts a standalone toolkit:
#   source /opt/intel/openvino/setupvars.sh
# Docs: docs/intel-genai-embed.md

listen = "0.0.0.0:8461"

# Logical model aliases from the catalog (config/catalog.toml).
# Embedding aliases resolve to `backend = "openvino"` + `models/ov/<alias>/`.
# LLM aliases: in-process llama.cpp SYCL (`make fetch-llms`).
serve = [
  "minilm",
  "mpnet",
  "minilm-l12",
  "bge-small",
  "bge-base",
  "bge-large",
  "bge-m3",
  "e5-small",
  "e5-base",
  "e5-large",
  "gte-small",
  "gte-base",
  "nomic-embed-text",
  "default-llm",
  "qwen-0.5b",
  "qwen-7b",
]

[auth]
mode = "bearer"
bearer_tokens = ["change-me"]

[[models]]
name = "mock-embed"
backend = "mock"

# Optional: server-client to the host vlm-server (Qwen2.5-VL-7B on :8085).
# Not a default-llm / qwen-0.5b / qwen-7b alias — those are in-process
# GGUF on SYCL. Leave commented unless a client needs the VL endpoint.
# [[models]]
# name = "qwen2.5-vl-7b-sycl"
# backend = "llama-cpp"
# device = "sycl"
# endpoint = "http://127.0.0.1:8085"
