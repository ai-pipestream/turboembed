# inferstream-intel example configuration (krick-1-class Intel host,
# Arc/Battlemage GPU).
#
# Primary engine: OpenVINO. Two routes:
#   * backend = "ovms"     — gRPC client to the OpenVINO Model Server already
#                            running in Docker (same KServe OIP V2 protocol;
#                            no host OpenVINO runtime install needed). This is
#                            the first working real-inference path.
#   * backend = "openvino" — in-process OpenVINO runtime (stub until the
#                            runtime is linked; needs oneAPI sourced).
# Secondary: llama.cpp built with GGML_SYCL (Docker-proven).
#
# Build & run (ovms/mock routes need no oneAPI environment):
#   cargo build -p inferstream-arch-intel --release
#   ./target/release/inferstream-intel --config config/intel.toml
#
# For the in-process openvino/SYCL routes, source oneAPI in the build shell
# AND the service unit: source /opt/intel/oneapi/setvars.sh

listen = "0.0.0.0:8461"

# Logical model aliases from the catalog (config/catalog.toml, compiled into
# the binary). Clients say `model_name: "minilm"` / `"mpnet"` and this arch
# forwards to the OVMS DAG pipelines (`minilm_pipeline` / `mpnet_pipeline`
# via the catalog's `upstream_model` remap); `"default-llm"` forwards to the
# SYCL llama-server. Same client calls work against the NVIDIA (ORT-CUDA)
# and Apple (MLX) binaries. Override the built-in catalog per host with
# `catalog = "/path/to/catalog.toml"`.
serve = ["minilm", "mpnet", "default-llm"]

[auth]
mode = "bearer"
bearer_tokens = ["change-me"]

[[models]]
name = "mock-embed"
backend = "mock"

# --- OVMS client route (primary, works today) -------------------------------
# The krick-1 OVMS container (openvino/model_server:latest-gpu, container
# "protomolt-embedder-ovms") serves these DAG pipelines from
# /work/models/ovms-embedder/config-gpu.json: string input "strings" ->
# tokenizer (CPU) -> embedding model (Battlemage GPU) -> "sentence_embedding".
#
# Model names must match what OVMS serves (GET <rest>/v1/config to list).
# The endpoint is the OVMS gRPC listener (--port, not --rest_port). On
# krick-1 only REST is published to the host, so gRPC goes to the container's
# bridge IP:
#   docker inspect -f \
#     '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' \
#     protomolt-embedder-ovms
# Override per-host without editing this file via INFERSTREAM_OVMS_ENDPOINT.

# The OVMS DAG pipelines tokenize server-side with openvino_tokenizer, so
# Tokenize/Detokenize are answered locally from the matching HuggingFace
# tokenizer.json (`tokenizer_dir`), kept next to the OVMS model dirs:
#   ~/ovms-models/hf_tokenizer_minilm/tokenizer.json  (all-MiniLM-L6-v2)
#   ~/ovms-models/hf_tokenizer_mpnet/tokenizer.json   (all-mpnet-base-v2)

# The `minilm` / `mpnet` aliases above are these routes; the catalog's
# `upstream_model` field maps each alias to the pipeline name OVMS serves.
# Explicit equivalents (clients would then address the pipeline name):
#
# # all-MiniLM-L6-v2 embeddings (384 dims).
# [[models]]
# name = "minilm_pipeline"
# backend = "ovms"
# endpoint = "http://172.22.0.2:8000"
# tokenizer_dir = "/home/krickert/ovms-models/hf_tokenizer_minilm"
#
# # all-mpnet-base-v2 embeddings (768 dims).
# [[models]]
# name = "mpnet_pipeline"
# backend = "ovms"
# endpoint = "http://172.22.0.2:8000"
# tokenizer_dir = "/home/krickert/ovms-models/hf_tokenizer_mpnet"

# --- Bake-off candidates (in-process; need host runtimes) -------------------

# Candidate A: in-process OpenVINO on the GPU plugin (stub today).
[[models]]
name = "qwen-7b-ov"
backend = "openvino"
device = "GPU"
path = "/models/qwen2.5-7b-int4-ov/openvino_model.xml"

# Candidate B: llama.cpp built with GGML_SYCL — live today as a *server
# client*: the krick-1 container "vlm-server"
# (ghcr.io/ggml-org/llama.cpp:server-intel, SYCL build on the Battlemage GPU)
# publishes the llama.cpp HTTP server on host port 8085. With `endpoint` set,
# the llama-cpp backend forwards generation (unary + token streaming via
# ModelStreamInfer) and Tokenize/Detokenize to that server instead of linking
# the engine in-process. On other hosts, omit `endpoint` and set
# INFERSTREAM_LLAMACPP_ENDPOINT instead (path-less models fall back to it).
[[models]]
name = "qwen2.5-vl-7b-sycl"
backend = "llama-cpp"
device = "sycl"
endpoint = "http://127.0.0.1:8085"

# Candidate B': in-process llama.cpp FFI (stub until the engine link lands).
[[models]]
name = "qwen-7b-sycl"
backend = "llama-cpp"
device = "sycl"
path = "/models/qwen2.5-7b-instruct-q5_k_m.gguf"

