# inferstream-nvidia example configuration (krick-class NVIDIA host).
#
# Primary engine: ONNX Runtime with the CUDA / TensorRT execution provider
# for embeddings. llama.cpp-CUDA is the secondary/GGUF path. TensorRT-LLM
# Executor is DEFERRED until generative LLMs are mandated — the skeleton and
# config surface stay ready behind --features trtllm-sys.
#
#   cargo build -p inferstream-arch-nvidia --release
#   ./target/release/inferstream-nvidia --config config/nvidia.toml

listen = "0.0.0.0:8461"

[auth]
mode = "bearer"
# Prefer INFERSTREAM_API_KEYS=key-a,key-b in the environment.
bearer_tokens = ["change-me"]

# Wire-path smoke test target; remove once engines are live.
[[models]]
name = "mock-embed"
backend = "mock"

# Primary: embeddings via ONNX Runtime (CUDA/TensorRT EP once wired).
[[models]]
name = "bge-m3"
backend = "ort"
path = "/models/bge-m3.onnx"

# Secondary/GGUF path: llama.cpp built with GGML_CUDA.
[[models]]
name = "nomic-embed-text"
backend = "llama-cpp"
device = "cuda"
path = "/models/nomic-embed-text-v1.5.Q8_0.gguf"

# DEFERRED: in-process TensorRT-LLM Executor for generation — enable only
# once generative LLMs are mandated (build with --features trtllm-sys on a
# CUDA + TRT-LLM host).
# [[models]]
# name = "llama-70b"
# backend = "trt-llm"
# engine_dir = "/engines/llama-70b-fp8"
# tokenizer_dir = "/engines/llama-70b-fp8/tokenizer"
# max_batch_size = 64
# dtype = "fp8"
