# inferstream-nvidia example configuration (krick-class NVIDIA host).
#
#   cargo build -p inferstream-arch-nvidia --release            # stub surface
#   cargo build -p inferstream-arch-nvidia --release --features trtllm-sys
#                                # real Executor link; CUDA + TRT-LLM host only
#   ./target/release/inferstream-nvidia --config config/nvidia.toml

listen = "0.0.0.0:8461"

[auth]
mode = "bearer"
# Prefer INFERSTREAM_API_KEYS=key-a,key-b in the environment.
bearer_tokens = ["change-me"]

# Wire-path smoke test target; remove once engines are live.
[[models]]
name = "mock-embed"
backend = "mock"

# Peak path: in-process TensorRT-LLM Executor. engine_dir comes from
# trtllm-build; tokenizer_dir enables server-side text <-> ids.
[[models]]
name = "llama-70b"
backend = "trt-llm"
engine_dir = "/engines/llama-70b-fp8"
tokenizer_dir = "/engines/llama-70b-fp8/tokenizer"
max_batch_size = 64
dtype = "fp8"

# Fallback/GGUF path: llama.cpp built with GGML_CUDA.
[[models]]
name = "nomic-embed-text"
backend = "llama-cpp"
device = "cuda"
path = "/models/nomic-embed-text-v1.5.Q8_0.gguf"

