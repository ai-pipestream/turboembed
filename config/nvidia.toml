# inferstream-nvidia example configuration (krick-class NVIDIA host).
#
# Primary path today: ONNX Runtime with the CUDA execution provider serving
# encoder embedding models (BGE / MiniLM). TensorRT-LLM stays an optional
# later feature for generative models.
#
#   cargo build -p inferstream-arch-nvidia --release                        # stub surface
#   cargo build -p inferstream-arch-nvidia --release --features ort-runtime # real ORT, CPU EP
#   cargo build -p inferstream-arch-nvidia --release --features ort-cuda    # real ORT, CUDA EP
#   ./target/release/inferstream-nvidia --config config/nvidia.toml
#
# Host requirements for ort-cuda: NVIDIA driver supporting CUDA 13 plus the
# CUDA 13 user-space runtime libs (see README "NVIDIA GPU host requirements"
# for the no-sudo pip-wheel route and the LD_LIBRARY_PATH to set). No
# TensorRT needed. `device = "tensorrt"` additionally needs TensorRT 10 libs
# and a build with --features ort-tensorrt.

listen = "0.0.0.0:8461"

# Logical model aliases from the catalog (config/catalog.toml, compiled into
# the binary). Clients say `model_name: "minilm"` and this arch loads the
# ORT-CUDA artifact the catalog maps it to — same client call works against
# the Intel (OVMS) and Apple (MLX) binaries. Override the built-in catalog
# per host with `catalog = "/path/to/catalog.toml"`.
#
# `minilm` is served out of the box (TEI's HF cache already on krick). The
# catalog defines many more embedding aliases for this arch — minilm-l12,
# mpnet, bge-small/base/large, bge-m3, e5-small/base/large, gte-small/base,
# nomic-embed-text — each resolving to models/onnx/<alias>/. Download the
# artifacts first, then extend this list:
#   scripts/fetch-embedding-models.sh bge-small e5-small ...
#   serve = ["minilm", "bge-small", "e5-small"]
# Smoke every serving model with scripts/smoke-embeddings.sh (see --help).
serve = ["minilm"]

[auth]
mode = "bearer"
# Prefer INFERSTREAM_API_KEYS=key-a,key-b in the environment.
bearer_tokens = ["change-me"]

# Wire-path smoke test target; keep until all engines are live.
[[models]]
name = "mock-embed"
backend = "mock"

# Explicit [[models]] entries still work alongside `serve` — use them for
# host-specific artifacts the catalog does not cover. The catalog's
# `minilm` entry is what the previous explicit minilm-l6-v2 route was:
# ORT + CUDA EP over TEI's HF snapshot cache, tokenizer_dir at the snapshot
# root so Tokenize/Detokenize answer locally. Flip its device to "cpu" via a
# catalog override to bring the model up before the CUDA EP is validated.

# BGE under /work/models is safetensors-only today; export ONNX first, e.g.:
#   optimum-cli export onnx --model BAAI/bge-large-en-v1.5 /work/models/bge-large-en-v1.5-onnx
# then route it:
# [[models]]
# name = "bge-large-en-v1.5"
# backend = "ort"
# device = "cuda"
# path = "/work/models/bge-large-en-v1.5-onnx/model.onnx"
# pooling = "cls"          # BGE uses CLS pooling
# normalize = true

# GENERATIVE (deferred from the alias catalog for now — the `default-llm`
# stub in config/catalog.toml documents the alias route): GGUF token
# streaming through llama.cpp with GGML_CUDA (build with --features
# full-cuda, or llamacpp-cuda alone; see /work/models/gguf/README.md for the
# model provenance). Streaming rides the OIP ModelStreamInfer RPC: one BYTES
# "token" chunk per decoded piece with a bool "final" parameter on the last
# chunk; request parameters max_tokens (int64), temperature (double), seed
# (int64).
[[models]]
name = "qwen2.5-0.5b-instruct"
backend = "llama-cpp"
device = "cuda"
path = "/work/models/gguf/qwen2.5-0.5b-instruct-q8_0.gguf"
n_ctx = 4096

# OPTIONAL LATER: in-process TensorRT-LLM Executor for generative models.
# Requires --features trtllm-sys plus CUDA + TRT-LLM engines on the host.
# [[models]]
# name = "llama-70b"
# backend = "trt-llm"
# engine_dir = "/engines/llama-70b-fp8"
# tokenizer_dir = "/engines/llama-70b-fp8/tokenizer"
# max_batch_size = 64
# dtype = "fp8"
