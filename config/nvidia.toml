# inferstream-nvidia example configuration (krick-class NVIDIA host).
#
# Primary path today: ONNX Runtime with the CUDA execution provider serving
# encoder embedding models (BGE / MiniLM). TensorRT-LLM stays an optional
# later feature for generative models.
#
#   cargo build -p inferstream-arch-nvidia --release                        # stub surface
#   cargo build -p inferstream-arch-nvidia --release --features ort-runtime # real ORT, CPU EP
#   cargo build -p inferstream-arch-nvidia --release --features ort-cuda    # real ORT, CUDA EP
#   ./target/release/inferstream-nvidia --config config/nvidia.toml
#
# Host requirements for ort-cuda: NVIDIA driver supporting CUDA 13 plus the
# CUDA 13 user-space runtime libs (see README "NVIDIA GPU host requirements"
# for the no-sudo pip-wheel route and the LD_LIBRARY_PATH to set). No
# TensorRT needed. `device = "tensorrt"` additionally needs TensorRT 10 libs
# and a build with --features ort-tensorrt.

listen = "0.0.0.0:8461"

[auth]
mode = "bearer"
# Prefer INFERSTREAM_API_KEYS=key-a,key-b in the environment.
bearer_tokens = ["change-me"]

# Wire-path smoke test target; keep until all engines are live.
[[models]]
name = "mock-embed"
backend = "mock"

# PRIMARY: real ONNX embedding model already on krick (TEI's HF cache).
# The tokenizer.json is auto-discovered one directory above the onnx file.
# Flip device = "cpu" to bring the model up before the CUDA EP is validated.
[[models]]
name = "minilm-l6-v2"
backend = "ort"
device = "cuda"
path = "/work/tei-model-cache/models--sentence-transformers--all-MiniLM-L6-v2/snapshots/1110a243fdf4706b3f48f1d95db1a4f5529b4d41/onnx/model.onnx"
pooling = "mean"
normalize = true
max_seq_len = 256

# BGE under /work/models is safetensors-only today; export ONNX first, e.g.:
#   optimum-cli export onnx --model BAAI/bge-large-en-v1.5 /work/models/bge-large-en-v1.5-onnx
# then route it:
# [[models]]
# name = "bge-large-en-v1.5"
# backend = "ort"
# device = "cuda"
# path = "/work/models/bge-large-en-v1.5-onnx/model.onnx"
# pooling = "cls"          # BGE uses CLS pooling
# normalize = true

