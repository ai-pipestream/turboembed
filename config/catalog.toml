[models.gte-small.apple]
backend = "mlx"
path = "thenlper/gte-small"
normalize = true
max_batch_size = 32

[models.gte-base]
description = "gte-base embeddings (768 dims, mean pooling)"

[models.gte-base.nvidia]
backend = "ort"
