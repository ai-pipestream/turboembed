# ---------------------------------------------------------------------------
# Generative LLM aliases
#
# Clients say `model_name: "default-llm"` / `"qwen-0.5b"` / `"qwen-7b"` and
# each arch loads its real generation engine. No fakes: an unsupported arch
# has no sub-table and serving the alias there fails at startup naming the
# arches that do have it.
#
#   nvidia  llama.cpp-CUDA in-process GGUF. `default-llm` uses the Qwen2.5-
#           0.5B Q8_0 already on krick at /work/models/gguf/ (validated
#           StreamInfer on that host). `qwen-0.5b` / `qwen-7b` point at
#           models/gguf/<alias>/ — populate with
#               make fetch-llms [ALIASES=qwen-0.5b,qwen-7b]
#           (cargo run -p inferstream-fetch -- --llms) which downloads the
#           official Qwen GGUF + tokenizer.json at a pinned HF revision and
#           verifies SHA-256 against models/manifests/llms.json. Tokenize answers
#           from the GGUF vocabulary (no tokenizer_dir required).
#   intel   llama.cpp-SYCL *in-process* (same shape as nvidia CUDA).
#           Populate with `make fetch-llms` (cargo run -p inferstream-fetch
#           -- --llms; no python3). Tokenize answers from the GGUF
#           vocabulary. The host vlm-server on :8085 may still run for
#           other services; default LLM aliases do not use it. Build with
#           --features llamacpp-sycl (scripts/build-intel.sh).
#   apple   native MLX (Swift mlx-swift-lm, in-process FFI). Weights from
#           `make fetch-mlx` into models/mlx/<alias>. tokenizer_dir is the
#           HF tokenizer.json fetched by `make fetch-llms` so Tokenize
#           answers in Rust (`tokenizers` crate).
# ---------------------------------------------------------------------------

# default-llm — the recommended default generation alias. Qwen2.5-0.5B
# Instruct on every arch that serves it (GGUF Q8_0 / MLX 4-bit).
[models.default-llm]
description = "default instruct LLM for streaming generation (Qwen2.5-0.5B-Instruct)"

[models.default-llm.nvidia]
backend = "llama-cpp"
device = "cuda"
path = "/work/models/gguf/qwen2.5-0.5b-instruct-q8_0.gguf"
n_ctx = 4096

[models.default-llm.intel]
backend = "llama-cpp"
device = "sycl"
path = "models/gguf/qwen-0.5b/qwen2.5-0.5b-instruct-q8_0.gguf"
n_ctx = 4096

[models.default-llm.apple]
backend = "mlx"
path = "models/mlx/qwen-0.5b"
tokenizer_dir = "models/gguf/qwen-0.5b"
max_batch_size = 1

# qwen-0.5b — named smoke-friendly Qwen2.5-0.5B-Instruct. Same fetched GGUF
# as default-llm on nvidia/intel; MLX 4-bit on apple.
# Quoted: a bare [models.qwen-0.5b] is parsed as models.qwen-0 . 5b.
[models."qwen-0.5b"]
description = "Qwen2.5-0.5B-Instruct (smoke-sized; GGUF Q8_0 / MLX 4-bit)"

[models."qwen-0.5b".nvidia]
backend = "llama-cpp"
device = "cuda"
path = "models/gguf/qwen-0.5b/qwen2.5-0.5b-instruct-q8_0.gguf"
n_ctx = 4096

[models."qwen-0.5b".intel]
backend = "llama-cpp"
device = "sycl"
path = "models/gguf/qwen-0.5b/qwen2.5-0.5b-instruct-q8_0.gguf"
n_ctx = 4096

[models."qwen-0.5b".apple]
backend = "mlx"
path = "models/mlx/qwen-0.5b"
tokenizer_dir = "models/gguf/qwen-0.5b"
max_batch_size = 1

# qwen-7b — Qwen2.5-7B-Instruct (text, not VL). Official Qwen GGUF ships
# Q5_K_M as two shards; in-process llama.cpp loads the first shard and
# finds the second next to it (nvidia CUDA / intel SYCL). apple is
# mlx-community 4-bit (~4 GB first-run download). Do not add this to
# `serve` until the host has the artifact / VRAM — it is catalogued so
# clients can ask for it after `make fetch-llms ALIASES=qwen-7b`.
[models.qwen-7b]
description = "Qwen2.5-7B-Instruct (GGUF Q5_K_M shards / MLX 4-bit)"

[models.qwen-7b.nvidia]
backend = "llama-cpp"
device = "cuda"
path = "models/gguf/qwen-7b/qwen2.5-7b-instruct-q5_k_m-00001-of-00002.gguf"
n_ctx = 4096

[models.qwen-7b.intel]
backend = "llama-cpp"
device = "sycl"
path = "models/gguf/qwen-7b/qwen2.5-7b-instruct-q5_k_m-00001-of-00002.gguf"
n_ctx = 4096

[models.qwen-7b.apple]
backend = "mlx"
path = "models/mlx/qwen-7b"
tokenizer_dir = "models/gguf/qwen-7b"
max_batch_size = 1
