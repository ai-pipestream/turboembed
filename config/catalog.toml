# ---------------------------------------------------------------------------
# Nomic
# ---------------------------------------------------------------------------

# nomic-embed-text — nomic-embed-text-v1.5, 768 dims (Matryoshka-capable).
# nvidia only: the official repo ships an ONNX export with standard
# transformers inputs (fetch script downloads it). No apple resolution —
# mlx-embeddings has no NomicBERT forward pass; no intel pipeline yet.
# Untested on krick: if the export's graph inputs differ, startup fails
# naming the offending input (never at request time).
[models.nomic-embed-text]
description = "nomic-embed-text-v1.5 embeddings (768 dims, mean pooling)"

[models.nomic-embed-text.nvidia]
backend = "ort"
device = "cuda"
path = "models/onnx/nomic-embed-text/onnx/model.onnx"
tokenizer_dir = "models/onnx/nomic-embed-text"
pooling = "mean"
normalize = true

