# inferstream model alias catalog.
#
# Logical model names clients use in `model_name`, resolved per architecture
# to the optimized artifact for that host. A client says `minilm` and gets
# ORT-CUDA on NVIDIA, the OVMS pipeline on Intel, and MLX on Apple — without
# knowing any of those paths.
#
# This file is COMPILED INTO the server binaries as the built-in catalog, so
# `serve = ["minilm"]` works out of the box. Point an arch config's
# `catalog = "path/to/catalog.toml"` at a copy to override it per host
# without rebuilding.
#
# Schema — one table per alias, one sub-table per arch it resolves on:
#
#   [models.<alias>]
#   description = "..."                # optional, surfaced in docs/errors
#
#   [models.<alias>.<arch>]            # arch: nvidia | intel | apple
#   backend = "..."                    # same fields as a [[models]] entry,
#   path / endpoint / tokenizer_dir…   # minus `name` (the alias is the name)
#
# An alias resolves only on arches with a REAL backend path — no fakes. An
# unsupported arch simply has no sub-table; serving the alias there fails at
# startup naming the arches that do have it. `upstream_model` remaps the
# alias to the name a proxy upstream (ovms) actually serves.
#
# Per-arch artifact conventions in this catalog:
#
#   nvidia  ORT (CUDA EP). `minilm` uses the TEI HF cache already on krick.
#           Every other alias points at models/onnx/<alias>/ (relative to the
#           server cwd) — populate with
#               scripts/fetch-embedding-models.sh <alias> [<alias> ...]
#           which downloads a prebuilt ONNX export + tokenizer from HF, then
#           add the alias to `serve` in config/nvidia.toml.
#   intel   OVMS DAG pipelines on the Battlemage GPU (krick-1 container
#           "protomolt-embedder-ovms"). Only pipelines that exist upstream
#           are mapped (minilm, mpnet). To add one: register the model in
#           the OVMS config (config-gpu.json graph: tokenizer -> embedding
#           model -> "sentence_embedding"), restart the container, then add
#           a [models.<alias>.intel] table here with `upstream_model` set to
#           the new pipeline name. Full walkthrough:
#           docs/adding-ovms-embedding-pipelines.md.
#   apple   MLX through the persistent Python bridge (mlx-embeddings). The
#           bridge downloads the HF repo into the cache on first use.
#           mlx-embeddings implements BERT and XLM-RoBERTa forward passes,
#           which covers MiniLM / BGE (en v1.5 + m3) / multilingual-E5 /
#           thenlper GTE. It does NOT implement MPNet or NomicBERT, so
#           `mpnet` and `nomic-embed-text` have no apple resolution.

# ---------------------------------------------------------------------------
# MiniLM family
# ---------------------------------------------------------------------------

# minilm — all-MiniLM-L6-v2, 384 dims. The smallest fully-live embedding
# path on every arch; serve this first when bringing a host up.
[models.minilm]
description = "all-MiniLM-L6-v2 sentence embeddings (384 dims, mean pooling)"

# ORT with the CUDA EP over TEI's HF snapshot cache on krick. The snapshot
# hash is stable for sentence-transformers/all-MiniLM-L6-v2; adjust if your
# cache pulled a newer revision (ls the snapshots/ dir).
[models.minilm.nvidia]
backend = "ort"
device = "cuda"
path = "/work/tei-model-cache/models--sentence-transformers--all-MiniLM-L6-v2/snapshots/1110a243fdf4706b3f48f1d95db1a4f5529b4d41/onnx/model.onnx"
tokenizer_dir = "/work/tei-model-cache/models--sentence-transformers--all-MiniLM-L6-v2/snapshots/1110a243fdf4706b3f48f1d95db1a4f5529b4d41"
pooling = "mean"
normalize = true
max_seq_len = 256

# OVMS DAG pipeline on the Battlemage GPU. `upstream_model` maps the logical
# name to the pipeline name OVMS actually serves; override the endpoint per
# host with INFERSTREAM_OVMS_ENDPOINT.
[models.minilm.intel]
backend = "ovms"
endpoint = "http://172.22.0.2:8000"
upstream_model = "minilm_pipeline"
tokenizer_dir = "/home/krickert/ovms-models/hf_tokenizer_minilm"

# MLX 4-bit MiniLM (~25 MB; downloads into the HF cache on first use).
# tokenizer_dir is populated by scripts/setup-mlx.sh.
[models.minilm.apple]
backend = "mlx"
path = "mlx-community/all-MiniLM-L6-v2-4bit"
tokenizer_dir = "models/minilm"
normalize = true
max_batch_size = 32

# minilm-l12 — all-MiniLM-L12-v2, 384 dims: same dim as minilm, deeper and
# more accurate. Intel: no OVMS pipeline yet (see the intel convention note).
[models.minilm-l12]
description = "all-MiniLM-L12-v2 sentence embeddings (384 dims, mean pooling)"

[models.minilm-l12.nvidia]
backend = "ort"
device = "cuda"
path = "models/onnx/minilm-l12/onnx/model.onnx"
tokenizer_dir = "models/onnx/minilm-l12"
pooling = "mean"
normalize = true
max_seq_len = 256

[models.minilm-l12.apple]
backend = "mlx"
path = "sentence-transformers/all-MiniLM-L12-v2"
normalize = true
max_batch_size = 32

# ---------------------------------------------------------------------------
# MPNet
# ---------------------------------------------------------------------------

# mpnet — all-mpnet-base-v2, 768 dims. No apple resolution: mlx-embeddings
# has no MPNet forward pass (BERT/XLM-R only); route Macs to bge-base for a
# comparable 768-dim English model.
[models.mpnet]
description = "all-mpnet-base-v2 sentence embeddings (768 dims, mean pooling)"

[models.mpnet.nvidia]
backend = "ort"
device = "cuda"
path = "models/onnx/mpnet/onnx/model.onnx"
tokenizer_dir = "models/onnx/mpnet"
pooling = "mean"
normalize = true

[models.mpnet.intel]
backend = "ovms"
endpoint = "http://172.22.0.2:8000"
upstream_model = "mpnet_pipeline"
tokenizer_dir = "/home/krickert/ovms-models/hf_tokenizer_mpnet"

# ---------------------------------------------------------------------------
# BGE (BAAI) — CLS pooling. English v1.5 line + multilingual bge-m3.
# ---------------------------------------------------------------------------

[models.bge-small]
description = "bge-small-en-v1.5 embeddings (384 dims, CLS pooling)"

[models.bge-small.nvidia]
backend = "ort"
device = "cuda"
path = "models/onnx/bge-small/onnx/model.onnx"
tokenizer_dir = "models/onnx/bge-small"
pooling = "cls"
normalize = true

# Verified mlx-community 4-bit conversion (~19 MB).
[models.bge-small.apple]
backend = "mlx"
path = "mlx-community/bge-small-en-v1.5-4bit"
normalize = true
max_batch_size = 32

[models.bge-base]
description = "bge-base-en-v1.5 embeddings (768 dims, CLS pooling)"

[models.bge-base.nvidia]
backend = "ort"
device = "cuda"
path = "models/onnx/bge-base/onnx/model.onnx"
tokenizer_dir = "models/onnx/bge-base"
pooling = "cls"
normalize = true

# Original BAAI safetensors (vanilla BERT); mlx-embeddings loads it directly.
[models.bge-base.apple]
backend = "mlx"
path = "BAAI/bge-base-en-v1.5"
normalize = true
max_batch_size = 32

[models.bge-large]
description = "bge-large-en-v1.5 embeddings (1024 dims, CLS pooling)"

[models.bge-large.nvidia]
backend = "ort"
device = "cuda"
path = "models/onnx/bge-large/onnx/model.onnx"
tokenizer_dir = "models/onnx/bge-large"
pooling = "cls"
normalize = true

[models.bge-large.apple]
backend = "mlx"
path = "BAAI/bge-large-en-v1.5"
normalize = true
max_batch_size = 16

# bge-m3 — multilingual, 1024-dim dense vectors (XLM-RoBERTa base, ~2.2 GB).
# Intel: no OVMS pipeline yet; the dense path would slot into the same DAG
# shape as minilm_pipeline (see the intel convention note at the top).
[models.bge-m3]
description = "bge-m3 multilingual embeddings (1024 dims, CLS pooling, dense vectors)"

[models.bge-m3.nvidia]
backend = "ort"
device = "cuda"
path = "models/onnx/bge-m3/onnx/model.onnx"
tokenizer_dir = "models/onnx/bge-m3"
pooling = "cls"
normalize = true

[models.bge-m3.apple]
backend = "mlx"
path = "BAAI/bge-m3"
normalize = true
max_batch_size = 8

# ---------------------------------------------------------------------------
# E5 (intfloat, multilingual line) — mean pooling, XLM-RoBERTa.
# NOTE: E5 models are trained with "query: " / "passage: " text prefixes;
# clients should prepend them for best retrieval quality (the server does
# not inject prefixes).
# ---------------------------------------------------------------------------

[models.e5-small]
description = "multilingual-e5-small embeddings (384 dims, mean pooling; use query:/passage: prefixes)"

[models.e5-small.nvidia]
backend = "ort"
device = "cuda"
path = "models/onnx/e5-small/onnx/model.onnx"
tokenizer_dir = "models/onnx/e5-small"
pooling = "mean"
normalize = true

[models.e5-small.apple]
backend = "mlx"
path = "intfloat/multilingual-e5-small"
normalize = true
max_batch_size = 32

[models.e5-base]
description = "multilingual-e5-base embeddings (768 dims, mean pooling; use query:/passage: prefixes)"

[models.e5-base.nvidia]
backend = "ort"
device = "cuda"
path = "models/onnx/e5-base/onnx/model.onnx"
tokenizer_dir = "models/onnx/e5-base"
pooling = "mean"
normalize = true

[models.e5-base.apple]
backend = "mlx"
path = "intfloat/multilingual-e5-base"
normalize = true
max_batch_size = 16

[models.e5-large]
description = "multilingual-e5-large embeddings (1024 dims, mean pooling; use query:/passage: prefixes)"

[models.e5-large.nvidia]
backend = "ort"
device = "cuda"
path = "models/onnx/e5-large/onnx/model.onnx"
tokenizer_dir = "models/onnx/e5-large"
pooling = "mean"
normalize = true

[models.e5-large.apple]
backend = "mlx"
path = "intfloat/multilingual-e5-large"
normalize = true
max_batch_size = 8

# ---------------------------------------------------------------------------
# GTE (thenlper v1 line — vanilla BERT, mean pooling). The newer Alibaba
# gte-*-en-v1.5 line uses a custom "NewModel" architecture that neither ORT
# tokenization defaults nor mlx-embeddings cover; stick to the v1 repos.
# ---------------------------------------------------------------------------

[models.gte-small]
