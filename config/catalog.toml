# inferstream model alias catalog.
#
# Logical model names clients use in `model_name`, resolved per architecture
# to the optimized artifact for that host. A client says `minilm` and gets
# ORT-CUDA on NVIDIA, in-process OpenVINO GenAI on Intel, and MLX on Apple —
# without knowing any of those paths.
#
# This file is COMPILED INTO the server binaries as the built-in catalog, so
# `serve = ["minilm"]` works out of the box. Point an arch config's
# `catalog = "path/to/catalog.toml"` at a copy to override it per host
# without rebuilding.
#
# Schema — one table per alias, one sub-table per arch it resolves on:
#
#   [models.<alias>]
#   description = "..."                # optional, surfaced in docs/errors
#
#   [models.<alias>.<arch>]            # arch: nvidia | intel | apple
#   # Quote aliases that contain '.' — TOML otherwise splits the key
#   # (qwen-0.5b must be written [models."qwen-0.5b"]).
#   backend = "..."                    # same fields as a [[models]] entry,
#   path / endpoint / tokenizer_dir…   # minus `name` (the alias is the name)
#
# An alias resolves only on arches with a REAL backend path — no fakes. An
# unsupported arch simply has no sub-table; serving the alias there fails at
# startup naming the arches that do have it. `upstream_model` remaps the
# alias to the name a proxy upstream (ovms) actually serves.
#
# Per-arch artifact conventions in this catalog:
#
#   nvidia  ORT (CUDA EP). `minilm` uses the TEI HF cache already on krick.
#           Every other alias points at models/onnx/<alias>/ (relative to the
#           server cwd) — populate with
#               make fetch-embeddings [ALIASES=alias1,alias2]
#           (cargo run -p inferstream-fetch) which downloads a prebuilt ONNX
#           export + tokenizer from HF at a pinned revision and verifies
#           SHA-256 against models/manifests/embeddings.json (see
#           docs/fetching-models.md); then add the alias to `serve` in
#           config/nvidia.toml. LLM GGUFs: make fetch-llms against
#           models/manifests/llms.json into models/gguf/<alias>/.
#   intel   In-process OpenVINO GenAI TextEmbeddingPipeline (default).
#           `path` is an OV-format directory (`models/ov/<alias>/`) with
#           openvino_model.xml/.bin + openvino_tokenizer.xml/.bin.
#           SHA-256-pinned in models/manifests/ov-genai-embeddings.json;
#           fetch with `make fetch-ov-genai` (inferstream-fetch --ov-genai;
#           no Python). Device GPU (Battlemage) when the plugin is present.
#           OVMS (`backend = "ovms"`) is optional/legacy — keep a catalog
#           copy or an explicit [[models]] entry to use it. Walkthrough:
#           docs/intel-genai-embed.md. Legacy OVMS pipelines:
#           docs/adding-ovms-embedding-pipelines.md.
#   apple   native MLX (Swift MLXEmbedders / MLXLLM, in-process FFI).
#           Weights from `make fetch-mlx` (`cargo xtask fetch --mlx`) into
#           models/mlx/<alias>/. BERT / XLM-RoBERTa covers MiniLM / BGE /
#           E5 / GTE. It does NOT implement MPNet or NomicBERT, so
#           `mpnet` and `nomic-embed-text` have no apple resolution.

# ---------------------------------------------------------------------------
# MiniLM family
# ---------------------------------------------------------------------------

# minilm — all-MiniLM-L6-v2, 384 dims. The smallest fully-live embedding
# path on every arch; serve this first when bringing a host up.
[models.minilm]
description = "all-MiniLM-L6-v2 sentence embeddings (384 dims, mean pooling)"

# ORT with the CUDA EP over TEI's HF snapshot cache on krick. The snapshot
# hash is stable for sentence-transformers/all-MiniLM-L6-v2; adjust if your
# cache pulled a newer revision (ls the snapshots/ dir).
[models.minilm.nvidia]
backend = "ort"
device = "cuda"
path = "/work/tei-model-cache/models--sentence-transformers--all-MiniLM-L6-v2/snapshots/1110a243fdf4706b3f48f1d95db1a4f5529b4d41/onnx/model.onnx"
tokenizer_dir = "/work/tei-model-cache/models--sentence-transformers--all-MiniLM-L6-v2/snapshots/1110a243fdf4706b3f48f1d95db1a4f5529b4d41"
pooling = "mean"
normalize = true
max_seq_len = 256

# In-process GenAI TextEmbeddingPipeline (Battlemage GPU). Fetch:
#   make fetch-ov-genai ALIASES=minilm
[models.minilm.intel]
backend = "openvino"
device = "GPU"
path = "models/ov/minilm"
tokenizer_dir = "models/ov/minilm"
pooling = "mean"
normalize = true
max_seq_len = 256

# Native MLX MiniLM (models/mlx/minilm from `cargo xtask fetch --mlx`).
[models.minilm.apple]
backend = "mlx"
path = "models/mlx/minilm"
tokenizer_dir = "models/mlx/minilm"
normalize = true
max_batch_size = 32

# minilm-l12 — all-MiniLM-L12-v2, 384 dims: same dim as minilm, deeper and
# more accurate.
[models.minilm-l12]
description = "all-MiniLM-L12-v2 sentence embeddings (384 dims, mean pooling)"

[models.minilm-l12.nvidia]
backend = "ort"
device = "cuda"
path = "models/onnx/minilm-l12/onnx/model.onnx"
tokenizer_dir = "models/onnx/minilm-l12"
pooling = "mean"
normalize = true
max_seq_len = 256

[models.minilm-l12.intel]
backend = "openvino"
device = "GPU"
path = "models/ov/minilm-l12"
tokenizer_dir = "models/ov/minilm-l12"
pooling = "mean"
normalize = true
max_seq_len = 256

[models.minilm-l12.apple]
backend = "mlx"
path = "models/mlx/minilm-l12"
tokenizer_dir = "models/mlx/minilm-l12"
normalize = true
max_batch_size = 32

