# inferstream model alias catalog.
#
# Logical model names clients use in `model_name`, resolved per architecture
# to the optimized artifact for that host. A client says `minilm` and gets
# ORT-CUDA on NVIDIA, the OVMS pipeline on Intel, and MLX on Apple — without
# knowing any of those paths.
#
# This file is COMPILED INTO the server binaries as the built-in catalog, so
# `serve = ["minilm"]` works out of the box. Point an arch config's
# `catalog = "path/to/catalog.toml"` at a copy to override it per host
# without rebuilding.
#
# Schema — one table per alias, one sub-table per arch it resolves on:
#
#   [models.<alias>]
#   description = "..."                # optional, surfaced in docs/errors
#
#   [models.<alias>.<arch>]            # arch: nvidia | intel | apple
#   backend = "..."                    # same fields as a [[models]] entry,
#   path / endpoint / tokenizer_dir…   # minus `name` (the alias is the name)
#
# An alias may resolve on a subset of arches; serving it elsewhere fails at
# startup with an actionable error. `upstream_model` remaps the alias to the
# name a proxy upstream (ovms) actually serves.

# ---------------------------------------------------------------------------
# minilm — all-MiniLM-L6-v2 sentence embeddings, 384 dims. The smallest
# fully-live embedding path on every arch.
# ---------------------------------------------------------------------------
[models.minilm]
description = "all-MiniLM-L6-v2 sentence embeddings (384 dims)"

# ORT with the CUDA EP over TEI's HF snapshot cache on krick. The snapshot
# hash is stable for sentence-transformers/all-MiniLM-L6-v2; adjust if your
# cache pulled a newer revision (ls the snapshots/ dir).
[models.minilm.nvidia]
backend = "ort"
device = "cuda"
path = "/work/tei-model-cache/models--sentence-transformers--all-MiniLM-L6-v2/snapshots/1110a243fdf4706b3f48f1d95db1a4f5529b4d41/onnx/model.onnx"
tokenizer_dir = "/work/tei-model-cache/models--sentence-transformers--all-MiniLM-L6-v2/snapshots/1110a243fdf4706b3f48f1d95db1a4f5529b4d41"
pooling = "mean"
normalize = true
max_seq_len = 256

# OVMS DAG pipeline on the Battlemage GPU (krick-1 container
# "protomolt-embedder-ovms"). `upstream_model` maps the logical name to the
# pipeline name OVMS actually serves; override the endpoint per host with
# INFERSTREAM_OVMS_ENDPOINT.
[models.minilm.intel]
backend = "ovms"
endpoint = "http://172.22.0.2:8000"
upstream_model = "minilm_pipeline"
tokenizer_dir = "/home/krickert/ovms-models/hf_tokenizer_minilm"

# MLX 4-bit MiniLM (~25 MB; the bridge worker downloads it into the HF cache
# on first use). tokenizer_dir is populated by scripts/setup-mlx.sh.
[models.minilm.apple]
backend = "mlx"
path = "mlx-community/all-MiniLM-L6-v2-4bit"
tokenizer_dir = "models/minilm"
normalize = true
max_batch_size = 32

# ---------------------------------------------------------------------------
# mpnet — all-mpnet-base-v2 sentence embeddings, 768 dims. Live on Intel via
# the OVMS pipeline today. NVIDIA route: export ONNX first
#   optimum-cli export onnx --model sentence-transformers/all-mpnet-base-v2 \
#     /work/models/mpnet-onnx
# then add [models.mpnet.nvidia] backend = "ort" path = ".../model.onnx"
# pooling = "mean" in a catalog override (or here once the export exists).
# ---------------------------------------------------------------------------
[models.mpnet]
description = "all-mpnet-base-v2 sentence embeddings (768 dims)"

[models.mpnet.intel]
backend = "ovms"
endpoint = "http://172.22.0.2:8000"
upstream_model = "mpnet_pipeline"
tokenizer_dir = "/home/krickert/ovms-models/hf_tokenizer_mpnet"

# ---------------------------------------------------------------------------
# default-llm — small instruct model for token-streaming generation
# (ModelStreamInfer). Qwen2.5-0.5B-Instruct everywhere it runs in-process;
# Intel forwards to the SYCL llama-server already running on the host.
# ---------------------------------------------------------------------------
[models.default-llm]
description = "small instruct LLM for streaming generation (Qwen2.5 class)"

# GGUF through llama.cpp with GGML_CUDA (build with --features full-cuda).
[models.default-llm.nvidia]
backend = "llama-cpp"
device = "cuda"
path = "/work/models/gguf/qwen2.5-0.5b-instruct-q8_0.gguf"
n_ctx = 4096

# Server-client mode against the SYCL llama-server container ("vlm-server",
# ghcr.io/ggml-org/llama.cpp:server-intel) on host port 8085. Override with
# INFERSTREAM_LLAMACPP_ENDPOINT by dropping `endpoint` in a catalog copy.
[models.default-llm.intel]
backend = "llama-cpp"
device = "sycl"
endpoint = "http://127.0.0.1:8085"

# MLX 4-bit Qwen2.5-0.5B-Instruct (~280 MB) through the Python bridge.
[models.default-llm.apple]
backend = "mlx"
path = "mlx-community/Qwen2.5-0.5B-Instruct-4bit"
