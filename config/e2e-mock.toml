# Local mock server that registers the same logical names the E2E harness
# requires (`minilm`, `default-llm`, `qwen-0.5b`). Embedding dim is the
# mock's 8, not 384 — run the harness with `--target mock`.
#
#   cargo run -p inferstream-server -- --config config/e2e-mock.toml
#   cargo run -p inferstream-e2e -- --target mock --addr 127.0.0.1:8461 --token ""

listen = "127.0.0.1:8461"

[auth]
mode = "none"

[[models]]
name = "minilm"
backend = "mock"

[[models]]
name = "default-llm"
backend = "mock"

[[models]]
name = "qwen-0.5b"
backend = "mock"
