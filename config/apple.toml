# inferstream-apple example configuration — NATIVE macOS HOST ONLY.
#
# Metal / the Neural Engine do not pass through Linux containers; run this
# binary directly on the Mac (launchd or plain process):
#   ./scripts/setup-mlx.sh                       # once: MLX venv + tokenizer
#   cargo build -p inferstream-arch-apple --release
#   ./target/release/inferstream-apple --config config/apple.toml
#
# MLX models are served through one persistent Python bridge worker
# (python/mlx_bridge.py inside the .venv created by setup-mlx.sh); models
# stay hot in the worker across requests. Override the worker location with
# INFERSTREAM_MLX_PYTHON / INFERSTREAM_MLX_BRIDGE. Relative paths resolve
# against the cwd the binary is started from — start it from the repo root
# or set the env vars to absolute paths.

listen = "0.0.0.0:8461"

# Logical model aliases from the catalog (config/catalog.toml, compiled into
# the binary). Clients say `model_name: "minilm"` and this arch serves the
# MLX 4-bit MiniLM (~25 MB; the bridge worker downloads it into the HF cache
# on first use, tokenizer_dir from setup-mlx.sh answers Tokenize/Detokenize
# locally). The same client calls work against the NVIDIA (ORT-CUDA) and
# Intel (OVMS) binaries. Override the built-in catalog per host with
# `catalog = "/path/to/catalog.toml"`.
#
# The default list keeps first-run downloads small: minilm (~25 MB 4-bit),
# minilm-l12 (~130 MB), bge-small (~19 MB 4-bit). The catalog also resolves
# bge-base/large, bge-m3, e5-small/base/large, and gte-small/base on this
# arch (BERT / XLM-RoBERTa models mlx-embeddings loads directly from HF);
# append any of them here — the bridge downloads on first use. `mpnet` and
# `nomic-embed-text` have NO apple resolution (mlx-embeddings lacks those
# architectures). Smoke every serving model with
# scripts/smoke-embeddings.sh.
serve = ["minilm", "minilm-l12", "bge-small"]

[auth]
mode = "bearer"
bearer_tokens = ["change-me"]

[[models]]
name = "mock-embed"
backend = "mock"

# Explicit [[models]] entries still work alongside `serve`, e.g. the old
# route (clients would then address "minilm-l6-v2" instead of "minilm"):
# [[models]]
# name = "minilm-l6-v2"
# backend = "mlx"
# path = "mlx-community/all-MiniLM-L6-v2-4bit"
# tokenizer_dir = "models/minilm"
# normalize = true
# max_batch_size = 32

# MLX generation model (streaming ModelStreamInfer, one BYTES "token" chunk
# per decoded token) — LLM aliases are deferred from the catalog for now
# (see the default-llm stub in config/catalog.toml). Qwen2.5-0.5B 4-bit is
# ~280 MB. Uncomment to serve it explicitly.
#[[models]]
#name = "qwen2.5-0.5b"
#backend = "mlx"
#path = "mlx-community/Qwen2.5-0.5B-Instruct-4bit"

# GGUF via llama.cpp-Metal on the same host.
