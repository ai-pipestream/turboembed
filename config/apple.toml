# inferstream-apple example configuration — NATIVE macOS HOST ONLY.
#
# The supported serve path is the all-Swift gRPC server (no Rust façade):
#   ./scripts/setup-mlx.sh                       # cargo xtask fetch --mlx
#   make apple                                   # swift build --package-path swift
#   ./swift/.build/release/inferstream-apple --config config/apple.toml
#
# MLX models are served in-process through mlx-swift / mlx-swift-lm.
# There is no Python worker and no Rust→Swift FFI. Weights live under
# models/mlx/<alias> (SHA-256 verified by cargo xtask fetch --mlx).

listen = "0.0.0.0:8461"

# Logical model aliases from the catalog. Clients say `model_name: "minilm"`
# and this arch serves native MLX MiniLM. Tokenize uses tokenizer.json from
# the same directory (swift-transformers).
#
# Default serve list matches `scripts/setup-mlx.sh` (minilm + bge-small +
# qwen-0.5b). Tokenize for the LLM aliases uses
# models/gguf/qwen-0.5b/tokenizer.json (`make fetch-llms ALIASES=qwen-0.5b`).
serve = ["minilm", "bge-small", "default-llm", "qwen-0.5b"]

[auth]
mode = "bearer"
bearer_tokens = ["change-me"]

[[models]]
name = "mock-embed"
backend = "mock"
